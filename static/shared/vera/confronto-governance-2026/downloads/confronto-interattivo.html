rico. La disposizione si applica anche alle società italiane con azioni ammesse ai sistemi multilaterali, in luogo dell’art. 2407, secondo comma; l’art. 154 coordina le esclusioni per le quotate. [N2]&quot;, &quot;Effetto concreto. Per gli incarichi interessati non si può considerare il multiplo del compenso come tetto della responsabilità per omessa vigilanza. Occorre ancora accertare violazione dei doveri, danno e nesso causale: la solidarietà non rende il sindaco automaticamente responsabile di qualsiasi perdita. La società e i professionisti dovrebbero riesaminare risorse disponibili per i controlli, tempo richiesto dall’incarico e coperture assicurative, senza supporre che una polizza trasferisca il dovere di vigilanza.&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P049&quot;, &quot;P050&quot;], &quot;passages&quot;: [&quot;L’articolo 149-ter non impone l’acquisto di sistemi predittivi: ne disciplina l’adeguatezza qualora siano utilizzati. L’articolo 151.2 prevede la responsabilità solidale dei sindaci con gli amministratori quando una vigilanza conforme ai doveri avrebbe evitato il danno; si applica anche alle società italiane negoziate su sistemi multilaterali, in luogo dell’articolo 2407, secondo comma. Art. 6 del decreto.&quot;, &quot;Conseguenza pratica. Compensi, coperture assicurative e organizzazione della vigilanza devono essere valutati distinguendo società chiuse, quotate e negoziate su MTF. I limiti risarcitori introdotti nel 2025 non possono essere estesi indistintamente a ogni incarico. Legge n. 35/2025, testo riportato dal Notariato.&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P099&quot;, &quot;P100&quot;], &quot;passages&quot;: [&quot;La legge n. 35/2025 aveva introdotto nell’art. 2407, secondo comma, c.c. limiti collegati a multipli del compenso annuo per la responsabilità dei sindaci, fuori dai casi di dolo. Il nuovo art. 151.2 TUF prevede per il collegio sindacale la responsabilità solidale con gli amministratori quando il danno non si sarebbe prodotto con la dovuta vigilanza. La disposizione si applica anche alle società italiane con azioni negoziate in sistemi multilaterali, in luogo dell’art. 2407, secondo comma; per le quotate rileva anche l’art. 154 TUF. Legge n. 35/2025; TUF, artt. 151.2 e 154.&quot;, &quot;Conseguenza concreta. Chi accetta o prosegue un incarico di sindaco deve identificare il mercato e il regime della società. Non può assumere che il multiplo del compenso limiti sempre la propria esposizione. La responsabilità richiede comunque i presupposti della fattispecie, compreso il rapporto causale fra omissione e danno: non è automatica per la sola appartenenza al collegio. Per vicende pregresse occorre una specifica analisi intertemporale.&quot;]}}}, {&quot;id&quot;: &quot;C16&quot;, &quot;topic&quot;: &quot;Azioni concorsuali e diritto transitorio&quot;, &quot;expected&quot;: &quot;Decadenza biennale con perimetro e dies a quo; distinguere prescrizione e procedure pendenti. Non spacciare una lettura transitoria per norma certa.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → art. 2394-bis c.c.; vedi fonti giudiziarie nel rapporto&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P082&quot;], &quot;passages&quot;: [&quot;Le denunce dei soci all&#x27;organo di controllo e al tribunale sono ricollocate negli artt. 2396-ter e 2396-quater. La modifica all&#x27;art. 2394-bis introduce un termine di decadenza biennale per le azioni indicate nelle procedure concorsuali, dalla sentenza di apertura della liquidazione giudiziale o dichiarativa dell&#x27;insolvenza. Non sostituisce tutti i termini delle azioni societarie: restano da verificare fattispecie, decorrenza e applicazione temporale, soprattutto per procedure già aperte. [S1, art. 9]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;R&quot;, &quot;refs&quot;: [&quot;P103&quot;, &quot;P229&quot;], &quot;passages&quot;: [&quot;Azioni di responsabilità. L&#x27;art. 2393 conferma l&#x27;impianto dell&#x27;azione sociale (delibera assembleare, revoca con voto di 1/5 del capitale, decadenza quinquennale dalla cessazione, rinuncia e transazione). Il nuovo art. 2394-bis introduce un termine di decadenza di due anni dalla sentenza di apertura della liquidazione giudiziale o di dichiarazione dello stato di insolvenza per le azioni verso gli organi sociali.&quot;, &quot;Termine di decadenza di 2 anni per le azioni di responsabilità, per le procedure aperte dopo il 29 aprile 2026&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D04&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P164&quot;, &quot;P174&quot;], &quot;passages&quot;: [&quot;Decadenza biennale (nuovo art. 2394-bis c.c.). Le azioni di responsabilità esercitate dagli organi della procedura vanno proposte, a pena di decadenza, entro due anni dalla sentenza di apertura della liquidazione giudiziale o dalla sentenza dichiarativa dell&#x27;insolvenza. Riguarda liquidazione giudiziale, concordato liquidatorio, l.c.a. e amministrazione straordinaria e, per rinvio, direttori generali (art. 2396) e sindaci (art. 2407).&quot;, &quot;Soluzione preferita: termine solo per le procedure aperte dopo il 29 aprile 2026; in via prudenziale agire entro il 29 aprile 2028&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P021&quot;, &quot;P132&quot;], &quot;passages&quot;: [&quot;d) Denunzie e crisi. Le denunzie degli artt. 2408 e 2409 sono riformulate negli artt. 2396-ter e 2396-quater. L&#x27;art. 2394-bis introduce un termine biennale di decadenza per l&#x27;azione di responsabilità, decorrente dalla sentenza di apertura della liquidazione giudiziale o dalla dichiarazione di insolvenza.&quot;, &quot;Disciplina transitoria. Un commento rileva l&#x27;assenza di disposizioni transitorie specifiche sulle nuove cause di incompatibilità, applicabili dal 29 aprile 2026; un altro non indica termini per gli statuti. Da verificare sul testo, anche per l&#x27;art. 2394-bis (procedure aperte dopo l&#x27;entrata in vigore) e per la sorte degli incarichi in corso.&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P101&quot;, &quot;P102&quot;], &quot;passages&quot;: [&quot;L’art. 2394-bis introduce una decadenza di due anni dalla sentenza di apertura della liquidazione giudiziale o dalla sentenza che dichiara lo stato d’insolvenza per le azioni previste dalla disposizione. È un termine per agire, da distinguere dalla prescrizione del diritto. La previsione interessa anche le azioni contro i sindaci attraverso il rinvio dell’art. 2407, nei limiti della compatibilità. [N1; N8–N9]&quot;, &quot;Il decreto non contiene una disciplina transitoria dedicata. Il Tribunale di Bari, nell’ordinanza 15 giugno 2026, R.G. 4156/2026, ha respinto l’eccezione di decadenza ritenendo che, per situazioni anteriori, il nuovo termine decorra dall’entrata in vigore della modifica. È un primo orientamento in sede cautelare, non una soluzione vincolante per tutti i giudizi. La circolare del Tribunale di Livorno dell’11 maggio 2026 aveva già invitato i curatori ad attivarsi tempestivamente, adottando un’impostazione prudenziale per le procedure pendenti. [N9–N10]&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P056&quot;], &quot;passages&quot;: [&quot;l’articolo 2394-bis introduce una decadenza biennale per le azioni delle procedure indicate dalla disposizione.&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P102&quot;], &quot;passages&quot;: [&quot;L’art. 2394-bis c.c. è aggiornato alla disciplina della crisi e introduce, per le azioni attribuite agli organi delle procedure indicate, un termine di decadenza di due anni dalla sentenza di apertura della liquidazione giudiziale o dalla sentenza che dichiara lo stato di insolvenza. Il dato ha un impatto diretto sull’organizzazione delle verifiche e dell’azione del curatore o degli altri organi legittimati. Non è una generale riduzione a due anni di ogni azione di responsabilità contro gli amministratori. L’applicazione alle procedure e alle vicende già in corso richiede una valutazione dedicata, senza presumere retroattività. Occorre inoltre individuare il momento iniziale per le procedure richiamate dal primo periodo che non si aprono con una delle sentenze indicate: non è corretto inventare una decorrenza per il concordato liquidatorio. D.lgs. 47/2026, art. 9, modifica dell’art. 2394-bis c.c..&quot;]}}}, {&quot;id&quot;: &quot;C17&quot;, &quot;topic&quot;: &quot;Decorrenze differenziate&quot;, &quot;expected&quot;: &quot;Assemblee da svolgersi dopo 30 settembre, nomine esercizio successivo, relazioni esercizio in corso; regolamenti e termini specifici.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 11, commi 5–10&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P090&quot;, &quot;P102&quot;], &quot;passages&quot;: [&quot;Assemblee dopo il 30 settembre 2026&quot;, &quot;Le nuove relazioni riguardano l&#x27;attività svolta: rinviare la relazione al 2027 non autorizza a rinviare il controllo nell&#x27;esercizio 2026. Il calendario va adattato alle società con esercizio diverso dall&#x27;anno solare. [S1, art. 11]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;R&quot;, &quot;refs&quot;: [&quot;P173&quot;, &quot;P174&quot;], &quot;passages&quot;: [&quot;Termine ridotto da 10 a 3 giorni dall&#x27;avviso (da 5 a 2 in caso di convocazione abbreviata). Nuove proposte su materie già all&#x27;ordine del giorno: soci con almeno 1/40, entro 10 giorni&quot;, &quot;29 aprile 2026&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P025&quot;, &quot;P026&quot;], &quot;passages&quot;: [&quot;Modifiche agli artt. 125-bis, 125-bis.1, 126-bis, 127, 127-ter, 135-bis, 135-undecies TUF (assemblee delle quotate)&quot;, &quot;Assemblee da svolgersi dopo il 30 settembre 2026&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;R&quot;, &quot;refs&quot;: [&quot;P230&quot;, &quot;P231&quot;], &quot;passages&quot;: [&quot;Assemblee convocate dopo il 30 settembre 2026&quot;, &quot;Nuove regole su convocazione, integrazione dell&#x27;ordine del giorno, domande, voto a distanza (quotate)&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P118&quot;, &quot;P132&quot;], &quot;passages&quot;: [&quot;Non risulta dalle fonti consultate un termine generale per riscrivere gli statuti: la riforma è in vigore dal 29 aprile 2026 e l&#x27;adeguamento è una scelta di prudenza, non un obbligo con scadenza verificata.&quot;, &quot;Disciplina transitoria. Un commento rileva l&#x27;assenza di disposizioni transitorie specifiche sulle nuove cause di incompatibilità, applicabili dal 29 aprile 2026; un altro non indica termini per gli statuti. Da verificare sul testo, anche per l&#x27;art. 2394-bis (procedure aperte dopo l&#x27;entrata in vigore) e per la sorte degli incarichi in corso.&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P127&quot;, &quot;P129&quot;], &quot;passages&quot;: [&quot;Assemblee da svolgersi dopo il 30 settembre 2026&quot;, &quot;Nuove regole assembleari TUF richiamate; conta lo svolgimento, non soltanto la convocazione&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P064&quot;, &quot;P067&quot;], &quot;passages&quot;: [&quot;applicazione delle nuove regole assembleari TUF alle assemblee successive al 30 settembre 2026;&quot;, &quot;Per una società con esercizio coincidente con l’anno solare, gli ultimi due punti riguardano rispettivamente le nomine dal 2027 e le relazioni sull’esercizio 2026. Art. 11 del decreto.&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P109&quot;, &quot;P121&quot;], &quot;passages&quot;: [&quot;Assemblee dopo il 30 settembre 2026&quot;, &quot;Le prime relazioni riferite al 2026 saranno normalmente predisposte nel 2027, ma riguarderanno attività ed evidenze dell’esercizio 2026. L’obbligo di adeguamento per le future nomine non determina da solo la cessazione anticipata di tutti gli organi in carica. D.lgs. 47/2026, art. 11.&quot;]}}}, {&quot;id&quot;: &quot;C18&quot;, &quot;topic&quot;: &quot;Statuti e rinvii&quot;, &quot;expected&quot;: &quot;Modello già desumibile; rinvio numerico diverso dalla clausola riproduttiva; evitare obbligo generalizzato di riscrittura.&quot;, &quot;source&quot;: &quot;https://www.assolombarda.it/servizi/diritto-di-impresa/documenti/consiglio-nazionale-del-notariato-n-63-2026-i&quot;, &quot;location&quot;: &quot;Studio CNN 63-2026/I, interpretazione degli statuti&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P046&quot;], &quot;passages&quot;: [&quot;Statuti esistenti. Lo studio CNN 63-2026/I ritiene che non serva un adeguamento generalizzato quando il modello adottato è già desumibile con certezza. Gli statuti che contemplano tre modelli senza sceglierne uno richiedono maggiore attenzione. Un rinvio numerico a una norma ricollocata può essere interpretato alla luce della nuova collocazione; la riproduzione testuale di una regola precedente può invece mantenere un vincolo statutario più rigoroso. Occorre quindi una verifica delle singole clausole, non una sostituzione automatica di numeri. Questa è una lettura professionale, da applicare al testo concreto dello statuto. [S4, pp. 3-9]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P243&quot;, &quot;P248&quot;], &quot;passages&quot;: [&quot;Rinvio numerico a norme spostate (es. art. 2386, co. 1-3)&quot;, &quot;Resta valida e prevale sul regime più morbido&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P128&quot;, &quot;P138&quot;], &quot;passages&quot;: [&quot;Rinvia per numero a articoli abrogati o spostati (ad esempio art. 2386, art. 2399, art. 2409)&quot;, &quot;Se la legge nuova è più mite, la clausola resta \&quot;cristallizzata\&quot; nella versione più severa; se è più rigida e cogente, prevale la legge; se è più rigida ma derogabile (concorrenza dei dirigenti), la norma integra lo statuto&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P081&quot;, &quot;P095&quot;], &quot;passages&quot;: [&quot;Cosa cambia in concreto. Per la generalità delle S.p.A. con collegio sindacale non serve una modifica statutaria: lo statuto che nomina il collegio esprime già la scelta. L&#x27;adeguamento serve se lo statuto non consente di desumere il sistema o ne rimette la scelta all&#x27;assemblea. Un adeguamento solo nominale può essere deliberato dall&#x27;organo amministrativo ex art. 2365, co. 2, c.c., secondo lo Studio CNN n. 63-2026/I e la massima n. 89 del Consiglio Notarile di Milano (Notaio Soldani; FiscoeTasse).&quot;, &quot;Se la nuova norma è più severa e imperativa (ad esempio l&#x27;ineleggibilità del convivente), prevale sempre. Se la clausola riproduce testualmente la vecchia norma e la legge si è alleggerita, la clausola resta ferma nel suo tenore originario.&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P076&quot;, &quot;P121&quot;], &quot;passages&quot;: [&quot;Statuto. Va verificato che indichi in modo univoco il sistema adottato. Uno statuto che elenca più modelli rimettendo la scelta all&#x27;assemblea può richiedere un adeguamento. I rinvii numerici ad articoli abrogati o rinumerati vanno aggiornati: i rinvii mobili alla legge reggono, le clausole che riproducono il testo precedente restano efficaci se non contrastano con norme imperative.&quot;, &quot;☐ Delibera di adeguamento: se lo statuto contiene la clausola dell&#x27;art. 2365, co. 2, c.c., l&#x27;organo amministrativo può approvare gli adeguamenti meramente conformativi (richiamata la massima CNN n. 89); altrimenti serve l&#x27;assemblea straordinaria.&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P048&quot;, &quot;P078&quot;], &quot;passages&quot;: [&quot;Per una S.p.A. già esistente, la mancanza della formula «adotta il sistema con collegio sindacale» non impone di per sé una modifica: il modello può risultare inequivocabilmente dalle altre clausole. Richiedono invece attenzione gli statuti che elencano più sistemi senza sceglierne uno o rimettono la scelta all’assemblea senza un corrispondente adeguamento statutario. Questa è una questione interpretativa, da risolvere sul testo effettivo dello statuto. [N6]&quot;, &quot;Conseguenza operativa. Aggiornare le dichiarazioni richieste agli interessati e verificare anche gli incarichi in corso, perché la legge contempla la decadenza. Per le clausole che riproducono requisiti precedenti più rigorosi occorre una valutazione autonoma: la legge più permissiva non elimina necessariamente il vincolo statutario. Il nuovo divieto inderogabile, invece, non può essere neutralizzato dal mancato aggiornamento dello statuto.&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P059&quot;, &quot;P061&quot;], &quot;passages&quot;: [&quot;Non emerge un obbligo generalizzato di riscrivere ogni statuto. Secondo lo Studio n. 63-2026/I del Notariato, la scelta del sistema può risultare dalla descrizione inequivoca degli organi, senza necessità di nominarlo espressamente.&quot;, &quot;Per i rinvii occorre distinguere la semplice rinumerazione dalla modifica sostanziale. Ad esempio, la sostituzione degli amministratori già disciplinata dall’articolo 2386 trova una nuova collocazione; l’abrogazione del numero non elimina la cooptazione. Anche le S.r.l. richiedono attenzione ai rinvii normativi, senza applicare automaticamente l’intera disciplina delle S.p.A. Studio del Notariato n. 63-2026/I.&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P123&quot;, &quot;P124&quot;], &quot;passages&quot;: [&quot;La riforma non detta una scadenza unica per riscrivere tutti gli statuti delle S.p.A. Secondo lo studio del Notariato n. 63-2026/I, se il modello è già riconoscibile dallo statuto, la sola mancanza di una formula espressa non impone una modifica.&quot;, &quot;I semplici rinvii numerici possono essere interpretati verso le disposizioni che raccolgono la disciplina precedente. Una clausola che riproduce letteralmente una vecchia regola più restrittiva può invece conservare efficacia autonoma. Le nuove norme imperative prevalgono sulle clausole incompatibili. Statuti che contemplano più modelli senza una scelta riconoscibile richiedono integrazione. Sono criteri interpretativi, non una sanatoria generale. Studio CNN n. 63-2026/I, pp. 3–6 e 9.&quot;]}}}, {&quot;id&quot;: &quot;C19&quot;, &quot;topic&quot;: &quot;Flussi semestrali e trimestrali&quot;, &quot;expected&quot;: &quot;Art. 2381-bis: almeno semestrale; quotate art. 150 TUF almeno trimestrale. Non rinviare le urgenze.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → art. 2381-bis; note art. 150 TUF&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P059&quot;], &quot;passages&quot;: [&quot;Per le S.p.A. il flusso periodico dei delegati previsto dall&#x27;art. 2381-bis resta almeno semestrale. Per le quotate, l&#x27;art. 150 TUF mantiene una comunicazione all&#x27;organo di controllo almeno trimestrale sulle materie previste. Questi intervalli non consentono di ritardare informazioni urgenti e non impongono a ogni società una reportistica mensile. [S1, art. 9 e note all&#x27;art. 150 TUF]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P201&quot;, &quot;P202&quot;], &quot;passages&quot;: [&quot;Amministratori esecutivi e delegati&quot;, &quot;Organizzazione e assetti sono competenza espressa ed esclusiva; reporting al CdA e all&#x27;organo di controllo almeno semestrale; nessuna delega sulle decisioni relative agli strumenti di crisi&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P041&quot;, &quot;P171&quot;], &quot;passages&quot;: [&quot;Norma. La gestione e l&#x27;organizzazione dell&#x27;impresa, compresa l&#x27;istituzione dell&#x27;assetto organizzativo, amministrativo e contabile, spettano esclusivamente agli amministratori (art. 2380-bis). Il consiglio determina contenuto e limiti delle deleghe, può impartire direttive e avocare operazioni; valuta l&#x27;adeguatezza degli assetti sulla base delle informazioni ricevute ed esamina i piani strategici, industriali e finanziari quando elaborati. Gli organi delegati curano l&#x27;assetto e riferiscono al consiglio e all&#x27;organo di controllo con la periodicità fissata dallo statuto e comunque almeno ogni sei mesi, anche sulle operazioni di maggior rilievo di società e controllate (art. 2381-bis). L&#x27;art. 2381-ter ribadisce il dovere di agire informati: il presidente assicura ai consiglieri informazioni adeguate sulle materie all&#x27;ordine del giorno e ciascun amministratore può chiedere agli organi delegati ulteriori informazioni.&quot;, &quot;Rivedere deleghe, riserve consiliari e verbali; definire il reporting degli organi delegati (contenuti minimi, indicatori, cadenza non oltre sei mesi)&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P111&quot;, &quot;P293&quot;], &quot;passages&quot;: [&quot;Dovere di agire informati; organi delegati riferiscono al consiglio e all&#x27;organo di controllo almeno ogni sei mesi; gli amministratori senza deleghe possono fare ragionevole affidamento sulle informazioni ricevute&quot;, &quot;☐ Fissare con gli organi delegati la periodicità della relazione (massimo sei mesi) e il suo contenuto, comprese le controllate&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P077&quot;], &quot;passages&quot;: [&quot;Assetti e flussi informativi. Se gli assetti sono compito esclusivo degli amministratori, il consiglio deve poterne documentare disegno, adeguatezza e verifica. Gli organi delegati riferiscono a consiglio e organo di controllo con la periodicità statutaria e comunque almeno semestrale (secondo il commento, da riscontrare sul testo).&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P052&quot;, &quot;P064&quot;], &quot;passages&quot;: [&quot;L’art. 2381-bis conserva la distinzione fra organi delegati, che curano gli assetti e riferiscono sulla gestione, e consiglio, che valuta l’adeguatezza degli assetti e l’andamento generale sulla base delle informazioni ricevute. Il consiglio determina contenuto e limiti delle deleghe, può impartire direttive e avocare operazioni. Il flusso degli organi delegati al consiglio e all’organo di controllo rimane almeno semestrale, salvo frequenza statutaria maggiore; per le quotate va coordinato con l’informativa almeno trimestrale dell’art. 150 TUF. [N1–N2]&quot;, &quot;Conseguenza operativa. Conviene stabilire tempi di consegna dei documenti, contenuti minimi dei rapporti, modalità delle richieste integrative e tracciamento delle risposte. Il decreto non impone un identico anticipo documentale per tutte le società. La periodicità minima delle relazioni non autorizza ad attendere la scadenza quando emerge un problema urgente.&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P031&quot;, &quot;P033&quot;], &quot;passages&quot;: [&quot;Rimangono il ruolo del consiglio nella valutazione degli assetti e l’obbligo degli organi delegati di riferire almeno semestralmente. Diventa espressa la non delegabilità delle decisioni sull’accesso agli strumenti di regolazione della crisi e dell’insolvenza, comprendenti contenuto della proposta e condizioni del piano. Art. 9 del decreto, nella banca dati del MEF.&quot;, &quot;La periodicità semestrale non è un’autorizzazione ad attendere sei mesi prima di comunicare una criticità urgente.&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P060&quot;], &quot;passages&quot;: [&quot;I flussi periodici non sono nuovi: l’art. 2381-bis conserva la periodicità almeno semestrale degli organi delegati verso consiglio e organo di controllo. Per le quotate resta la disciplina speciale dell’art. 150 TUF, con informazione tempestiva e almeno trimestrale. Nessuna delle due cadenze autorizza a rinviare informazioni urgenti. TUF, art. 150.&quot;]}}}, {&quot;id&quot;: &quot;C20&quot;, &quot;topic&quot;: &quot;Tecnologia facoltativa e controlli&quot;, &quot;expected&quot;: &quot;Nessun obbligo generale di acquistare IA. Adeguatezza degli strumenti adottati e informazione sulle politiche, ove adottate.&quot;, &quot;source&quot;: &quot;https://www.consob.it/documents/1912911/1962639/dlgs58_1998.pdf&quot;, &quot;location&quot;: &quot;Artt. 123-bis e 149-ter&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P075&quot;], &quot;passages&quot;: [&quot;Tecnologie. L&#x27;art. 149-ter impone adeguatezza e proporzionalità dei sistemi di monitoraggio continuo e controllo automatico e predittivo, qualora adottati. Le nuove lettere d-ter e d-quater dell&#x27;art. 123-bis prevedono la descrizione delle politiche, ove adottate, su tecnologie e IA e sui rischi informatici e cibernetici. Non prescrivono a tutte le società l&#x27;acquisto di un sistema IA. Se lo si usa, è ragionevole verificare qualità dei dati, limiti degli indicatori, accessi, tracciabilità e gestione degli allarmi; sono misure suggerite per rendere effettivo il controllo, non un elenco tecnico imposto dall&#x27;articolo. [S1, art. 6]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P185&quot;], &quot;passages&quot;: [&quot;Informazioni su nuove tecnologie, rischi informatici e monitoraggio digitale&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P113&quot;], &quot;passages&quot;: [&quot;Monitoraggio e intelligenza artificiale (art. 149-ter). Disciplina dei sistemi di monitoraggio continuo e degli strumenti di controllo automatici e predittivi, secondo adeguatezza e proporzionalità a natura, dimensioni e rischi dell&#x27;impresa. La relazione sul governo societario (art. 123-bis) deve descrivere, ove adottate, le politiche su uso e monitoraggio dell&#x27;IA negli assetti e sulla gestione dei rischi informatici; in assenza di tali politiche basta darne atto.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P210&quot;], &quot;passages&quot;: [&quot;Relazione sul governo societario estesa a IA, nuove tecnologie e rischi informatici e cyber&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P105&quot;, &quot;P106&quot;], &quot;passages&quot;: [&quot;L’art. 149-ter TUF disciplina l’eventuale adozione di monitoraggio continuo e strumenti automatici o predittivi, richiedendone adeguatezza e proporzione rispetto a impresa e rischi. Le nuove lettere d-ter e d-quater dell’art. 123-bis, comma 2, richiedono nella relazione sul governo societario una descrizione delle politiche su tecnologie, intelligenza artificiale e rischi informatici, se adottate. [N2]&quot;, &quot;La formula condizionale è decisiva: queste disposizioni non obbligano ogni società ad acquistare strumenti di intelligenza artificiale e non trasferiscono a un software il ruolo degli organi sociali. Restano gli eventuali obblighi discendenti da altre normative applicabili.&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P049&quot;], &quot;passages&quot;: [&quot;L’articolo 149-ter non impone l’acquisto di sistemi predittivi: ne disciplina l’adeguatezza qualora siano utilizzati. L’articolo 151.2 prevede la responsabilità solidale dei sindaci con gli amministratori quando una vigilanza conforme ai doveri avrebbe evitato il danno; si applica anche alle società italiane negoziate su sistemi multilaterali, in luogo dell’articolo 2407, secondo comma. Art. 6 del decreto.&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P091&quot;, &quot;P092&quot;], &quot;passages&quot;: [&quot;L’art. 123-bis introduce informazioni sulle politiche, ove adottate, di utilizzo delle innovazioni tecnologiche, compresa l’intelligenza artificiale, e sulle politiche relative ai rischi informatici. L’art. 149-ter richiede che gli strumenti automatici e predittivi eventualmente adottati per il controllo siano adeguati e proporzionati all’impresa e ai suoi rischi.&quot;, &quot;Non si introduce un obbligo generale di acquistare un sistema di intelligenza artificiale. Se lo si usa, la qualità dei dati, l’affidabilità dei risultati e la gestione delle anomalie diventano temi da presidiare. L’impiego dello strumento non sostituisce i doveri degli organi sociali. TUF, artt. 123-bis, comma 2, lettere d-ter e d-quater, e 149-ter.&quot;]}}}, {&quot;id&quot;: &quot;A01&quot;, &quot;topic&quot;: &quot;Assemblee e tutele dei soci&quot;, &quot;expected&quot;: &quot;Modalità a distanza, condizioni deliberative e diritto della minoranza al luogo fisico. Non una facoltà senza condizioni.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 6 → art. 125-bis.1 TUF&quot;, &quot;group&quot;: &quot;Complemento&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D02&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P169&quot;], &quot;passages&quot;: [&quot;Lo statuto può prevederla stabilmente; in alternativa il CdA può deciderla per la singola assemblea (telecomunicazione o solo rappresentante designato) con voto favorevole della maggioranza degli indipendenti. Soci con almeno 1/20 del capitale possono chiedere la presenza fisica&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P115&quot;], &quot;passages&quot;: [&quot;Assemblee (artt. 125-bis.1 e seguenti). Il consiglio può determinare modalità alternative alla riunione in presenza (anche solo telematica o tramite rappresentante designato), con regolamento approvato dalla maggioranza degli amministratori indipendenti; è possibile limitare la partecipazione alla discussione a chi superi una soglia non superiore allo 0,5 per mille del capitale, e i soci con almeno un ventesimo possono chiedere l&#x27;adunanza fisica. Le nuove regole valgono per le assemblee successive al 30 settembre 2026.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P192&quot;], &quot;passages&quot;: [&quot;Possibile svolgimento solo a distanza, con rappresentante designato o voto per corrispondenza/elettronico; rimane l&#x27;estratto dell&#x27;avviso sui quotidiani&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P083&quot;], &quot;passages&quot;: [&quot;Assemblea (quotate). In assenza di previsione statutaria l&#x27;organo amministrativo può decidere svolgimento telematico o tramite rappresentante designato; i soci con almeno 1/20 del capitale con voto possono chiedere la riunione in presenza.&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P110&quot;, &quot;P111&quot;], &quot;passages&quot;: [&quot;L’art. 125-bis.1 TUF amplia la disciplina delle modalità assembleari. Lo statuto può fissare una modalità esclusiva; se non lo fa, decide l’organo amministrativo secondo efficienza e trasparenza. La scelta consiliare di ricorrere esclusivamente alla telecomunicazione o al rappresentante designato richiede le maggioranze o approvazioni prescritte, fra cui il voto favorevole della maggioranza degli amministratori indipendenti oppure l’approvazione del consiglio di sorveglianza, e il regolamento previsto dalla norma. [N2]&quot;, &quot;I soci rappresentanti almeno un ventesimo del capitale con diritto di voto sulle materie all’ordine del giorno, o la minore soglia statutaria, possono chiedere entro cinque giorni dall’avviso una riunione in luogo fisico. La soglia eventualmente prevista per partecipare alla discussione non può superare lo 0,5 per mille del capitale e non elimina voto, proposte o domande preassembleari. Le estensioni ai sistemi multilaterali riguardano solo i commi espressamente indicati; per le cooperative operano regole proprie. [N2]&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D08&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P094&quot;], &quot;passages&quot;: [&quot;Il nuovo art. 125-bis.1 disciplina le modalità di svolgimento dell’assemblea, anche esclusivamente a distanza o tramite rappresentante designato, attraverso opzioni statutarie e deliberazioni soggette alle condizioni previste. Sono stabiliti presidi procedurali e diritti delle minoranze; la scelta della modalità non è una libertà organizzativa senza condizioni. Alcune disposizioni sono espressamente estese agli emittenti italiani su sistemi multilaterali. Per le assemblee successive al 30 settembre 2026 occorre riesaminare clausole, avvisi e procedure; ai fini dell’opzione statutaria del comma 1 rilevano le clausole adottate o modificate dopo l’entrata in vigore del decreto. TUF, art. 125-bis.1; d.lgs. 47/2026, art. 11, commi 7 e 8.&quot;]}}}, {&quot;id&quot;: &quot;A02&quot;, &quot;topic&quot;: &quot;Nuovi emittenti e PMI&quot;, &quot;expected&quot;: &quot;Opzioni subordinate a requisiti, scelte statutarie, minoranze, recesso e attuazione; non tutte le PMI né tutte le quotate.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Artt. 6 e 16 → artt. 154.1–154.5 TUF&quot;, &quot;group&quot;: &quot;Complemento&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D02&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P189&quot;, &quot;P190&quot;], &quot;passages&quot;: [&quot;Regime opzionale: elezione degli organi anche per singolo candidato invece del voto di lista, quorum ridotti per modifiche statutarie, limitazione del recesso, esenzioni ampliate per le parti correlate. Accessibile anche alle PMI già quotate entro i limiti dimensionali&quot;, &quot;Dopo i regolamenti Consob; adeguamento statuti entro 2 anni&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P116&quot;], &quot;passages&quot;: [&quot;Nuove quotazioni e PMI (artt. 154.1 ss.). Regime di governance semplificato, attivabile con modifica statutaria prima della domanda di ammissione; opt-in anche per le PMI con capitalizzazione inferiore a un miliardo, entro due anni dai regolamenti attuativi.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P207&quot;], &quot;passages&quot;: [&quot;Regime speciale opt-in (capitalizzazione sotto 1 miliardo): parti correlate, nomina alternativa al voto di lista, limiti al recesso, voto consultivo sulla remunerazione&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P104&quot;, &quot;P105&quot;], &quot;passages&quot;: [&quot;Neo-quotate e PMI quotate sotto 1 miliardo&quot;, &quot;Opzione statutaria per il regime semplificato (parti correlate, nomine, recesso, remunerazione)&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P116&quot;, &quot;P118&quot;], &quot;passages&quot;: [&quot;Gli artt. 154.1–154.5 TUF introducono un regime opzionale per gli emittenti di nuova quotazione su un mercato regolamentato italiano. L’adozione iniziale richiede una modifica statutaria prima della richiesta di ammissione e riconosce il recesso ai soci che non concorrono alla deliberazione. Sono previste facoltà in materia di elezione degli organi, quorum per modifiche statutarie, recesso e operazioni con parti correlate, entro condizioni e limiti specifici. [N2]&quot;, &quot;L’art. 16 apre il regime anche a determinate PMI secondo la definizione TUF, rispettando requisiti di capitalizzazione, consenso delle minoranze e recesso; non riguarda indistintamente le PMI secondo la definizione europea. La norma contiene rinvii testuali non perfettamente coordinati alla sezione e al comma di riferimento: per una concreta adozione occorre verificare l’interpretazione e i provvedimenti applicativi. La scadenza biennale prevista dall’articolo è collegata all’adozione del regolamento richiamato, non automaticamente al 29 aprile 2026. [N4]&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P084&quot;], &quot;passages&quot;: [&quot;Per nuove quotazioni e determinate PMI già quotate esistono inoltre opzioni e regole transitorie specifiche: la semplificazione richiede presupposti e scelte statutarie, non opera indistintamente. Art. 16 del decreto.&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P096&quot;], &quot;passages&quot;: [&quot;Gli artt. 154.1–154.5 prevedono un regime opzionale per determinati emittenti di nuova quotazione, con possibili regole alternative su elezione degli organi, modifiche statutarie, recesso e parti correlate. L’art. 16 apre un accesso transitorio a emittenti PMI che soddisfano requisiti specifici, con protezioni dei soci e rinvii regolamentari. Queste facoltà richiedono una verifica separata di ammissibilità e convenienza: non sono deroghe automaticamente disponibili per ogni società quotata. TUF, artt. 154.1–154.5; d.lgs. 47/2026, art. 16.&quot;]}}}, {&quot;id&quot;: &quot;M01&quot;, &quot;topic&quot;: &quot;Inferenza distinta dalla norma&quot;, &quot;expected&quot;: &quot;Collegare disposizione, differenza, destinatario e conseguenza; segnalare interpretazione e proporzionalità senza inventare adempimenti.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Criterio editoriale ricavato dal prompt; esempi verificati sul decreto&quot;, &quot;group&quot;: &quot;Metodo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P049&quot;, &quot;P050&quot;], &quot;passages&quot;: [&quot;L&#x27;art. 2381-bis mantiene la distinzione fra organi delegati, che curano gli assetti, e consiglio, che ne valuta l&#x27;adeguatezza sulla base delle informazioni ricevute, esamina i piani quando elaborati e valuta l&#x27;andamento della gestione. L&#x27;organo di controllo vigila. Affidare attività tecniche al direttore finanziario o a un consulente può aiutare gli amministratori a esercitare la funzione, ma non trasferisce a tali soggetti la titolarità della responsabilità organizzativa. Quest&#x27;ultima conclusione è un&#x27;inferenza dal riparto normativo. [S1, artt. 2380-bis, 2381-bis e 2396-quinquies]&quot;, &quot;Esempio. Una S.p.A. possiede un organigramma e un manuale amministrativo, ma non produce dati aggiornati sugli incassi e sui debiti in scadenza. La presenza dei documenti non basta a dimostrare il funzionamento degli assetti. Il consiglio dovrebbe acquisire informazioni sul difetto e sulle misure correttive; i delegati devono curare l&#x27;assetto e l&#x27;organo di controllo deve verificarne il concreto funzionamento. Un prospetto di tesoreria può essere uno strumento proporzionato utile, senza essere un formato universalmente imposto dal decreto.&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P231&quot;], &quot;passages&quot;: [&quot;Il messaggio di fondo: la riforma premia chi documenta. Assetti scritti, deleghe chiare, flussi tracciati e verbali accurati sono oggi la principale difesa di amministratori e controllori.&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P034&quot;, &quot;P204&quot;], &quot;passages&quot;: [&quot;Per ogni istituto distinguiamo ciò che dice la norma, ciò che cambia rispetto al regime previgente e la nostra lettura applicativa (le parti introdotte da \&quot;In concreto\&quot; sono interpretazioni, non testo di legge).&quot;, &quot;Letture nostre. Le parti \&quot;In concreto\&quot;, la cautela sui controllori in carica e il piano di azione sono valutazioni professionali, non testo di legge.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P129&quot;, &quot;P157&quot;], &quot;passages&quot;: [&quot;Lettura. Il ragionevole affidamento non è un esonero automatico. Protegge il consigliere che ha chiesto, ricevuto e valutato informazioni adeguate; non chi è rimasto inerte davanti a segnali d&#x27;allarme. Il semestre è un limite massimo: indebitamento, complessità o tensione finanziaria richiedono flussi più frequenti.&quot;, &quot;Lettura. Il collegio sindacale di una S.p.A. non quotata deve ora vigilare sull&#x27;efficacia operativa dei controlli interni, non solo sulla loro esistenza, con un approccio proporzionato ai rischi. Il decreto non coordina l&#x27;organo di controllo con l&#x27;OdV 231: dove le funzioni coincidono, conviene formalizzare il riparto in regolamento o nella lettera d&#x27;incarico.&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P075&quot;, &quot;P080&quot;], &quot;passages&quot;: [&quot;In pratica la riforma sposta il baricentro dalla forma alla prova: gli organi devono poter dimostrare come hanno organizzato, informato e vigilato.&quot;, &quot;Conflitti e informazioni riservate. Regolamento consiliare e procedure interne devono disciplinare la partecipazione dell&#x27;amministratore interessato e l&#x27;uso di dati e opportunità d&#x27;affari; la revoca per giusta causa diventa un rimedio espresso.&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P063&quot;, &quot;P064&quot;], &quot;passages&quot;: [&quot;Esempio. Un rapporto gestionale indica liquidità sufficiente, ma il consiglio riceve anche comunicazioni di pagamenti respinti. Approvare senza chiedere chiarimenti espone a contestazioni. Acquisire la riconciliazione dei dati, chiedere una previsione aggiornata e motivare la decisione documenta invece come il consiglio ha affrontato l’anomalia.&quot;, &quot;Conseguenza operativa. Conviene stabilire tempi di consegna dei documenti, contenuti minimi dei rapporti, modalità delle richieste integrative e tracciamento delle risposte. Il decreto non impone un identico anticipo documentale per tutte le società. La periodicità minima delle relazioni non autorizza ad attendere la scadenza quando emerge un problema urgente.&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P005&quot;, &quot;P027&quot;], &quot;passages&quot;: [&quot;Le disposizioni sono distinte dalle inferenze operative: queste ultime sono valutazioni applicative, non prescrizioni testuali del decreto.&quot;, &quot;Conseguenza pratica. Incaricare un consulente, acquistare un gestionale o affidare la contabilità all’esterno non esaurisce il compito degli amministratori. Occorre verificare, per esempio, chi rileva le tensioni di liquidità, chi controlla l’affidabilità dei dati e chi porta tempestivamente le criticità al consiglio.&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P052&quot;, &quot;P059&quot;], &quot;passages&quot;: [&quot;Conseguenza operativa. Il consiglio deve poter spiegare quali strutture ha adottato, chi ne cura il funzionamento e come ne valuta l’adeguatezza. Un organigramma o un manuale, da soli, non dimostrano che l’assetto funzioni: rilevano i flussi effettivi, le anomalie emerse e gli interventi effettuati. Questa è un’inferenza organizzativa coerente con i compiti di amministrazione e vigilanza, non un nuovo elenco legale di documenti obbligatori.&quot;, &quot;Esempio. Un consigliere senza deleghe riceve un piano di tesoreria che indica liquidità sufficiente, ma anche una comunicazione bancaria sulla revoca di una linea essenziale. La seconda informazione rende necessario chiedere chiarimenti e valutare l’impatto; la sola esistenza del piano non rende ragionevole l’inerzia. È una lettura applicativa delle norme, non una conclusione sulla responsabilità in un caso concreto.&quot;]}}}, {&quot;id&quot;: &quot;M02&quot;, &quot;topic&quot;: &quot;Azioni con responsabili ed esiti&quot;, &quot;expected&quot;: &quot;Una circolare operativa indica chi deve fare cosa e quale risultato conservare, distinguendo consigli da scadenze legali.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Criterio operativo del confronto; non un obbligo normativo&quot;, &quot;group&quot;: &quot;Metodo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P103&quot;, &quot;P112&quot;], &quot;passages&quot;: [&quot;12 Le attività suggerite alla società e al professionista&quot;, &quot;Si tratta di una sequenza professionale proposta per applicare la riforma; il decreto non prevede un unico adempimento denominato check-up della governance né una scadenza universale per riscrivere tutti gli statuti.&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P201&quot;, &quot;P203&quot;], &quot;passages&quot;: [&quot;Amministratori esecutivi e delegati&quot;, &quot;Formalizzare le deleghe, calendarizzare il reporting, documentare gli assetti e gli indicatori di allerta&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P158&quot;, &quot;P163&quot;], &quot;passages&quot;: [&quot;Subito&quot;, &quot;Studio, società, sindaci&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P258&quot;, &quot;P260&quot;], &quot;passages&quot;: [&quot;S.p.A. non quotate&quot;, &quot;Check-up dello statuto; delibera di adeguamento nominale se serve&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P119&quot;, &quot;P126&quot;], &quot;passages&quot;: [&quot;☐ Statuto: verificare che indichi in modo univoco il sistema di governance (art. 2380 c.c.).&quot;, &quot;☐ Quotate: valutare effetti su responsabilità dei sindaci, OPA, voto plurimo e opt-in al regime semplificato.&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P143&quot;, &quot;P151&quot;], &quot;passages&quot;: [&quot;Responsabile principale&quot;, &quot;Delibere aggiornate, contenuti dei rapporti e modalità di richiesta dei chiarimenti&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P072&quot;, &quot;P075&quot;], &quot;passages&quot;: [&quot;Soci e consulente societario&quot;, &quot;Riesaminare deleghe, materie riservate e documentazione consiliare&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P129&quot;, &quot;P137&quot;], &quot;passages&quot;: [&quot;Responsabile&quot;, &quot;Procedura consiliare e verbali che rendano ricostruibile la decisione&quot;]}}}, {&quot;id&quot;: &quot;M03&quot;, &quot;topic&quot;: &quot;Fonti primarie nel documento&quot;, &quot;expected&quot;: &quot;Riferimenti pertinenti, collegabili alle affermazioni, e limiti di lettura dichiarati. La bibliografia non prova da sola l’accesso avvenuto nel run.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Valutazione delle fonti dichiarate nei documenti, con riscontri esterni mirati&quot;, &quot;group&quot;: &quot;Metodo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P114&quot;, &quot;P120&quot;], &quot;passages&quot;: [&quot;S1. D.lgs. 27 marzo 2026 n. 47, testo ufficiale della Gazzetta Ufficiale, artt. 6, 9 e 11; PDF integrale acquisito.&quot;, &quot;La disponibilità e il contenuto di ogni singolo provvedimento attuativo Consob non sono stati verificati integralmente: non si afferma che siano tutti assenti e non si propone di usare le esenzioni prima di tale verifica. Le applicazioni a statuti individuali, S.r.l., soggetti vigilati, fatti anteriori e procedure concorsuali in corso restano da valutare sul caso concreto. Confidenza alta per il contenuto normativo direttamente letto; moderata per le inferenze organizzative; applicazione professionale necessaria per questi casi.&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P293&quot;, &quot;P301&quot;], &quot;passages&quot;: [&quot;Fonti&quot;, &quot;Fondazione Nazionale Commercialisti – Il decreto di attuazione della Legge Capitali (tavola sinottica, 28/04/2026; consigliata per il raffronto articolo per articolo, non consultata integralmente)&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P201&quot;, &quot;P203&quot;], &quot;passages&quot;: [&quot;Testo di legge. Il testo integrale dell&#x27;art. 9 non è stato letto direttamente (la pagina della Gazzetta Ufficiale consultata riporta solo il frontespizio). Il testo di artt. 2381-bis, 2390-bis e 2396-septies c.c. è stato verificato su Brocardi (aggiornato al 29 aprile 2026); per gli artt. 2380, 2380-bis, 2381-ter, 2390, 2391, 2396-quater e 2396-quinquies e per gli artt. 147-sexies, 148, 149, 149-ter, 151.2 TUF ci si è basati su fonti secondarie (CNDCEC/FNC, Notariato, studi legali). Da confrontare con il testo ufficiale prima dell&#x27;invio.&quot;, &quot;Confronto \&quot;Prima\&quot;. Il confronto con il regime previgente (artt. 2381, 2403, 2391 c.5 c.c.) si fonda su stralci del testo anteriore e su richiami delle fonti, non su una lettura integrale del testo previgente.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P023&quot;, &quot;P301&quot;], &quot;passages&quot;: [&quot;Nota di metodo: il testo integrale del decreto non è stato consultabile in forma completa durante la redazione. Le ricostruzioni si fondano su commenti professionali concordanti; i punti segnalati nella sezione 11 vanno riscontrati sul testo in G.U. prima della diffusione ai clienti.&quot;, &quot;Questa bozza non è stata riscontrata sul testo integrale in G.U.; i punti seguenti vanno confermati prima della diffusione.&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P010&quot;, &quot;P134&quot;], &quot;passages&quot;: [&quot;Avvertenza sul metodo. Questa circolare è costruita su fonti di commento e su estratti del testo; il testo integrale dell&#x27;art. 9 e delle disposizioni transitorie non è stato verificato direttamente sulla Gazzetta Ufficiale. I punti ancora da riscontrare sono raccolti nella sezione 7: prima di diffondere la circolare vanno controllati sul testo ufficiale.&quot;, &quot;Testo ufficiale. L&#x27;estratto del decreto consultato si interrompe all&#x27;art. 3; l&#x27;art. 9 e le disposizioni finali non sono stati letti direttamente. Fonte da consultare: G.U. n. 86 del 14 aprile 2026, S.O. n. 14/L.&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P203&quot;, &quot;P213&quot;], &quot;passages&quot;: [&quot;N1. D.lgs. 47/2026, art. 9: modifiche al codice civile. Fonte delle disposizioni civilistiche esposte e delle relative inferenze operative. Testo ufficiale dell’articolo 9.&quot;, &quot;Le disposizioni che rinviano a provvedimenti Consob o ministeriali richiedono, per una deliberazione concreta, l’accertamento del regolamento applicabile e della sua decorrenza. I termini assegnati al regolatore non provano da soli l’adozione del provvedimento; documenti di consultazione e proposte non equivalgono a regole definitive. La circolare espone le condizioni legislative senza attestare l’avvenuta emanazione di ciascun atto attuativo.&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P031&quot;, &quot;P085&quot;], &quot;passages&quot;: [&quot;Rimangono il ruolo del consiglio nella valutazione degli assetti e l’obbligo degli organi delegati di riferire almeno semestralmente. Diventa espressa la non delegabilità delle decisioni sull’accesso agli strumenti di regolazione della crisi e dell’insolvenza, comprendenti contenuto della proposta e condizioni del piano. Art. 9 del decreto, nella banca dati del MEF.&quot;, &quot;Nota sullo stato della bozza. Ho verificato il testo pubblicato e individuato anche lo schema correttivo, Atto del Governo n. 416; non ho confermato nelle fonti consultate un successivo testo definitivo pubblicato. La bozza non assume quindi le proposte correttive come norme vigenti. Prima della diffusione datata della circolare resta da chiudere questa verifica e, per le quotate, quella dei regolamenti applicabili. Scheda parlamentare del correttivo.&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P183&quot;, &quot;P184&quot;], &quot;passages&quot;: [&quot;Le conclusioni normative si fondano sul testo pubblicato in Gazzetta Ufficiale del d.lgs. 47/2026, in particolare sugli artt. 6, 9, 10, 11 e 16, e sul TUF consolidato ufficiale Consob, edizione settembre 2026. Il dossier parlamentare sull’Atto del Governo 331 è utilizzato per il quadro precedente e la relazione illustrativa; lo schema non sostituisce il decreto finale. Lo studio del Notariato n. 63-2026/I fornisce criteri interpretativi sugli statuti.&quot;, &quot;Restano da risolvere sulla singola posizione l’interpretazione delle clausole, l’effettiva indipendenza dei candidati, l’applicazione intertemporale delle nuove regole di responsabilità e l’accesso ai regimi opzionali. Per decisioni che dipendono da regolamenti attuativi occorre verificare l’atto applicabile alla data della deliberazione. Gli esempi illustrano conseguenze plausibili della disciplina e non esprimono un giudizio su società o persone determinate.&quot;]}}}], &quot;findings&quot;: [{&quot;id&quot;: &quot;F01&quot;, &quot;docs&quot;: {&quot;D02&quot;: [&quot;P029&quot;, &quot;P106&quot;], &quot;D03&quot;: [&quot;P056&quot;, &quot;P061&quot;], &quot;D04&quot;: [&quot;P131&quot;, &quot;P145&quot;], &quot;D05&quot;: [&quot;P020&quot;, &quot;P054&quot;]}, &quot;severity&quot;: &quot;Alta&quot;, &quot;kind&quot;: &quot;Perimetro&quot;, &quot;title&quot;: &quot;Requisiti dei controllori troppo uniformi&quot;, &quot;explanation&quot;: &quot;Le formulazioni estendono indistintamente le incompatibilità a tutti i sistemi. Il consiglio di sorveglianza civilistico ha una deroga espressa alle lettere b e c e proprie incompatibilità. Occorre correggere prima di usare il testo per nomine o decadenze. D07 omette la deroga, ma non formula la stessa estensione analitica: qui è classificato come lacuna, non come identico errore.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → art. 2409-duodecies&quot;}, {&quot;id&quot;: &quot;F02&quot;, &quot;docs&quot;: {&quot;D02&quot;: [&quot;P171&quot;, &quot;P174&quot;]}, &quot;severity&quot;: &quot;Alta&quot;, &quot;kind&quot;: &quot;Data errata&quot;, &quot;title&quot;: &quot;Articolo 126-bis anticipato al 29 aprile&quot;, &quot;explanation&quot;: &quot;La tabella attribuisce alla riduzione dei termini dell’art. 126-bis la decorrenza del 29 aprile 2026. L’art. 11 comma 7 include espressamente il 126-bis fra le norme per le assemblee da svolgersi dopo il 30 settembre. Può alterare il calcolo dei diritti dei soci.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 11, comma 7&quot;}, {&quot;id&quot;: &quot;F03&quot;, &quot;docs&quot;: {&quot;D04&quot;: [&quot;P230&quot;, &quot;P232&quot;]}, &quot;severity&quot;: &quot;Alta&quot;, &quot;kind&quot;: &quot;Evento errato&quot;, &quot;title&quot;: &quot;Convocazione confusa con svolgimento&quot;, &quot;explanation&quot;: &quot;La tabella scrive assemblee convocate dopo il 30 settembre. La legge guarda allo svolgimento: anche una convocazione precedente può riguardare un’assemblea successiva soggetta al nuovo regime.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 11, comma 7&quot;}, {&quot;id&quot;: &quot;F04&quot;, &quot;docs&quot;: {&quot;D02&quot;: [&quot;P103&quot;]}, &quot;severity&quot;: &quot;Alta&quot;, &quot;kind&quot;: &quot;Qualificazione errata&quot;, &quot;title&quot;: &quot;Decadenza quinquennale dell’azione sociale&quot;, &quot;explanation&quot;: &quot;Il quinquennio dell’art. 2393 è chiamato decadenza. Va distinto dalla nuova decadenza biennale dell’art. 2394-bis: natura e vicende del termine hanno conseguenze operative diverse. Il provvedimento di Bari richiamato nel confronto distingue espressamente i due regimi.&quot;, &quot;source&quot;: &quot;https://www.ilcaso.it/giurisprudenza/archivio/34958.pdf&quot;, &quot;location&quot;: &quot;Pagine PDF 2–3 e 5&quot;}, {&quot;id&quot;: &quot;F05&quot;, &quot;docs&quot;: {&quot;D02&quot;: [&quot;P229&quot;]}, &quot;severity&quot;: &quot;Alta&quot;, &quot;kind&quot;: &quot;Certezza eccessiva&quot;, &quot;title&quot;: &quot;Solo procedure nuove presentato come regola&quot;, &quot;explanation&quot;: &quot;L’applicazione alle sole procedure aperte dopo il 29 aprile è esposta senza qualificazione. Il decreto non contiene una disciplina transitoria dedicata. Torino la considera una tesi e invita comunque alla cautela sulle pendenti; Bari applica il termine a situazioni anteriori facendolo decorrere dall’entrata in vigore.&quot;, &quot;source&quot;: &quot;https://www.dirittodellacrisi.it/file/V2BguqusupRwF5h3MIpzqtS3DPVbAYFDRLJBsjvC.pdf/Trib.%20Torino_22.05.2026_Circolare.pdf&quot;, &quot;location&quot;: &quot;Torino, 22 maggio 2026, pp. 8–9 PDF; confronto Bari pp. 2–3&quot;}, {&quot;id&quot;: &quot;F06&quot;, &quot;docs&quot;: {&quot;D03&quot;: [&quot;P015&quot;, &quot;P189&quot;]}, &quot;severity&quot;: &quot;Media&quot;, &quot;kind&quot;: &quot;Aggiornamento&quot;, &quot;title&quot;: &quot;Riforma sanzionatoria ancora parlamentare&quot;, &quot;explanation&quot;: &quot;La circolare datata 14 ottobre afferma che il decreto sanzionatorio TUF è ancora all’esame parlamentare. Il d.lgs. 128 del 25 giugno 2026 è già pubblicato il 23 luglio ed entra in vigore il 7 agosto. È un errore di aggiornamento su un tema laterale, distinto dall’AG 416 sui rating ESG e correttivi.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/atto/serie_generale/caricaDettaglioAtto/originario?atto.codiceRedazionale=26G00145&amp;atto.dataPubblicazioneGazzetta=2026-07-23&amp;elenco30giorni=false&quot;, &quot;location&quot;: &quot;D.lgs. 128/2026, titolo e pubblicazione&quot;}, {&quot;id&quot;: &quot;F07&quot;, &quot;docs&quot;: {&quot;D05&quot;: [&quot;P041&quot;]}, &quot;severity&quot;: &quot;Media&quot;, &quot;kind&quot;: &quot;Confronto storico&quot;, &quot;title&quot;: &quot;Responsabilità prima senza graduazione&quot;, &quot;explanation&quot;: &quot;La formula “Responsabilità ex art. 2392 senza graduazione espressa” è fuorviante: natura dell’incarico, specifiche competenze e attribuzioni delegate già rilevavano. La novità dell’affidamento non va costruita cancellando il criterio precedente.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9, modifiche limitate al 2392 e testo nelle note&quot;}, {&quot;id&quot;: &quot;F08&quot;, &quot;docs&quot;: {&quot;D05&quot;: [&quot;P049&quot;, &quot;P050&quot;], &quot;D03&quot;: [&quot;P057&quot;, &quot;P058&quot;], &quot;D04&quot;: [&quot;P157&quot;]}, &quot;severity&quot;: &quot;Media&quot;, &quot;kind&quot;: &quot;Confronto storico&quot;, &quot;title&quot;: &quot;Vigilanza precedente descritta come formale&quot;, &quot;explanation&quot;: &quot;D05 qualifica categoricamente la vigilanza precedente come formale e retrospettiva: non è una ricostruzione adeguata del vecchio 2403. D03 e D04 usano una contrapposizione simile, ma D03 ricorda anche la precedente vigilanza sugli assetti: per questi passaggi il rilievo è di formulazione eccessiva, non di totale ignoranza della disciplina.&quot;, &quot;source&quot;: &quot;https://documenti.camera.it/leg19/dossier/pdf/FI0144.pdf&quot;, &quot;location&quot;: &quot;Vecchio art. 2403 nella colonna del testo previgente, p. 94 PDF&quot;}, {&quot;id&quot;: &quot;F09&quot;, &quot;docs&quot;: {&quot;D02&quot;: [&quot;P213&quot;, &quot;P214&quot;], &quot;D04&quot;: [&quot;P114&quot;, &quot;P268&quot;], &quot;D05&quot;: [&quot;P098&quot;, &quot;P099&quot;]}, &quot;severity&quot;: &quot;Media&quot;, &quot;kind&quot;: &quot;Soggetto ambiguo&quot;, &quot;title&quot;: &quot;Divieto generalizzato ai dirigenti strategici&quot;, &quot;explanation&quot;: &quot;Le sintesi e le azioni sui contratti fanno leggere il nuovo 2390 come un divieto rivolto a tutti i dirigenti strategici. La modifica riguarda l’amministratore che assume tali ruoli presso concorrenti; i DG hanno la distinta norma 2396-bis. D08 P062 merita anch’esso una precisazione del soggetto, ma non formula la medesima tabella di obblighi generalizzati.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → artt. 2390 e 2396-bis&quot;}, {&quot;id&quot;: &quot;F10&quot;, &quot;docs&quot;: {&quot;D04&quot;: [&quot;P163&quot;, &quot;P189&quot;]}, &quot;severity&quot;: &quot;Alta&quot;, &quot;kind&quot;: &quot;Condizione omessa&quot;, &quot;title&quot;: &quot;Comunicazione Consob descritta troppo ampia&quot;, &quot;explanation&quot;: &quot;Il testo parla di comunicare gli atti o fatti accertati senza conservare la condizione che possano costituire irregolarità di gestione o violazioni di legge o statuto. La riformulazione normativa non equivale a inviare qualsiasi fatto emerso nella vigilanza.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 6 → art. 149, comma 2 TUF&quot;}, {&quot;id&quot;: &quot;F11&quot;, &quot;docs&quot;: {&quot;D04&quot;: [&quot;P203&quot;, &quot;P205&quot;]}, &quot;severity&quot;: &quot;Bassa&quot;, &quot;kind&quot;: &quot;Riferimento&quot;, &quot;title&quot;: &quot;Downlisting citato con articolo errato&quot;, &quot;explanation&quot;: &quot;La tabella indica art. 113 comma 1-bis; il riferimento pertinente è art. 133 comma 1-bis. La stessa circolare lo cita correttamente nella tabella delle decorrenze.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Artt. 6 e 11; art. 133, comma 1-bis TUF&quot;}, {&quot;id&quot;: &quot;F12&quot;, &quot;docs&quot;: {&quot;D02&quot;: [&quot;P266&quot;], &quot;D04&quot;: [&quot;P110&quot;, &quot;P111&quot;]}, &quot;severity&quot;: &quot;Bassa&quot;, &quot;kind&quot;: &quot;Riferimento&quot;, &quot;title&quot;: &quot;Informativa semestrale collocata nel ter&quot;, &quot;explanation&quot;: &quot;La cadenza dei delegati è nell’art. 2381-bis. Il 2381-ter disciplina il dovere di informazione e il ragionevole affidamento. Correggere il rinvio senza cambiare la cadenza esposta.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → artt. 2381-bis e 2381-ter&quot;}], &quot;pairs&quot;: [{&quot;name&quot;: &quot;Sol&quot;, &quot;baseline&quot;: &quot;D07&quot;, &quot;vera&quot;: &quot;D01&quot;, &quot;verdict&quot;: &quot;Vantaggio netto Vera&quot;, &quot;reason&quot;: &quot;Vera aggiunge eccezione del dualistico, regole TUF, dettaglio della responsabilità e perimetri. La sintesi senza Vera è solida sui temi trattati, ma meno completa per il prompt.&quot;, &quot;caution&quot;: &quot;Non confondere maggiore copertura con un miglioramento misurato del modello: sono due singoli elaborati.&quot;}, {&quot;name&quot;: &quot;Astra&quot;, &quot;baseline&quot;: &quot;D06&quot;, &quot;vera&quot;: &quot;D08&quot;, &quot;verdict&quot;: &quot;Esito misto, entrambe forti&quot;, &quot;reason&quot;: &quot;Codex è più ampio su rimedi, assemblee, nuovi emittenti e giurisprudenza. Vera tratta meglio la sostituzione nel monistico e mantiene il fuoco sulla governance; cita anche il TUF consolidato Consob.&quot;, &quot;caution&quot;: &quot;Non emerge un miglioramento complessivo netto attribuibile a Vera in questa coppia.&quot;}, {&quot;name&quot;: &quot;Sonnet&quot;, &quot;baseline&quot;: &quot;D03&quot;, &quot;vera&quot;: &quot;D05&quot;, &quot;verdict&quot;: &quot;Vantaggio Cowork senza Vera&quot;, &quot;reason&quot;: &quot;Cowork copre più disciplina TUF, scadenze, statuti e indipendenza. Vera lascia aperte verifiche risolvibili e semplifica male alcuni confronti storici. Anche Cowork richiede correzioni di perimetro e aggiornamento.&quot;, &quot;caution&quot;: &quot;La maggiore brevità di Vera non spiega da sola le lacune di ricerca o le formulazioni errate.&quot;}, {&quot;name&quot;: &quot;Opus&quot;, &quot;baseline&quot;: &quot;D02&quot;, &quot;vera&quot;: &quot;D04&quot;, &quot;verdict&quot;: &quot;Miglioramento parziale con Vera&quot;, &quot;reason&quot;: &quot;Vera rende esplicita la mancata lettura integrale e tratta con maggiore cautela le procedure pendenti. Entrambe necessitano correzioni; Vera conserva errori su decorrenze, perimetri e segnalazioni Consob.&quot;, &quot;caution&quot;: &quot;Vantaggio nella prudenza e in alcuni approfondimenti, non una vittoria netta sulla precisione complessiva.&quot;}], &quot;statuses&quot;: {&quot;U&quot;: &quot;Trattazione utile&quot;, &quot;P&quot;: &quot;Parziale / sintetica&quot;, &quot;A&quot;: &quot;Non trattato&quot;, &quot;R&quot;: &quot;Da correggere&quot;}, &quot;scope&quot;: &quot;20 verifiche del nucleo, 2 complementi e 3 criteri di metodo. Lettura integrale; verifica esterna mirata, non certificazione frase per frase.&quot;, &quot;provenance&quot;: &quot;Stesso prompt e accesso alle fonti confermati dall’utente; nomi modelli e configurazioni derivano dai file. Nessun log di esecuzione disponibile. Opus senza Vera rinominato Cowork dall’utente; hash invariato.&quot;}&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;circolari-compare&#x27;);
  const data = JSON.parse(document.getElementById(&#x27;circolari-data&#x27;).textContent);
  const left = root.querySelector(&#x27;#circolari-left&#x27;);
  const right = root.querySelector(&#x27;#circolari-right&#x27;);
  const topic = root.querySelector(&#x27;#circolari-topic&#x27;);
  const standard = root.querySelector(&#x27;#circolari-standard&#x27;);
  const passages = root.querySelector(&#x27;#circolari-passages&#x27;);
