      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

&lt;script type=&quot;application/json&quot; id=&quot;circolari-data&quot;&gt;{&quot;date&quot;: &quot;2026-10-14&quot;, &quot;documents&quot;: [{&quot;id&quot;: &quot;D01&quot;, &quot;short&quot;: &quot;Vera · Sol&quot;}, {&quot;id&quot;: &quot;D02&quot;, &quot;short&quot;: &quot;Cowork · Opus&quot;}, {&quot;id&quot;: &quot;D03&quot;, &quot;short&quot;: &quot;Cowork · Sonnet&quot;}, {&quot;id&quot;: &quot;D04&quot;, &quot;short&quot;: &quot;Vera · Opus&quot;}, {&quot;id&quot;: &quot;D05&quot;, &quot;short&quot;: &quot;Vera · Sonnet&quot;}, {&quot;id&quot;: &quot;D06&quot;, &quot;short&quot;: &quot;Codex · Astra&quot;}, {&quot;id&quot;: &quot;D07&quot;, &quot;short&quot;: &quot;Codex · Sol&quot;}, {&quot;id&quot;: &quot;D08&quot;, &quot;short&quot;: &quot;Vera · Astra&quot;}], &quot;rows&quot;: [{&quot;id&quot;: &quot;C01&quot;, &quot;topic&quot;: &quot;Tre sistemi e scelta del modello&quot;, &quot;expected&quot;: &quot;I sistemi esistevano già; cambia la posizione normativa. La scelta e il cambio del modello richiedono lettura dello statuto.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → art. 2380 c.c.&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P028&quot;, &quot;P045&quot;], &quot;passages&quot;: [&quot;Prima della riforma, l&#x27;art. 2380 prevedeva il sistema tradizionale in mancanza di diversa scelta statutaria. Oggi lo statuto adotta uno dei tre sistemi, identificati attraverso l&#x27;organo di controllo. La disciplina è costruita con disposizioni comuni seguite da regole specifiche di ciascun modello. [S1, art. 9; S3, tabelle di confronto pp. 93-114]&quot;, &quot;La conseguenza interpretativa è che la scelta del modello richiede una valutazione coerente con azionariato, dimensioni, organizzazione e competenze disponibili. Il decreto non impone di cambiare modello a una società che opera correttamente con il collegio sindacale. Un eventuale passaggio deve disciplinare composizione, nomine, continuità dei controlli ed efficacia della modifica; l&#x27;art. 2380 conserva una decorrenza suppletiva legata all&#x27;approvazione del bilancio dell&#x27;esercizio successivo, salvo diversa deliberazione. [S1, art. 9]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P034&quot;, &quot;P055&quot;], &quot;passages&quot;: [&quot;Il sistema tradizionale non è più il modello \&quot;di default\&quot;: il nuovo art. 2380, co. 1, impone allo statuto di adottare uno dei tre sistemi, posti su un piano di pari dignità.&quot;, &quot;In concreto: la scelta del modello diventa una decisione organizzativa da motivare rispetto all&#x27;impresa, non un automatismo. Per le S.p.A. che già usano il collegio sindacale il cambiamento è soprattutto di lettura delle norme; per chi valuta un modello alternativo, oggi la disciplina è completa e autonoma, quindi più prevedibile.&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P036&quot;, &quot;P038&quot;], &quot;passages&quot;: [&quot;Norma. Lo statuto adotta uno dei tre sistemi, identificati dall&#x27;organo di controllo che li caratterizza: collegio sindacale, consiglio di sorveglianza, comitato per il controllo sulla gestione. Le regole comuni ai tre modelli sono raccolte in un blocco generale; ciascun modello ha poi una disciplina propria, senza rinvii al sistema \&quot;tradizionale\&quot;.&quot;, &quot;In concreto. Nelle nuove costituzioni la scelta va espressa. Per gli statuti esistenti, se dal testo emerge con certezza il modello tradizionale (ad esempio per le norme dedicate al \&quot;collegio sindacale\&quot;) non serve alcuna modifica. Vanno invece integrati gli statuti che si limitano a disciplinare tutti e tre i sistemi senza sceglierne uno, o che rimettono la scelta all&#x27;assemblea: nessun modello è più residuale.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P067&quot;, &quot;P081&quot;], &quot;passages&quot;: [&quot;Il sistema tradizionale non è più il modello applicabile in mancanza di scelta: lo statuto deve indicare quale dei tre sistemi adotta.&quot;, &quot;Cosa cambia in concreto. Per la generalità delle S.p.A. con collegio sindacale non serve una modifica statutaria: lo statuto che nomina il collegio esprime già la scelta. L&#x27;adeguamento serve se lo statuto non consente di desumere il sistema o ne rimette la scelta all&#x27;assemblea. Un adeguamento solo nominale può essere deliberato dall&#x27;organo amministrativo ex art. 2365, co. 2, c.c., secondo lo Studio CNN n. 63-2026/I e la massima n. 89 del Consiglio Notarile di Milano (Notaio Soldani; FiscoeTasse).&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P013&quot;, &quot;P076&quot;], &quot;passages&quot;: [&quot;a) Tre modelli, stessa dignità (art. 2380 c.c.). Tradizionale, dualistico e monistico sono regolati in plessi autonomi e lo statuto ne sceglie espressamente uno. Le denominazioni cambiano: sistema con collegio sindacale, con consiglio di sorveglianza, con comitato per il controllo sulla gestione.&quot;, &quot;Statuto. Va verificato che indichi in modo univoco il sistema adottato. Uno statuto che elenca più modelli rimettendo la scelta all&#x27;assemblea può richiedere un adeguamento. I rinvii numerici ad articoli abrogati o rinumerati vanno aggiornati: i rinvii mobili alla legge reggono, le clausole che riproducono il testo precedente restano efficaci se non contrastano con norme imperative.&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P047&quot;, &quot;P048&quot;], &quot;passages&quot;: [&quot;La struttura di fondo era già prevista dal diritto anteriore. La novità consiste nella scelta statutaria e nell’organizzazione delle disposizioni: prima vengono le regole comuni agli organi, poi quelle proprie di ciascun sistema. Restano le differenze fra chi nomina, chi amministra e chi controlla. Il cambiamento del sistema, salvo diversa previsione della deliberazione, produce effetto alla riunione dell’organo competente per l’approvazione del bilancio relativo all’esercizio successivo. Occorre quindi disciplinare espressamente il passaggio e la continuità degli incarichi. [N1]&quot;, &quot;Per una S.p.A. già esistente, la mancanza della formula «adotta il sistema con collegio sindacale» non impone di per sé una modifica: il modello può risultare inequivocabilmente dalle altre clausole. Richiedono invece attenzione gli statuti che elencano più sistemi senza sceglierne uno o rimettono la scelta all’assemblea senza un corrispondente adeguamento statutario. Questa è una questione interpretativa, da risolvere sul testo effettivo dello statuto. [N6]&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P008&quot;, &quot;P022&quot;], &quot;passages&quot;: [&quot;Prima della riforma, il sistema tradizionale operava quando lo statuto non sceglieva diversamente. Gli altri modelli erano disciplinati anche attraverso rinvii alle disposizioni del sistema tradizionale.&quot;, &quot;La scelta deve risultare dallo statuto. Il legislatore abbandona così la preminenza normativa del modello tradizionale. Art. 2380 c.c..&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P029&quot;, &quot;P030&quot;], &quot;passages&quot;: [&quot;Prima. L’art. 2380 c.c. individuava nel sistema tradizionale il modello applicabile in mancanza di una diversa scelta statutaria. Il sistema dualistico e quello monistico erano già disponibili, ma la loro disciplina era costruita anche attraverso numerosi rinvii alle regole del sistema tradizionale.&quot;, &quot;Ora. Lo statuto adotta uno dei tre sistemi. Le disposizioni comuni sono raccolte prima delle norme specifiche di ciascun modello. La nuova denominazione valorizza l’organo di controllo che lo caratterizza. Il cambiamento è di architettura normativa e di autonomia dei modelli; non coincide con l’introduzione di tre nuovi sistemi. D.lgs. 47/2026, art. 9; nuovo art. 2380 c.c..&quot;]}}}, {&quot;id&quot;: &quot;C02&quot;, &quot;topic&quot;: &quot;Assetti e differenza rispetto al passato&quot;, &quot;expected&quot;: &quot;Gli assetti erano già dovuti. Distinguere istituzione, cura, valutazione e vigilanza; non presentare il 2026 come nascita del dovere.&quot;, &quot;source&quot;: &quot;https://documenti.camera.it/leg19/dossier/pdf/FI0144.pdf&quot;, &quot;location&quot;: &quot;Testo a fronte, artt. 2380-bis e 2381; raffronto con decreto finale&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P048&quot;, &quot;P049&quot;], &quot;passages&quot;: [&quot;Il nuovo art. 2380-bis attribuisce esclusivamente agli amministratori gestione e organizzazione dell&#x27;impresa, compresa l&#x27;istituzione dell&#x27;assetto organizzativo, amministrativo e contabile. La precedente disciplina già riservava agli amministratori l&#x27;istituzione degli assetti richiamati dall&#x27;art. 2086: sarebbe inesatto presentare il decreto come la nascita di questo obbligo. La nuova formulazione rende unitario ed esplicito il rapporto fra amministrazione e organizzazione. [S1, art. 9; S3, p. 94]&quot;, &quot;L&#x27;art. 2381-bis mantiene la distinzione fra organi delegati, che curano gli assetti, e consiglio, che ne valuta l&#x27;adeguatezza sulla base delle informazioni ricevute, esamina i piani quando elaborati e valuta l&#x27;andamento della gestione. L&#x27;organo di controllo vigila. Affidare attività tecniche al direttore finanziario o a un consulente può aiutare gli amministratori a esercitare la funzione, ma non trasferisce a tali soggetti la titolarità della responsabilità organizzativa. Quest&#x27;ultima conclusione è un&#x27;inferenza dal riparto normativo. [S1, artt. 2380-bis, 2381-bis e 2396-quinquies]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P065&quot;, &quot;P066&quot;], &quot;passages&quot;: [&quot;Gestione esclusiva degli amministratori; assetti richiamati per rinvio all&#x27;art. 2086, co. 2&quot;, &quot;Gestione e organizzazione dell&#x27;impresa, compresa l&#x27;istituzione degli assetti, spettano esclusivamente agli amministratori&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P041&quot;, &quot;P042&quot;], &quot;passages&quot;: [&quot;Norma. La gestione e l&#x27;organizzazione dell&#x27;impresa, compresa l&#x27;istituzione dell&#x27;assetto organizzativo, amministrativo e contabile, spettano esclusivamente agli amministratori (art. 2380-bis). Il consiglio determina contenuto e limiti delle deleghe, può impartire direttive e avocare operazioni; valuta l&#x27;adeguatezza degli assetti sulla base delle informazioni ricevute ed esamina i piani strategici, industriali e finanziari quando elaborati. Gli organi delegati curano l&#x27;assetto e riferiscono al consiglio e all&#x27;organo di controllo con la periodicità fissata dallo statuto e comunque almeno ogni sei mesi, anche sulle operazioni di maggior rilievo di società e controllate (art. 2381-bis). L&#x27;art. 2381-ter ribadisce il dovere di agire informati: il presidente assicura ai consiglieri informazioni adeguate sulle materie all&#x27;ordine del giorno e ciascun amministratore può chiedere agli organi delegati ulteriori informazioni.&quot;, &quot;Prima. Il contenuto era concentrato nell&#x27;art. 2381, con rinvio all&#x27;art. 2086 c.c. per gli assetti; gli organi delegati dovevano curare che l&#x27;assetto fosse adeguato alla natura e alle dimensioni dell&#x27;impresa. La cadenza semestrale dell&#x27;informativa c&#x27;era già: non è una novità.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P039&quot;, &quot;P040&quot;], &quot;passages&quot;: [&quot;Gestione “nel rispetto” dell&#x27;art. 2086&quot;, &quot;Gestione e organizzazione, inclusi gli assetti, spettano esclusivamente agli amministratori (art. 2380-bis)&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P032&quot;, &quot;P033&quot;], &quot;passages&quot;: [&quot;Dovere desunto dall&#x27;art. 2086 c.c.&quot;, &quot;Competenza esclusiva degli amministratori, scritta nell&#x27;art. 2380-bis&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P051&quot;, &quot;P052&quot;], &quot;passages&quot;: [&quot;Il nuovo art. 2380-bis riserva agli amministratori gestione e organizzazione dell’impresa, compresa l’istituzione dell’assetto organizzativo, amministrativo e contabile. La riserva agli amministratori degli assetti era già presente: la riforma rende più esplicita e sistematica la funzione organizzativa. L’art. 2086 c.c. continua a richiedere assetti adeguati alla natura e alle dimensioni dell’impresa, anche per rilevare tempestivamente la crisi. [N1; N5]&quot;, &quot;L’art. 2381-bis conserva la distinzione fra organi delegati, che curano gli assetti e riferiscono sulla gestione, e consiglio, che valuta l’adeguatezza degli assetti e l’andamento generale sulla base delle informazioni ricevute. Il consiglio determina contenuto e limiti delle deleghe, può impartire direttive e avocare operazioni. Il flusso degli organi delegati al consiglio e all’organo di controllo rimane almeno semestrale, salvo frequenza statutaria maggiore; per le quotate va coordinato con l’informativa almeno trimestrale dell’art. 150 TUF. [N1–N2]&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P025&quot;, &quot;P026&quot;], &quot;passages&quot;: [&quot;Il nuovo articolo 2380-bis attribuisce esclusivamente agli amministratori la gestione e l’organizzazione dell’impresa, comprendendo espressamente l’istituzione degli assetti organizzativi, amministrativi e contabili. Ribadisce inoltre la collegialità dell’amministrazione quando affidata a più persone. Art. 2380-bis c.c..&quot;, &quot;L’obbligo di predisporre assetti adeguati era già presente nell’ordinamento. La modifica rende più esplicita la responsabilità organizzativa dell’organo amministrativo.&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P051&quot;, &quot;P052&quot;], &quot;passages&quot;: [&quot;Il nuovo art. 2380-bis attribuisce in via esclusiva agli amministratori la gestione e l’organizzazione dell’impresa, compresa l’istituzione dell’assetto organizzativo, amministrativo e contabile. Il precedente quadro già richiedeva gli adeguati assetti, anche attraverso l’art. 2086 c.c.: non nasce nel 2026 un obbligo prima inesistente. La riformulazione rende più esplicito il collegamento fra organizzazione e funzione gestoria. D.lgs. 47/2026, art. 9; per il confronto, dossier parlamentare, pp. 61–64.&quot;, &quot;Conseguenza operativa. Il consiglio deve poter spiegare quali strutture ha adottato, chi ne cura il funzionamento e come ne valuta l’adeguatezza. Un organigramma o un manuale, da soli, non dimostrano che l’assetto funzioni: rilevano i flussi effettivi, le anomalie emerse e gli interventi effettuati. Questa è un’inferenza organizzativa coerente con i compiti di amministrazione e vigilanza, non un nuovo elenco legale di documenti obbligatori.&quot;]}}}, {&quot;id&quot;: &quot;C03&quot;, &quot;topic&quot;: &quot;Decisioni sulla crisi non delegabili&quot;, &quot;expected&quot;: &quot;Riserva della decisione su accesso, proposta e condizioni del piano; distinguere istruttoria e attività esecutiva.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → art. 2381-bis c.c.&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P052&quot;, &quot;P053&quot;], &quot;passages&quot;: [&quot;Le norme prima riunite nell&#x27;art. 2381 sono ora distribuite fra presidente, deleghe e informazione consiliare. Molte regole restano sostanzialmente in continuità con la disciplina precedente. Il nuovo art. 2381-bis aggiunge espressamente alle attribuzioni non delegabili le decisioni sull&#x27;accesso agli strumenti di regolazione della crisi e dell&#x27;insolvenza, comprendendo il contenuto della proposta e le condizioni del piano. [S1, art. 9]&quot;, &quot;Se la società ha un consiglio, una delega generale all&#x27;amministratore delegato non basta a trasferirgli queste decisioni. La preparazione tecnica può essere affidata al management e ai consulenti, ma il consiglio deve assumere la decisione riservata. La conclusione non significa che ogni singola attività preliminare di gestione della crisi diventi indelegabile: occorre identificare la decisione disciplinata dalla norma e coordinarla con lo strumento utilizzato.&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P076&quot;, &quot;P077&quot;], &quot;passages&quot;: [&quot;Comitato esecutivo e organi delegati in norma autonoma; non delegabili le decisioni sull&#x27;accesso agli strumenti di regolazione della crisi, compresi proposta e condizioni del piano&quot;, &quot;Piani attestati, accordi, concordati: decisione sempre collegiale del CdA&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P046&quot;, &quot;P048&quot;], &quot;passages&quot;: [&quot;Norma. Non possono essere delegate le decisioni sull&#x27;accesso a uno strumento di regolazione della crisi e dell&#x27;insolvenza (art. 2086, comma 2), che comprendono il contenuto della proposta e le condizioni del piano; resta ferma la lista storica delle attribuzioni non delegabili (artt. 2420-ter, 2423, 2443, 2446, 2447, 2501-ter, 2506-bis).&quot;, &quot;In concreto. Piani attestati, accordi di ristrutturazione, concordati e strumenti analoghi richiedono una deliberazione collegiale, da verbalizzare con le informazioni esaminate. La stampa specializzata riferisce una massima secondo cui restano delegabili il monitoraggio e l&#x27;attuazione dello strumento già scelto, ma non la scelta.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P108&quot;, &quot;P109&quot;], &quot;passages&quot;: [&quot;Deleghe, comitato esecutivo, organi delegati; non delegabili bilancio, operazioni sul capitale, fusioni e scissioni e le decisioni sull&#x27;accesso agli strumenti di regolazione della crisi&quot;, &quot;La scelta dello strumento di crisi (incluse proposta e piano) torna al plenum&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P016&quot;, &quot;P078&quot;], &quot;passages&quot;: [&quot;L&#x27;art. 2381-bis elenca le materie non delegabili; tra queste la decisione di accedere agli strumenti di regolazione della crisi, che spetta al consiglio.&quot;, &quot;Deleghe. Le deleghe vanno rilette alla luce delle materie non delegabili, in particolare per le decisioni sulla crisi d&#x27;impresa: nessun amministratore delegato o comitato esecutivo può decidere da solo sull&#x27;accesso a uno strumento di regolazione.&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P057&quot;, &quot;P058&quot;], &quot;passages&quot;: [&quot;L’art. 2381-bis include espressamente fra le competenze non delegabili le decisioni sull’accesso agli strumenti di regolazione della crisi e dell’insolvenza, comprendenti il contenuto della proposta e le condizioni del piano. Non basta quindi una delega generale all’amministratore delegato per assumere la decisione riservata al consiglio. Il divieto riguarda la decisione; preparazione e attuazione possono essere affidate a soggetti incaricati entro i limiti stabiliti. La classificazione del singolo strumento e il coordinamento con il Codice della crisi richiedono comunque verifica. [N1]&quot;, &quot;Per il consulente che assiste l’impresa, questo comporta l’esigenza di programmare una deliberazione consiliare sufficientemente informata e di verificare che il piano presentato corrisponda a quello deliberato. Non si tratta di un obbligo introdotto ex novo di accorgersi della crisi, ma di una più esplicita riserva della decisione collegiale.&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P031&quot;, &quot;P032&quot;], &quot;passages&quot;: [&quot;Rimangono il ruolo del consiglio nella valutazione degli assetti e l’obbligo degli organi delegati di riferire almeno semestralmente. Diventa espressa la non delegabilità delle decisioni sull’accesso agli strumenti di regolazione della crisi e dell’insolvenza, comprendenti contenuto della proposta e condizioni del piano. Art. 9 del decreto, nella banca dati del MEF.&quot;, &quot;Conseguenza pratica. Le deleghe devono essere riesaminate per individuare poteri, limiti, obblighi informativi e decisioni riservate al consiglio. In una situazione di crisi, l’amministratore delegato può curare l’istruttoria, ma la scelta riservata all’organo collegiale richiede una deliberazione effettiva.&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P054&quot;, &quot;P055&quot;], &quot;passages&quot;: [&quot;La disciplina prima concentrata nell’art. 2381 è ripartita fra presidente, deleghe e informazione consiliare. Il nuovo art. 2381-bis conferma il potere del consiglio di delimitare le deleghe, impartire direttive e avocare operazioni. Aggiunge espressamente fra le materie non delegabili le decisioni sull’accesso agli strumenti di regolazione della crisi e dell’insolvenza, comprensive del contenuto della proposta e delle condizioni del piano. Nel sistema con consiglio di gestione la delega, se consentita dallo statuto, può essere attribuita soltanto a uno o più componenti. Art. 2381-bis c.c..&quot;, &quot;Esempio. Una delega generale all’amministratore delegato per finanza e ristrutturazioni non basta a trasferirgli la decisione riservata al consiglio sull’accesso allo strumento, sulla proposta e sulle condizioni del piano. Preparazione tecnica e attività esecutive vanno distinte dalla decisione collegiale. La delimitazione dell’esecuzione concreta deve essere coordinata con le regole dello specifico strumento di crisi.&quot;]}}}, {&quot;id&quot;: &quot;C04&quot;, &quot;topic&quot;: &quot;Deleghe nel consiglio di gestione&quot;, &quot;expected&quot;: &quot;Necessaria previsione statutaria; delega a componenti, non a comitato esecutivo. Differenza utile fra modelli.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → art. 2381-bis c.c.&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P054&quot;], &quot;passages&quot;: [&quot;Per il consiglio di gestione, l&#x27;art. 2381-bis ammette deleghe a uno o più componenti se consentite dallo statuto; non contempla un comitato esecutivo. È un&#x27;ulteriore ragione per evitare regolamenti indistinti per tutti i modelli. [S1, art. 9]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D03&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D04&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D05&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P053&quot;], &quot;passages&quot;: [&quot;Per il consiglio di gestione la delega deve essere consentita dallo statuto e può essere attribuita a singoli componenti, non a un comitato esecutivo. Si tratta di una differenza concreta rispetto alla facoltà riconosciuta al consiglio di amministrazione degli altri sistemi. [N1]&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P054&quot;], &quot;passages&quot;: [&quot;La disciplina prima concentrata nell’art. 2381 è ripartita fra presidente, deleghe e informazione consiliare. Il nuovo art. 2381-bis conferma il potere del consiglio di delimitare le deleghe, impartire direttive e avocare operazioni. Aggiunge espressamente fra le materie non delegabili le decisioni sull’accesso agli strumenti di regolazione della crisi e dell’insolvenza, comprensive del contenuto della proposta e delle condizioni del piano. Nel sistema con consiglio di gestione la delega, se consentita dallo statuto, può essere attribuita soltanto a uno o più componenti. Art. 2381-bis c.c..&quot;]}}}, {&quot;id&quot;: &quot;C05&quot;, &quot;topic&quot;: &quot;Ragionevole affidamento e responsabilità&quot;, &quot;expected&quot;: &quot;Informazione e competenze; nessun esonero automatico, necessaria reazione a fatti pregiudizievoli. La diligenza era già graduata.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → artt. 2381-ter e 2392 c.c.; note al 2392&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P056&quot;, &quot;P057&quot;], &quot;passages&quot;: [&quot;L&#x27;art. 2381-ter conserva l&#x27;obbligo di agire informati, il compito del presidente di assicurare informazioni adeguate sulle materie all&#x27;ordine del giorno e il diritto dei consiglieri di chiedere informazioni ai delegati in consiglio. Introduce espressamente il ragionevole affidamento degli amministratori privi di deleghe sulle informazioni ricevute secondo legge e statuto, tenendo conto delle loro specifiche competenze. [S1, art. 9]&quot;, &quot;La lettura operativa è che il consigliere non esecutivo può fondare la decisione su un sistema informativo attendibile, ma l&#x27;affidamento deve restare ragionevole. L&#x27;art. 2392 continua a prevedere responsabilità quando l&#x27;amministratore, conoscendo fatti pregiudizievoli, omette quanto poteva fare per impedirli o ridurne le conseguenze. La nuova regola non è quindi un&#x27;esenzione automatica per chi approva senza approfondire informazioni palesemente insufficienti o contraddittorie. [S1, art. 9 e note all&#x27;art. 2392]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P081&quot;, &quot;P104&quot;], &quot;passages&quot;: [&quot;Dovere confermato; i non delegati fanno ragionevole affidamento sulle informazioni ricevute, anche in base alle proprie competenze; reporting dei delegati almeno semestrale&quot;, &quot;In concreto: il consiglio va organizzato come luogo in cui si decide sulla base di informazioni documentate. Chi siede senza deleghe ha interesse a pretendere flussi strutturati: è la base del \&quot;ragionevole affidamento\&quot; che lo protegge.&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P043&quot;], &quot;passages&quot;: [&quot;In concreto. La riforma rende più nitida la catena dei ruoli: il consiglio istituisce e valuta, i delegati curano e riferiscono, l&#x27;organo di controllo vigila. Il verbo \&quot;curano l&#x27;assetto\&quot; (al posto di \&quot;curano che sia adeguato\&quot;) suggerisce, a nostro avviso, una responsabilità operativa più diretta dei delegati. Per gli amministratori privi di deleghe i commentatori leggono la norma come un riconoscimento del ragionevole affidamento sulle informazioni ricevute, che non diventa un&#x27;esenzione quando emergono segnali critici. Il semestre è una soglia massima: statuto e prassi dovrebbero fissare cadenze più strette in presenza di indebitamento, operazioni straordinarie o tensioni finanziarie.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P129&quot;], &quot;passages&quot;: [&quot;Lettura. Il ragionevole affidamento non è un esonero automatico. Protegge il consigliere che ha chiesto, ricevuto e valutato informazioni adeguate; non chi è rimasto inerte davanti a segnali d&#x27;allarme. Il semestre è un limite massimo: indebitamento, complessità o tensione finanziaria richiedono flussi più frequenti.&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;R&quot;, &quot;refs&quot;: [&quot;P041&quot;, &quot;P042&quot;], &quot;passages&quot;: [&quot;Responsabilità ex art. 2392 senza graduazione espressa&quot;, &quot;Ragionevole affidamento sulle informazioni ricevute (art. 2381-ter), fermi i doveri di vigilanza&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P061&quot;, &quot;P062&quot;], &quot;passages&quot;: [&quot;La novità espressa è il ragionevole affidamento degli amministratori senza deleghe sulle informazioni ricevute secondo legge e statuto, tenendo conto delle loro specifiche competenze. L’art. 2392 è coordinato con questa regola e conserva il dovere di attivarsi quando si conoscono fatti pregiudizievoli. [N1]&quot;, &quot;Lettura interpretativa. La norma valorizza la ripartizione dei ruoli: il consigliere non esecutivo può basarsi su un sistema informativo attendibile. Non consente però di ignorare contraddizioni, lacune o segnali d’allarme. La ragionevolezza dell’affidamento dipende dal caso, dalla qualità dell’informazione e dalle competenze del destinatario; non costituisce un esonero automatico da responsabilità.&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P035&quot;, &quot;P037&quot;], &quot;passages&quot;: [&quot;Il nuovo articolo 2381-ter consente ai consiglieri non delegati di fare ragionevole affidamento sulle informazioni ricevute, anche in relazione alle proprie specifiche competenze. Rimangono il dovere di agire informati e la possibilità di chiedere chiarimenti. Il documento del CNDCEC distingue questa novità dal trasferimento di obblighi già esistenti. Analisi del CNDCEC, pp. 35–36.&quot;, &quot;L’affidamento deve essere ragionevole: non giustifica l’inerzia davanti a fatti pregiudizievoli conosciuti. L’articolo 2392 conserva il dovere di intervenire per impedirli o attenuarne le conseguenze. Art. 2392 c.c..&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P057&quot;, &quot;P058&quot;], &quot;passages&quot;: [&quot;Il nuovo art. 2381-ter conferma che gli amministratori devono agire informati, attribuisce al presidente il compito di assicurare informazioni adeguate e consente a ciascun consigliere di chiedere informazioni agli organi delegati in consiglio. Prevede inoltre che i non delegati facciano ragionevole affidamento, anche in relazione alle proprie competenze, sulle informazioni ricevute secondo legge e statuto. Art. 2381-ter c.c..&quot;, &quot;La novità riconosce una differenza di ruolo fra chi gestisce quotidianamente e chi decide e valuta in consiglio. Non consente di ignorare informazioni lacunose, contraddizioni o fatti pregiudizievoli conosciuti: resta il quadro dell’art. 2392 c.c. Il parametro dell’affidamento è «ragionevole», non meramente formale.&quot;]}}}, {&quot;id&quot;: &quot;C06&quot;, &quot;topic&quot;: &quot;Vigilanza effettiva prima e dopo&quot;, &quot;expected&quot;: &quot;Il vecchio art. 2403 già richiedeva vigilanza sul concreto funzionamento degli assetti. Novità: formulazione comune e rischi/coordinamento espliciti.&quot;, &quot;source&quot;: &quot;https://documenti.camera.it/leg19/dossier/pdf/FI0144.pdf&quot;, &quot;location&quot;: &quot;Testo a fronte art. 2403, p. 93 stampata / 94 PDF&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P061&quot;, &quot;P063&quot;], &quot;passages&quot;: [&quot;La disciplina comune dell&#x27;art. 2396-quinquies richiede vigilanza su legge e statuto, corretta amministrazione, adeguatezza e concreto funzionamento degli assetti, includendo il sistema di controllo interno e gestione dei rischi e il coordinamento delle sue funzioni. La vigilanza sugli assetti funzionanti era già prevista per il collegio sindacale; la nuova disposizione rende espliciti rischi e coordinamento e li colloca nel nucleo comune. [S1, art. 9; S3, pp. 102 e 105]&quot;, &quot;Conseguenza organizzativa. È utile definire chi raccoglie gli indicatori, chi li valuta e a chi segnala le criticità, collegando le funzioni eventualmente presenti: amministrazione, risk management, internal audit, compliance e organismo di vigilanza 231. Questo coordinamento non sopprime le rispettive competenze e non obbliga ogni piccola S.p.A. a istituire tutte queste strutture. La scelta deve essere proporzionata all&#x27;impresa e alla normativa applicabile.&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P132&quot;, &quot;P133&quot;], &quot;passages&quot;: [&quot;5.2 Doveri: dalla vigilanza formale a quella sui rischi&quot;, &quot;L&#x27;art. 2396-quinquies chiede all&#x27;organo di controllo di vigilare su legge e statuto, corretta amministrazione e adeguatezza e concreto funzionamento degli assetti, compreso il sistema di controllo interno e di gestione dei rischi e il coordinamento delle sue funzioni. L&#x27;organo riferisce all&#x27;assemblea di bilancio sull&#x27;attività svolta e sui fatti censurabili.&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P057&quot;, &quot;P058&quot;], &quot;passages&quot;: [&quot;Prima. La vigilanza sugli assetti era già prevista dall&#x27;art. 2403, ma riferita al modello tradizionale; i modelli alternativi vi arrivavano per rinvio.&quot;, &quot;In concreto. La novità sostanziale è l&#x27;esplicita attenzione al sistema di controllo interno e di gestione dei rischi, letta dai commentatori come passaggio da una vigilanza formale e retrospettiva a una prospettica e integrata: non basta verificare che policy e organigrammi esistano, occorre accertare che producano informazioni utili, che le anomalie emergano e che le azioni correttive vengano adottate. Ne discendono flussi strutturati con revisore, internal audit e funzioni di compliance. Le Norme di comportamento del collegio sindacale (CNDCEC, dicembre 2024) vanno già in questa direzione.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P142&quot;, &quot;P157&quot;], &quot;passages&quot;: [&quot;Vigilanza su legge, statuto, corretta amministrazione, assetti e, in più, su adeguatezza e funzionamento del sistema di controllo interno e di gestione dei rischi&quot;, &quot;Lettura. Il collegio sindacale di una S.p.A. non quotata deve ora vigilare sull&#x27;efficacia operativa dei controlli interni, non solo sulla loro esistenza, con un approccio proporzionato ai rischi. Il decreto non coordina l&#x27;organo di controllo con l&#x27;OdV 231: dove le funzioni coincidono, conviene formalizzare il riparto in regolamento o nella lettera d&#x27;incarico.&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;R&quot;, &quot;refs&quot;: [&quot;P049&quot;, &quot;P050&quot;], &quot;passages&quot;: [&quot;Vigilanza dei sindaci&quot;, &quot;Formale e retrospettiva&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P066&quot;, &quot;P067&quot;], &quot;passages&quot;: [&quot;Il nuovo art. 2396-quinquies c.c. riunisce i doveri dell’organo di controllo: legalità e statuto, principi di corretta amministrazione, adeguatezza e concreto funzionamento degli assetti. Il richiamo espresso include il sistema di controllo interno, la gestione dei rischi e il coordinamento delle relative funzioni. L’organo riferisce all’assemblea sull’attività svolta, sulle omissioni e sui fatti censurabili. [N1]&quot;, &quot;Per il collegio sindacale, larga parte della vigilanza era già prevista dall’art. 2403. La novità rilevante è la formulazione comune ai tre sistemi e l’esplicitazione del coordinamento dei controlli. Per il comitato del sistema monistico il rinvio alla norma generale rende espresso un ambito di vigilanza più ampio rispetto alla precedente formulazione centrata sulla struttura organizzativa e sul sistema contabile.&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P039&quot;, &quot;P040&quot;], &quot;passages&quot;: [&quot;Il nuovo articolo 2396-quinquies detta doveri comuni all’organo di controllo. Alla vigilanza su legge, statuto, corretta amministrazione e assetti aggiunge il riferimento espresso al sistema di controllo interno, alla gestione dei rischi e al coordinamento delle funzioni. Art. 2396-quinquies c.c..&quot;, &quot;Conseguenza pratica. Il controllo deve poter ricostruire come una criticità viene individuata, comunicata e affrontata. Una procedura approvata ma sistematicamente disattesa richiede attenzione quanto una procedura mancante.&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P066&quot;, &quot;P067&quot;], &quot;passages&quot;: [&quot;Il nuovo art. 2396-quinquies concentra i doveri comuni dell’organo di controllo: osservanza di legge e statuto, corretta amministrazione, adeguatezza e concreto funzionamento degli assetti. Include espressamente il sistema di controllo interno e di gestione dei rischi e il coordinamento delle sue funzioni, salve le discipline speciali. La vigilanza non si riduce al controllo formale dei documenti. Art. 2396-quinquies c.c..&quot;, &quot;Cosa cambia rispetto a prima. Molti compiti già spettavano al collegio sindacale e, tramite rinvii, ad altri controllori. La loro collocazione comune chiarisce il nucleo condiviso; nel monistico viene superata una formulazione dei compiti maggiormente concentrata sugli assetti e sul sistema di controllo. Il richiamo espresso al concreto funzionamento e al coordinamento orienta la verifica verso l’efficacia dell’organizzazione.&quot;]}}}, {&quot;id&quot;: &quot;C07&quot;, &quot;topic&quot;: &quot;Indipendenza e rapporti di gruppo&quot;, &quot;expected&quot;: &quot;Parenti quarto grado, affini secondo, unioni civili e convivenza; incarico di controllo nel gruppo non automaticamente incompatibile.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → art. 2396-septies c.c.&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P065&quot;], &quot;passages&quot;: [&quot;L&#x27;art. 2396-septies amplia la menzione dei legami personali a unione civile e convivenza; mantiene i parenti entro il quarto grado e considera gli affini entro il secondo, rispetto al precedente quarto grado. Precisa inoltre che ricoprire cariche di controllo in altre società del gruppo non costituisce di per sé ineleggibilità o decadenza. Restano da esaminare gli altri rapporti che possono compromettere l&#x27;indipendenza e gli eventuali requisiti statutari più rigorosi. Per le quotate deve essere verificato l&#x27;art. 148 TUF. [S1, artt. 6 e 9; S3, confronto art. 2399]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P141&quot;, &quot;P147&quot;], &quot;passages&quot;: [&quot;Coniuge, parte dell&#x27;unione civile, convivente di fatto; parenti entro il quarto grado, affini entro il secondo grado&quot;, &quot;Non sono di per sé causa di ineleggibilità; resta una valutazione concreta di numero, compensi e altri rapporti&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P061&quot;, &quot;P063&quot;], &quot;passages&quot;: [&quot;Norma. Non possono essere eletti e, se eletti, decadono: i soggetti nelle condizioni dell&#x27;art. 2382; il coniuge, la parte dell&#x27;unione civile, i parenti entro il quarto grado, gli affini entro il secondo grado e i conviventi degli amministratori della società, e gli stessi soggetti legati agli amministratori di controllate, controllanti e società sotto comune controllo; chi è legato alla società o al gruppo da rapporti di lavoro, consulenza o prestazione d&#x27;opera continuativi, o da altri rapporti patrimoniali che ne compromettano l&#x27;indipendenza. Ricoprire cariche in organi di controllo di società del gruppo non è, di per sé, causa di ineleggibilità.&quot;, &quot;In concreto. Due effetti opposti: si amplia ai conviventi e alle parti di unione civile (norma cogente, che prevale anche su statuti che rinviano al vecchio art. 2399) e si riduce sugli affini, ora limitati al secondo grado. Va verificata la posizione dei controllori in carica: una situazione di convivenza con un amministratore è causa di decadenza. Il cumulo di incarichi nei collegi del gruppo è espressamente ammesso, ma la relazione illustrativa invita a valutare ulteriori circostanze, come l&#x27;entità dei compensi.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P145&quot;], &quot;passages&quot;: [&quot;Ineleggibilità e decadenza estese a unito civilmente e convivente di fatto; affinità rilevante fino al secondo grado; rapporti anche con amministratori di controllanti, controllate e consorelle; la sola carica di controllo in una società del gruppo non è di per sé causa di ineleggibilità&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P020&quot;, &quot;P054&quot;], &quot;passages&quot;: [&quot;c) Organo di controllo. Doveri, poteri, ineleggibilità, decadenza e funzionamento sono unificati per tutti i sistemi (artt. 2396-quinquies ss.). L&#x27;art. 2396-quinquies aggiunge la vigilanza sull&#x27;adeguatezza del sistema di controllo interno e di gestione dei rischi. L&#x27;art. 2396-septies equipara unione civile e convivenza di fatto al coniugio tra le cause di ineleggibilità e decadenza.&quot;, &quot;Art. 2396-septies, valido per tutti i sistemi; equiparate unione civile e convivenza di fatto&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P076&quot;], &quot;passages&quot;: [&quot;L’art. 2396-septies c.c. sostituisce, nella parte comune, le precedenti cause di ineleggibilità dell’art. 2399, primo comma. La disposizione menziona espressamente anche la parte dell’unione civile e i conviventi degli amministratori; mantiene il quarto grado per i parenti e riduce dal quarto al secondo il grado rilevante per gli affini. Precisa inoltre che il solo fatto di ricoprire incarichi di controllo in altre società del gruppo non determina ineleggibilità o decadenza. Resta da valutare l’effettiva indipendenza rispetto agli altri rapporti rilevanti. [N1]&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P053&quot;], &quot;passages&quot;: [&quot;tra le incompatibilità dell’organo di controllo compaiono espressamente conviventi e parte dell’unione civile; cambia il limite relativo agli affini;&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P071&quot;, &quot;P072&quot;], &quot;passages&quot;: [&quot;L’art. 2396-septies include espressamente unioni civili e conviventi nelle incompatibilità personali e riduce dal quarto al secondo grado il vincolo relativo agli affini; resta il quarto grado per i parenti. Precisa inoltre che ricoprire incarichi in organi di controllo di altre società del gruppo non è, di per sé, causa di ineleggibilità o decadenza. Restano da esaminare i rapporti che compromettono l’indipendenza.&quot;, &quot;Non è quindi corretto leggere l’incarico nel gruppo come incompatibilità automatica, né considerarlo una garanzia automatica di indipendenza. Occorre aggiornare dichiarazioni e verifiche tenendo conto di legge, statuto e rapporti effettivi.&quot;]}}}, {&quot;id&quot;: &quot;C08&quot;, &quot;topic&quot;: &quot;Eccezione per la sorveglianza&quot;, &quot;expected&quot;: &quot;L’art. 2409-duodecies esclude le lettere b e c dell’art. 2396-septies e detta incompatibilità proprie; coordinare il TUF.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → art. 2409-duodecies c.c.&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P066&quot;], &quot;passages&quot;: [&quot;Eccezione decisiva. Nel modello civilistico con consiglio di sorveglianza, l&#x27;art. 2409-duodecies esclude l&#x27;applicazione delle lettere b) e c) dell&#x27;art. 2396-septies e introduce proprie incompatibilità, fra cui appartenenza al consiglio di gestione e determinati rapporti lavorativi o professionali che compromettono l&#x27;indipendenza. Non è corretto applicare a questo modello, in ogni situazione, il medesimo elenco valido per il collegio sindacale. Le quotate e i soggetti vigilati richiedono anche il coordinamento speciale. [S1, art. 9]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;R&quot;, &quot;refs&quot;: [&quot;P029&quot;, &quot;P106&quot;], &quot;passages&quot;: [&quot;Organo di controllo unificato (artt. 2396-bis – 2396-novies): doveri, poteri, ineleggibilità e funzionamento valgono per tutti e tre i sistemi; vigilanza espressa sul sistema di controllo interno e di gestione dei rischi (art. 2396-quinquies).&quot;, &quot;Il decreto introduce la categoria unificante di \&quot;organo di controllo\&quot;: collegio sindacale, consiglio di sorveglianza e comitato per il controllo sulla gestione seguono un nucleo comune di regole.&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;R&quot;, &quot;refs&quot;: [&quot;P056&quot;, &quot;P061&quot;], &quot;passages&quot;: [&quot;Norma. Un nucleo di regole uniforme per collegio sindacale, consiglio di sorveglianza e comitato per il controllo sulla gestione. L&#x27;organo vigila sull&#x27;osservanza della legge e dello statuto, sul rispetto dei principi di corretta amministrazione e sull&#x27;adeguatezza e sul corretto funzionamento dell&#x27;assetto organizzativo, amministrativo e contabile, incluso il sistema di controllo interno e di gestione dei rischi e il coordinamento delle sue funzioni. Il controllo giudiziario ex art. 2409 confluisce nell&#x27;art. 2396-quater.&quot;, &quot;Norma. Non possono essere eletti e, se eletti, decadono: i soggetti nelle condizioni dell&#x27;art. 2382; il coniuge, la parte dell&#x27;unione civile, i parenti entro il quarto grado, gli affini entro il secondo grado e i conviventi degli amministratori della società, e gli stessi soggetti legati agli amministratori di controllate, controllanti e società sotto comune controllo; chi è legato alla società o al gruppo da rapporti di lavoro, consulenza o prestazione d&#x27;opera continuativi, o da altri rapporti patrimoniali che ne compromettano l&#x27;indipendenza. Ricoprire cariche in organi di controllo di società del gruppo non è, di per sé, causa di ineleggibilità.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;R&quot;, &quot;refs&quot;: [&quot;P131&quot;, &quot;P145&quot;], &quot;passages&quot;: [&quot;Le regole su doveri, poteri, requisiti e denunce sono ora comuni a collegio sindacale, consiglio di sorveglianza e comitato per il controllo sulla gestione; nel codice il termine “organo di controllo” sostituisce i riferimenti al solo collegio.&quot;, &quot;Ineleggibilità e decadenza estese a unito civilmente e convivente di fatto; affinità rilevante fino al secondo grado; rapporti anche con amministratori di controllanti, controllate e consorelle; la sola carica di controllo in una società del gruppo non è di per sé causa di ineleggibilità&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;R&quot;, &quot;refs&quot;: [&quot;P020&quot;, &quot;P054&quot;], &quot;passages&quot;: [&quot;c) Organo di controllo. Doveri, poteri, ineleggibilità, decadenza e funzionamento sono unificati per tutti i sistemi (artt. 2396-quinquies ss.). L&#x27;art. 2396-quinquies aggiunge la vigilanza sull&#x27;adeguatezza del sistema di controllo interno e di gestione dei rischi. L&#x27;art. 2396-septies equipara unione civile e convivenza di fatto al coniugio tra le cause di ineleggibilità e decadenza.&quot;, &quot;Art. 2396-septies, valido per tutti i sistemi; equiparate unione civile e convivenza di fatto&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P077&quot;], &quot;passages&quot;: [&quot;Questa disciplina non si applica in modo identico a tutti gli organi: il consiglio di sorveglianza ha deroghe e incompatibilità proprie nell’art. 2409-duodecies; per le quotate opera l’art. 148 TUF. Non si può quindi riutilizzare un unico questionario senza prima identificare carica e regime applicabile. [N1–N2]&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P073&quot;], &quot;passages&quot;: [&quot;Eccezione da non perdere. Per il consiglio di sorveglianza il codice detta un regime specifico: l’art. 2409-duodecies esclude l’applicazione delle lettere b) e c) dell’art. 2396-septies e prevede proprie incompatibilità. Per gli emittenti soggetti al TUF rileva la disciplina speciale dell’art. 148. Non si può utilizzare un unico questionario indifferenziato per tutti i modelli e tutte le società. Artt. 2396-septies e 2409-duodecies c.c.; TUF, art. 148.&quot;]}}}, {&quot;id&quot;: &quot;C09&quot;, &quot;topic&quot;: &quot;Durata della gestione nel dualistico&quot;, &quot;expected&quot;: &quot;La durata dei componenti del consiglio di gestione non può superare quella del consiglio di sorveglianza.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → art. 2409-novies c.c.&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D02&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D03&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D04&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D05&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P092&quot;], &quot;passages&quot;: [&quot;Nel sistema con consiglio di sorveglianza, la durata del consiglio di gestione non può superare quella del consiglio che lo nomina. Si introducono inoltre una disposizione specifica sulla retribuzione dei sorveglianti e una disciplina delle deliberazioni e della loro impugnazione. Questi aspetti richiedono il coordinamento di nomine, compensi e calendari, ma non cancellano le differenze fra i tre sistemi. [N1]&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P079&quot;], &quot;passages&quot;: [&quot;Nel sistema con consiglio di sorveglianza, il consiglio di gestione resta composto da almeno due membri; la riforma stabilisce che la loro durata non possa superare quella del consiglio di sorveglianza. La sorveglianza conserva le proprie funzioni di nomina e le competenze sul bilancio. Occorre allineare calendari e delibere di nomina, non limitarsi a sostituire i numeri degli articoli.&quot;]}}}, {&quot;id&quot;: &quot;C10&quot;, &quot;topic&quot;: &quot;Sostituzioni nel monistico&quot;, &quot;expected&quot;: &quot;Cooptazione con approvazione del comitato; cessazione totale e convocazione disposta dal tribunale su istanza del socio.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → art. 2409-septiesdecies.1 c.c.&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D02&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P054&quot;], &quot;passages&quot;: [&quot;Sistema con comitato per il controllo sulla gestione (ex monistico). È abrogato l&#x27;art. 2409-sexiesdecies. Nuove norme regolano la sostituzione degli amministratori (art. 2409-septiesdecies.1) e il compenso del comitato esecutivo (art. 2409-septiesdecies.2); il comitato è disciplinato all&#x27;art. 2409-octiesdecies. Si rafforza il requisito di indipendenza degli amministratori che ne fanno parte.&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D04&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D05&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D06&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P180&quot;, &quot;P182&quot;], &quot;passages&quot;: [&quot;Sostituzione amministratori nel sistema con comitato&quot;, &quot;Art. 2409-septiesdecies.1&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P080&quot;], &quot;passages&quot;: [&quot;Nel sistema con comitato per il controllo sulla gestione restano centrali l’indipendenza e l’assenza di funzioni gestorie dei membri del comitato. Il nuovo art. 2409-septiesdecies.1 regola espressamente la cooptazione con approvazione del comitato e disciplina il venir meno dell’intero consiglio tramite convocazione assembleare disposta dal tribunale su istanza di un socio. È particolarmente importante una procedura di successione che preservi la continuità della vigilanza. Artt. 2396-undecies, 2409-novies, 2409-terdecies, 2409-septiesdecies.1 e 2409-octiesdecies c.c..&quot;]}}}, {&quot;id&quot;: &quot;C11&quot;, &quot;topic&quot;: &quot;Rimedio giudiziario del comitato&quot;, &quot;expected&quot;: &quot;Per materie consiliari il rimedio specifico richiede il voto contrario della maggioranza del comitato; l’astensione non è equivalente.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → art. 2409-octiesdecies, ultimo comma&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P067&quot;], &quot;passages&quot;: [&quot;Nel sistema con comitato per il controllo sulla gestione, i componenti del comitato devono essere indipendenti e non esecutivi secondo gli artt. 2409-septiesdecies e 2409-octiesdecies. Se le irregolarità denunciate attengono a materie consiliari, la richiesta dei provvedimenti giudiziari prevista dall&#x27;ultimo comma dell&#x27;art. 2409-octiesdecies è subordinata al voto contrario della maggioranza del comitato alla determinazione consiliare. Per i controllori interni al consiglio, il dissenso tempestivo assume quindi rilievo anche per quel rimedio specifico. [S1, art. 9]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D03&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D04&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D05&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P091&quot;], &quot;passages&quot;: [&quot;Per il sistema con comitato interno assume rilievo il nuovo art. 2409-octiesdecies: se le irregolarità riguardano materie di competenza consiliare, il comitato può richiedere i provvedimenti giudiziari richiamati dalla norma soltanto se la maggioranza dei suoi componenti ha votato contro la determinazione del consiglio. La disposizione è richiamata anche dall’art. 152 TUF. In concreto, il dissenso sulla decisione assume un peso che l’astensione non soddisfa sul piano letterale. [N1–N2]&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D08&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}}}, {&quot;id&quot;: &quot;C12&quot;, &quot;topic&quot;: &quot;Concorrenza e soggetti obbligati&quot;, &quot;expected&quot;: &quot;Art. 2390: amministratore che assume incarichi strategici presso concorrenti. Art. 2396-bis: distinta disciplina dei DG. Non equiparare tutti i dirigenti agli amministratori.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 9 → artt. 2390 e 2396-bis c.c.&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P069&quot;], &quot;passages&quot;: [&quot;L&#x27;art. 2390 estende le posizioni vietate agli amministratori che assumono il ruolo di dirigente con responsabilità strategiche in società concorrenti e richiede una specifica autorizzazione assembleare. Questo non equivale a un divieto introdotto indistintamente per tutti i dirigenti strategici di ogni società. L&#x27;art. 2390-bis enuncia autonomamente il divieto di utilizzare per sé o per terzi dati, notizie e opportunità appresi nell&#x27;incarico; per i direttori generali l&#x27;art. 2396-bis disciplina concorrenza e uso delle informazioni. Il precedente art. 2391 già conteneva una responsabilità relativa all&#x27;uso a vantaggio proprio o altrui di tali informazioni: anche qui va distinta la ricollocazione dal contenuto nuovo. [S1, art. 9; S3, confronto art. 2391]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;R&quot;, &quot;refs&quot;: [&quot;P213&quot;, &quot;P214&quot;], &quot;passages&quot;: [&quot;Dirigenti con responsabilità strategiche e direttori generali&quot;, &quot;Soggetti al divieto di concorrenza (dirigenti di concorrenti) e al divieto di uso delle informazioni (direttori generali)&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P051&quot;, &quot;P054&quot;], &quot;passages&quot;: [&quot;Norma. Il divieto di concorrenza (art. 2390) include ora la posizione di dirigente con responsabilità strategiche in società concorrenti, e l&#x27;autorizzazione dell&#x27;assemblea deve essere specifica. Nuovo art. 2390-bis: gli amministratori non possono utilizzare a vantaggio proprio o di terzi dati, notizie o opportunità di affari appresi nell&#x27;incarico; per l&#x27;inosservanza l&#x27;amministratore può essere revocato e risponde dei danni. L&#x27;art. 2391 (interessi degli amministratori) è riscritto per valere in tutti i modelli.&quot;, &quot;Per chi. Amministratori (anche con incarichi in più società o gruppi), dirigenti con responsabilità strategiche, soci.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;R&quot;, &quot;refs&quot;: [&quot;P114&quot;, &quot;P268&quot;], &quot;passages&quot;: [&quot;Divieto di concorrenza esteso ai dirigenti con responsabilità strategiche&quot;, &quot;Report almeno semestrale a CdA e organo di controllo; divieti estesi ai DG e ai dirigenti strategici&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;R&quot;, &quot;refs&quot;: [&quot;P098&quot;, &quot;P099&quot;], &quot;passages&quot;: [&quot;Direttori generali e dirigenti strategici&quot;, &quot;Divieto di concorrenza e di uso delle informazioni (artt. 2390, 2390-bis, 2396-bis)&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P083&quot;, &quot;P084&quot;], &quot;passages&quot;: [&quot;L’art. 2390 c.c. estende espressamente il divieto agli incarichi di dirigente con responsabilità strategiche in società concorrenti e richiede una specifica autorizzazione assembleare. Il nuovo art. 2390-bis rende autonoma la disciplina dell’utilizzo, a vantaggio proprio o di terzi, di informazioni e opportunità apprese nell’incarico: la materia era già presente nell’art. 2391. Non nasce quindi nel 2026 il dovere di non appropriarsi delle opportunità della società. [N1]&quot;, &quot;Il nuovo art. 2396-bis disciplina espressamente i direttori generali, sia per la concorrenza sia per l’utilizzo delle informazioni. L’autorizzazione alla concorrenza non equivale a un’autorizzazione a utilizzare informazioni aziendali per finalità personali.&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P054&quot;], &quot;passages&quot;: [&quot;il divieto di concorrenza degli amministratori comprende incarichi di dirigente con responsabilità strategiche presso concorrenti e richiede un’autorizzazione assembleare specifica;&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P062&quot;, &quot;P063&quot;], &quot;passages&quot;: [&quot;L’art. 2390 estende il divieto di assumere ruoli in società concorrenti ai dirigenti con responsabilità strategiche e richiede una specifica autorizzazione assembleare. Conviene perciò riesaminare incarichi esterni e autorizzazioni generiche, senza presumere che una clausola indifferenziata copra ogni posizione.&quot;, &quot;L’art. 2390-bis formula autonomamente il divieto di utilizzare per sé o per terzi dati, notizie e opportunità d’affari appresi nell’incarico, prevedendo revoca e responsabilità. Il tema era già presente nella disciplina degli interessi degli amministratori: la nuova collocazione e formulazione non autorizzano a sostenere che prima l’appropriazione di opportunità fosse libera. L’art. 2396-bis rende espresso il divieto anche per i direttori generali. Artt. 2390, 2390-bis e 2396-bis c.c..&quot;]}}}, {&quot;id&quot;: &quot;C13&quot;, &quot;topic&quot;: &quot;Rischi TUF e comunicazioni Consob&quot;, &quot;expected&quot;: &quot;Compiti di delegati e consiglio; comunicazione di fatti accertati che possano costituire irregolarità o violazioni, non qualsiasi fatto.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 6 → artt. 147-sexies e 149 TUF&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P073&quot;, &quot;P074&quot;], &quot;passages&quot;: [&quot;Rischi. L&#x27;art. 147-sexies assegna ai delegati cura del funzionamento e dell&#x27;efficacia del sistema; il consiglio assicura e valuta il coordinamento per ottenere una rappresentazione unitaria, tempestiva e sistematica dei rischi. Il comitato preposto o l&#x27;amministratore incaricato, ove previsti e nei rispettivi compiti, assicurano tale rappresentazione mediante informazioni delle funzioni e indicatori anche non finanziari, secondo criteri di materialità. La conseguenza è che rapporti separati non bastano quando impediscono al consiglio di comprendere l&#x27;esposizione complessiva. [S1, art. 6]&quot;, &quot;Vigilanza e Consob. L&#x27;art. 149 TUF insiste anche sul funzionamento del processo amministrativo e sulla diligente osservanza delle regole istruttorie, procedimentali e decisionali delle migliori prassi. Richiede comunicazione senza indugio di atti o fatti accertati nella vigilanza che possano costituire irregolarità di gestione o violazioni di legge o statuto, con verbali e documentazione utile; prevede una specifica esclusione per le società quotate solo in mercati regolamentati di altri Paesi UE. La possibilità di irregolarità non richiede una previa sentenza, ma resta il requisito di fatti accertati nell&#x27;attività di vigilanza. [S1, art. 6]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D03&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P111&quot;, &quot;P112&quot;], &quot;passages&quot;: [&quot;Controllo interno e rischi (art. 147-sexies). Gli organi delegati curano il buon funzionamento e l&#x27;efficacia del sistema; il consiglio ne assicura e valuta il coordinamento, così da avere una rappresentazione unitaria, tempestiva e sistematica dei rischi, di cui si dà conto nella relazione sul governo societario.&quot;, &quot;Organo di controllo (artt. 148, 149). Quote di genere con almeno due quinti dei componenti (un terzo se l&#x27;organo ha tre membri); cause di ineleggibilità allineate all&#x27;art. 2396-septies; requisiti di indipendenza, onorabilità e professionalità da fissare con decreto interministeriale; la decadenza è dichiarata entro novanta giorni dalla nomina o dalla conoscenza del difetto. L&#x27;organo comunica senza indugio alla Consob gli atti e i fatti accertati che possano costituire irregolarità di gestione o violazioni di legge e statuto: il CNDCEC rileva che la formula sembra estendersi anche a irregolarità solo potenziali.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;R&quot;, &quot;refs&quot;: [&quot;P163&quot;, &quot;P189&quot;], &quot;passages&quot;: [&quot;Obbligo di comunicazione alla Consob (art. 149, co. 2, TUF). Nelle quotate l&#x27;organo di controllo comunica senza indugio gli atti o fatti accertati nella vigilanza, non più solo le irregolarità riscontrate. La FNC segnala il rischio di un obbligo esteso anche a irregolarità soltanto potenziali.&quot;, &quot;Riscritti: funzionamento dell&#x27;organo amministrativo, assetti, controllo interno ex art. 147-sexies; comunicazione alla Consob degli atti o fatti accertati&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P071&quot;, &quot;P074&quot;], &quot;passages&quot;: [&quot;L’art. 147-sexies TUF attribuisce agli organi delegati la cura del funzionamento e dell’efficacia del sistema dei controlli e dei rischi; al consiglio affida il coordinamento delle funzioni. Il comitato rischi o l’amministratore incaricato, ove previsti e nei limiti delle rispettive competenze, concorrono alla rappresentazione complessiva dei rischi, usando anche indicatori non finanziari. Tale rappresentazione trova spazio nella relazione sul governo societario. [N2]&quot;, &quot;L’art. 149, comma 2, richiede inoltre la comunicazione senza indugio alla Consob degli atti o fatti accertati nella vigilanza che possano costituire irregolarità gestionali o violazioni di legge o statuto, con i relativi documenti. L’attivazione di rimedi interni non sostituisce questo obbligo. È prevista l’eccezione per le società con azioni quotate soltanto in mercati regolamentati di altri Stati dell’Unione europea. [N2]&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P045&quot;, &quot;P046&quot;], &quot;passages&quot;: [&quot;il coordinamento delle funzioni per ottenere una rappresentazione unitaria dei rischi;&quot;, &quot;la vigilanza sul funzionamento dell’organo amministrativo e sulle sue procedure decisionali;&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P087&quot;, &quot;P088&quot;], &quot;passages&quot;: [&quot;L’art. 147-sexies TUF attribuisce agli organi delegati la cura del funzionamento e dell’efficacia del sistema di controllo interno e di gestione dei rischi; al consiglio affida il coordinamento delle funzioni per una rappresentazione unitaria, tempestiva e sistematica. I soggetti interni specificamente incaricati, ove previsti, operano nei rispettivi compiti, tenendo conto della materialità e di indicatori anche non finanziari.&quot;, &quot;L’art. 149 riformula la vigilanza dell’organo di controllo sul funzionamento dell’organo amministrativo e sulla diligente osservanza delle regole istruttorie, procedimentali e decisionali elaborate dalle migliori prassi. Il controllo riguarda dunque anche il processo attraverso il quale si decide; non trasferisce ai controllori la gestione o la scelta imprenditoriale. Per le società soggette al relativo obbligo, la comunicazione senza indugio alla Consob riguarda atti o fatti accertati che possano costituire irregolarità gestorie o violazioni di legge o statuto. TUF, artt. 147-sexies e 149.&quot;]}}}, {&quot;id&quot;: &quot;C14&quot;, &quot;topic&quot;: &quot;Nomine e perdita dell’indipendenza&quot;, &quot;expected&quot;: &quot;Criteri di composizione complessiva; decadenza per perdita di indipendenza subordinata all’insufficienza dei residui. Requisiti specifici restano applicabili.&quot;, &quot;source&quot;: &quot;https://www.consob.it/documents/1912911/1962639/dlgs58_1998.pdf&quot;, &quot;location&quot;: &quot;Artt. 147-bis.1, 147-ter, 148 e seguenti&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P072&quot;], &quot;passages&quot;: [&quot;Composizione. L&#x27;art. 147-bis.1 TUF richiede norme statutarie che favoriscano professionalità, rappresentatività e diversità dell&#x27;organo nel suo complesso. Restano le prescrizioni applicabili su nomine, minoranze e genere: il principio generale non le sostituisce. L&#x27;art. 147-ter, comma 4-bis, disciplina la decadenza del consigliere che perde l&#x27;indipendenza quando gli indipendenti residui non assicurano i requisiti legali e statutari. [S1, art. 6]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D03&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P109&quot;, &quot;P110&quot;], &quot;passages&quot;: [&quot;Composizione degli organi (art. 147-bis.1). Principio generale di professionalità, rappresentatività e diversità; statuti da adeguare in tempo per le nomine e i rinnovi dal 2027.&quot;, &quot;Indipendenza e onorabilità (artt. 147-ter, 147-quinquies). L&#x27;amministratore indipendente che perde i requisiti dopo la nomina non decade automaticamente: la decadenza è dichiarata dall&#x27;organo di amministrazione solo se il numero residuo di indipendenti non basta a rispettare legge e statuto. La perdita dei requisiti di onorabilità comporta invece decadenza (con applicazione legata ai regolamenti attuativi).&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P183&quot;, &quot;P186&quot;], &quot;passages&quot;: [&quot;Lo statuto fissa criteri di professionalità, rappresentatività e diversità per le nomine; la perdita dell&#x27;indipendenza non comporta sempre decadenza&quot;, &quot;Quote di genere 2/5 (1/3 se tre membri); affinità entro il secondo grado; decadenza dichiarata entro 90 giorni; nuove norme di composizione per i tre organi&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;A&quot;, &quot;refs&quot;: [], &quot;passages&quot;: []}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P079&quot;, &quot;P080&quot;], &quot;passages&quot;: [&quot;Per le quotate, l’art. 147-bis.1 TUF richiede regole statutarie di elezione che favoriscano professionalità, rappresentatività e diversità dell’organo nel suo insieme. Le quote di genere e gli altri requisiti specifici restano autonomamente applicabili. Per l’organo di controllo, l’art. 148 prevede due quinti del genere meno rappresentato, oppure un terzo se i componenti sono tre, nel quadro della disciplina dei sei mandati consecutivi. [N2]&quot;, &quot;L’amministratore indipendente che perda i requisiti non decade automaticamente in ogni caso: il nuovo art. 147-ter, comma 4-bis, collega la decadenza all’insufficienza degli indipendenti residui rispetto ai requisiti di legge e statuto. Restano da verificare la sua eventuale appartenenza all’organo di controllo e gli ulteriori requisiti di tale incarico. [N2]&quot;]}, &quot;D07&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P065&quot;], &quot;passages&quot;: [&quot;adeguamento statutario ai principi sulla composizione degli organi in tempo utile per le nomine dall’esercizio successivo a quello in corso all’entrata in vigore;&quot;]}, &quot;D08&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P083&quot;, &quot;P085&quot;], &quot;passages&quot;: [&quot;Il nuovo art. 147-bis.1 TUF richiede regole statutarie di elezione che promuovano professionalità, rappresentatività e diversità della composizione complessiva degli organi. Non basta considerare isolatamente l’eleggibilità di ciascun candidato: va esaminato anche l’insieme delle competenze e delle rappresentanze.&quot;, &quot;Il nuovo art. 147-ter, comma 4-bis, collega la decadenza dell’amministratore che perde l’indipendenza all’insufficienza del numero residuo di indipendenti richiesto da legge e statuto. Prima il testo prevedeva la decadenza in ogni caso. La verifica va svolta e documentata; non è una rinuncia al requisito. La regola non va confusa con i diversi presupposti di decadenza dei controllori o per difetto di onorabilità. TUF, art. 147-ter, e relativa nota di modifica.&quot;]}}}, {&quot;id&quot;: &quot;C15&quot;, &quot;topic&quot;: &quot;Responsabilità sindaci e MTF&quot;, &quot;expected&quot;: &quot;Distinguere limite ex legge 35/2025 e art. 151.2; società italiane con azioni su MTF; restano danno, violazione e nesso causale.&quot;, &quot;source&quot;: &quot;https://www.gazzettaufficiale.it/eli/gu/2026/04/14/86/so/14/sg/pdf&quot;, &quot;location&quot;: &quot;Art. 6 → art. 151.2 TUF; legge 35/2025&quot;, &quot;group&quot;: &quot;Nucleo&quot;, &quot;cells&quot;: {&quot;D01&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P078&quot;, &quot;P079&quot;], &quot;passages&quot;: [&quot;La legge 35/2025 aveva introdotto nell&#x27;art. 2407, fuori dal dolo, limiti al risarcimento collegati al compenso annuo: quindici volte fino a 10.000 euro, dodici volte da 10.000 a 50.000 euro e dieci volte oltre 50.000 euro. [S5]&quot;, &quot;L&#x27;art. 151.2 TUF introdotto dal decreto stabilisce per i componenti del collegio sindacale la responsabilità solidale con gli amministratori quando il danno sarebbe stato evitato da una vigilanza conforme ai doveri. La disposizione si applica anche alle società italiane con azioni negoziate su sistemi multilaterali, in luogo dell&#x27;art. 2407, comma 2. In questo perimetro il limite quantitativo basato sul compenso non costituisce la protezione prevista dalla norma speciale. Occorrono comunque violazione dei doveri, danno e collegamento causale: responsabilità senza tetto non significa responsabilità automatica per ogni perdita. [S1, art. 6]&quot;]}, &quot;D02&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P155&quot;, &quot;P158&quot;], &quot;passages&quot;: [&quot;Il limite risarcitorio dell&#x27;art. 2407, co. 2 (L. 35/2025: 15, 12 o 10 volte il compenso annuo a seconda dello scaglione) resta riferito ai sindaci delle società non quotate con collegio sindacale.&quot;, &quot;Nelle quotate e nelle società su MTF il nuovo art. 151.2 TUF esclude il tetto anche per i sindaci.&quot;]}, &quot;D03&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P114&quot;], &quot;passages&quot;: [&quot;Responsabilità dei sindaci (art. 151.2). Per le quotate e, per estensione, per le società su sistemi multilaterali di negoziazione si deroga all&#x27;art. 2407, comma 2, c.c.: i sindaci rispondono in solido con gli amministratori quando il danno non si sarebbe prodotto se avessero vigilato conformemente ai doveri del loro incarico, senza i limiti quantitativi previsti per le non quotate. Il CNDCEC giudica la scelta non condivisibile e auspica un regime uniforme.&quot;]}, &quot;D04&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P161&quot;, &quot;P162&quot;], &quot;passages&quot;: [&quot;Sindaci delle non quotate (art. 2407, co. 2, c.c.). Resta il limite introdotto dalla l. 35/2025, in vigore dal 12 aprile 2025: salvo dolo, il risarcimento è parametrato a un multiplo del compenso annuo (da 10 a 15 volte, per scaglioni di compenso). Il d.lgs. 47/2026 non lo modifica.&quot;, &quot;Sindaci delle quotate (nuovo art. 151.2 TUF). Per le società quotate e ammesse a MTF il limite non si applica: i componenti dell&#x27;organo di controllo rispondono in solido con gli amministratori quando il danno non si sarebbe prodotto con una vigilanza conforme ai doveri della carica. Negli altri modelli (consiglio di sorveglianza, comitato) la responsabilità resta solidale e senza limite. Il CNDCEC ha criticato la divaricazione tra quotate e non quotate (Edotto; Studio Bogoni).&quot;]}, &quot;D05&quot;: {&quot;status&quot;: &quot;P&quot;, &quot;refs&quot;: [&quot;P022&quot;, &quot;P130&quot;], &quot;passages&quot;: [&quot;e) Quotate (TUF). Responsabilità solidale e senza limite dei sindaci delle quotate e delle società ammesse a un MTF (nuovo art. 151.2 TUF); regole su OPA, voto plurimo e acquisto totalitario; regime semplificato su base statutaria per neo-quotate e PMI quotate sotto 1 miliardo di capitalizzazione.&quot;, &quot;Limite di responsabilità dei sindaci delle non quotate. Uno studio professionale attribuisce il limite (art. 2407, co. 2, c.c.) alla L. 35/2025, riforma precedente, e non al D.lgs. 47/2026, che introdurrebbe solo l&#x27;art. 151.2 TUF per le quotate. Le fonti non concordano nemmeno sulla misura del limite (il commento parla di 10-15 volte il compenso). Da verificare norma e misura.&quot;]}, &quot;D06&quot;: {&quot;status&quot;: &quot;U&quot;, &quot;refs&quot;: [&quot;P097&quot;, &quot;P098&quot;], &quot;passages&quot;: [&quot;Per le quotate, il nuovo art. 151.2 TUF ripristina espressamente la responsabilità solidale dei sindaci con gli amministratori per i fatti o le omissioni di questi ultimi, quando il danno sarebbe stato evitato con una vigilanza conforme ai doveri dell’inca
