<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Il tuo risultato · Vera</title><link rel="stylesheet" href="/static/shared/vera/workflow-feedback.css"><script defer src="/static/shared/vera/workflow-feedback.js"></script></head>
<body><main><p class="brand">Vera</p><h1>Quanto ti è stato utile questo risultato?</h1><p>Da 1 a 5 stelle. La valutazione è facoltativa.</p>
<form id="feedback"><fieldset><legend>La tua valutazione</legend><div class="stars">
<label><input type="radio" name="stars" value="1" required><span>★</span><small>1</small></label>
<label><input type="radio" name="stars" value="2"><span>★</span><small>2</small></label>
<label><input type="radio" name="stars" value="3"><span>★</span><small>3</small></label>
<label><input type="radio" name="stars" value="4"><span>★</span><small>4</small></label>
<label><input type="radio" name="stars" value="5"><span>★</span><small>5</small></label>
</div><p class="scale">1 = per niente utile · 5 = molto utile</p></fieldset>
<label for="comment" id="comment-label">Vuoi aggiungere qualcosa? (facoltativo)</label><textarea id="comment" name="comment" maxlength="2000" rows="5" aria-describedby="boundary"></textarea><p id="boundary" class="hint">Il commento viene inviato al team Vera insieme alla valutazione. Scrivi del risultato, senza allegare dati dei clienti.</p><button type="submit">Invia valutazione</button><p role="status" id="status" aria-live="polite"></p></form></main></body></html>
