<script>
'use strict';
const labels = JSON.parse(document.getElementById('editor-labels').textContent);
let baseline, value, appSession, revision, saveAttempt;
let busy = false, selectedPath = null, destination = null, host = null, handedOff = false;
let dirty = false;
const workflows = ['revisione-contratti','confronto-documenti','revisione-documentale','redazione-da-modello','controllo-documento'];
const byId = id => document.getElementById(id);
const t = key => labels[value?.language || 'it'][key];
const clone = data => structuredClone(data);
const message = (text, error=false) => { byId('message').textContent = text; byId('message').classList.toggle('error',error); };
function changed() { saveAttempt = null; dirty = JSON.stringify(value) !== JSON.stringify(baseline); updateState(); message(''); }
function updateState() {
  byId('destination').textContent = t('save_location') + ': ' + destination;
  byId('state').textContent = t(dirty ? 'unsaved' : 'saved') + ' · ' + t('version') + ' ' + value.version;
  byId('reset').hidden = !dirty;
  byId('identity').textContent = value.derived_from ? t('derived') + ' · ' + t('version') + ' ' + value.derived_from.version : '';
  document.querySelectorAll('button, input, textarea, select').forEach(input => input.disabled = busy);
  byId('use').disabled = busy || dirty || !selectedPath || handedOff || !(host?.hostCapabilities?.message?.text || host?.hostCapabilities?.experimental?.['openai/message']);
  byId('use').title = host?.hostCapabilities?.message?.text || host?.hostCapabilities?.experimental?.['openai/message'] ? '' : t('use_unavailable');
  byId('tracked').disabled = !value.outputs.includes('docx');
  byId('tracked').checked = value.tracked_changes;
}
function field(parent,key,rows=1,list=false) {
  const label = document.createElement('label'); label.className='field';
  const title = document.createElement('span'); title.className='field-title'; title.textContent=t(key); label.append(title);
  const input = document.createElement(rows===1?'input':'textarea'); input.id=key;
  if(rows===1) input.type='text'; else input.rows=rows;
  input.value=list?value[key].join('\n'):value[key];
  input.addEventListener('input',()=>{value[key]=list?input.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean):input.value;changed();});
  label.append(input);
  if(t(key+'_help')) { const help=document.createElement('span'); help.className='help'; help.textContent=t(key+'_help');help.id=key+'-help'; input.setAttribute('aria-describedby',help.id);label.append(help); }
  byId(parent).append(label);
}
function draw() {
  document.documentElement.lang=value.language;document.title='Lucia · '+t('title');
  document.querySelectorAll('[data-label]').forEach(node=>node.textContent=t(node.dataset.label));
  byId('language').value=value.language;
  for(const id of ['identity-fields','method-fields','template-field']) byId(id).replaceChildren();
  field('identity-fields','name');field('identity-fields','purpose',3);
  field('method-fields','columns',5,true);field('method-fields','questions',4,true);field('method-fields','firm_positions',7);field('method-fields','source_requirements',4,true);field('template-field','template_name');
  const choices=byId('workflows'); choices.querySelectorAll('label').forEach(node=>node.remove());
  workflows.forEach(workflow=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='radio';input.name='workflow';input.value=workflow;input.checked=value.workflow===workflow;input.addEventListener('change',()=>{value.workflow=workflow;changed();});const text=document.createElement('span');text.textContent=t('workflows')[workflow];label.append(input,text);choices.append(label);});
  const formats=byId('formats');formats.querySelectorAll('label').forEach(node=>node.remove());
  ['html','xlsx','docx'].forEach(format=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='checkbox';input.value=format;input.checked=value.outputs.includes(format);input.addEventListener('change',()=>{value.outputs=['html','xlsx','docx'].filter(f=>formats.querySelector('input[value="'+f+'"]').checked);if(!value.outputs.includes('docx'))value.tracked_changes=false;changed();});const text=document.createElement('span');text.textContent=t('formats')[format];label.append(input,text);formats.append(label);});
  updateState();
}
function validate(data) {
  const required=['schema_version','id','version','derived_from','name','workflow','language','purpose','columns','questions','firm_positions','source_requirements','template_name','outputs','tracked_changes'];
  const str=(v,max,needed=false)=>typeof v==='string'&&v.length<=max&&(!needed||v.trim().length>0);
  const strings=(v,maxItems,maxLength,needed=false)=>Array.isArray(v)&&v.length<=maxItems&&(!needed||v.length>0)&&v.every(s=>str(s,maxLength,true));
  const id=v=>typeof v==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(v);
  const version=v=>Number.isSafeInteger(v)&&v>=1;
  if(!data||typeof data!=='object'||Array.isArray(data)||Object.keys(data).length!==required.length||!required.every(k=>Object.hasOwn(data,k)))throw new Error(t('invalid'));
  const parent=data.derived_from;
  if(data.schema_version!==1||!id(data.id)||!version(data.version)||!(parent===null||(typeof parent==='object'&&!Array.isArray(parent)&&Object.keys(parent).length===2&&id(parent.id)&&version(parent.version)))||!str(data.name,300,true)||!str(data.purpose,5000,true)||!workflows.includes(data.workflow)||!Object.hasOwn(labels,data.language)||!strings(data.columns,100,300,true)||new Set(data.columns.map(s=>s.trim().toLocaleLowerCase())).size!==data.columns.length||!strings(data.questions,100,2000)||!strings(data.source_requirements,100,2000)||!str(data.firm_positions,50000)||!str(data.template_name,500)||!Array.isArray(data.outputs)||!data.outputs.length||new Set(data.outputs).size!==data.outputs.length||!data.outputs.every(s=>['html','xlsx','docx'].includes(s))||typeof data.tracked_changes!=='boolean'||(data.tracked_changes&&!data.outputs.includes('docx')))throw new Error(t('invalid'));
  return data;
}
byId('language').addEventListener('change',event=>{value.language=event.target.value;changed();draw();});
byId('tracked').addEventListener('change',event=>{value.tracked_changes=event.target.checked;changed();});
byId('reset').addEventListener('click',()=>{value=clone(baseline);dirty=false;draw();message(t('reset_done'));});
byId('duplicate').addEventListener('click',()=>{value.derived_from={id:baseline.id,version:baseline.version};value.id='studio-'+crypto.randomUUID();value.version=1;value.name=value.name+' — '+t('copy');dirty=true;draw();message(t('copy_done'));byId('name').focus();});
byId('export').addEventListener('click',async()=>{
  if(busy || !appSession)return;
  try{
    const next=clone(validate(value));
    if(new TextEncoder().encode(JSON.stringify(next)).byteLength>1000000)throw new Error(t('too_large'));
    saveAttempt ||= {session:appSession,revision,request_id:crypto.randomUUID(),value:next};
    busy=true;updateState();
    const result=await request('tools/call',{name:'lucia_method_save',arguments:saveAttempt});
    accept(result);saveAttempt=null;message(t('export_done'));
  }catch(error){message(error.message,true);}
  finally{busy=false;if(value)updateState();}
});
byId('import').addEventListener('click',()=>{if(dirty){message(t('dirty_import'),true);return;}byId('file').click();});
byId('file').addEventListener('change',async event=>{
  const file=event.target.files[0];event.target.value='';if(!file)return;
  try{if(file.size>1000000)throw new Error(t('too_large'));const imported=validate(JSON.parse(await file.text()));busy=true;updateState();const result=await request('tools/call',{name:'lucia_method_import',arguments:{session:appSession,value:imported}});accept(result);message(t('import_done'));}catch(error){message(t('import_error')+' '+error.message,true);}finally{busy=false;if(value)updateState();}
});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
let nextId=0;
const pending=new Map();
function request(method,params){
  return new Promise((resolve,reject)=>{
    const id=++nextId;
    const timer=setTimeout(()=>{pending.delete(id);reject(new Error(t('unconfirmed')));},30000);
    pending.set(id,{resolve,reject,timer});
    window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
  });
}
function accept(result){
  if(result?.isError)throw new Error(result.content?.find(item=>item.type==='text')?.text || t('invalid'));
  const data=result?._meta?.method;
  if(!data)throw new Error(t('unconfirmed'));
  value=clone(validate(data.value));baseline=clone(value);appSession=data.session;revision=data.revision;selectedPath=data.path || null;destination=data.directory;handedOff=false;dirty=false;
  document.querySelector('main').hidden=false;byId('loading').hidden=true;draw();
  if(data.example)message(t('example'));
}
byId('use').addEventListener('click',async()=>{
  if(byId('use').disabled || !selectedPath)return;
  handedOff=true;busy=true;updateState();
  try{
    // Recheck the saved file and revision before selecting it; no-op saves write nothing.
    const verified=await request('tools/call',{name:'lucia_method_save',arguments:{session:appSession,revision,request_id:crypto.randomUUID(),value:baseline}});
    if(verified?.isError || verified?._meta?.method?.path!==selectedPath)throw new Error(t('use_unconfirmed'));
    const text=t('use_prompt')+'\n'+t('method_name')+': «'+baseline.name+'» · '+t('version')+' '+baseline.version+'\n'+t('method_file')+': '+selectedPath;
    const extension=!!host?.hostCapabilities?.experimental?.['openai/message'];
    const params={role:'user',content:extension?[{type:'text',text}]:{type:'text',text}};
    if(extension)params._meta={'openai/message':{target:'active'}};
    const result=await request('ui/message',params);if(result?.isError)throw new Error(t('use_unconfirmed'));message(t('use_done'));
  }catch(error){message(t('use_unconfirmed'),true);}
  finally{busy=false;updateState();}
});
window.addEventListener('message',event=>{
  if(event.source!==window.parent || event.data?.jsonrpc!=='2.0')return;
  const incoming=event.data,item=pending.get(incoming.id);
  if(item){clearTimeout(item.timer);pending.delete(incoming.id);incoming.error?item.reject(new Error(incoming.error.message)):item.resolve(incoming.result);return;}
  if(incoming.method==='ui/notifications/tool-result' && incoming.params?._meta?.method){
    if(dirty || busy)return;
    try{accept(incoming.params);}catch(error){byId('loading').textContent=error.message;}
  }
  if(incoming.method==='ui/resource-teardown')window.parent.postMessage({jsonrpc:'2.0',id:incoming.id,result:{}},'*');
});
request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Lucia firm method',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}})
.then(result=>{host=result;if(value)updateState();window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');})
.catch(()=>{byId('loading').textContent='Riapri le istruzioni dalla chat di Lucia.';});
</script>
