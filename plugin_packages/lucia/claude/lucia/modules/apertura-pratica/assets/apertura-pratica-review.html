<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucia · Apertura pratica</title>
  <style>
    :root { color-scheme: light; font-family: "Instrument Sans", system-ui, sans-serif; --navy:#002060; --blue:#087acc; --ink:#18202c; --muted:#5f6876; --rule:#d9e0e7; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:#fff; } main { width:min(1040px, calc(100% - 32px)); margin:48px auto 80px; }
    header { border-top:4px solid var(--blue); border-bottom:1px solid var(--rule); padding:28px 0; margin-bottom:28px; }
    .eyebrow { color:var(--blue); font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; } h1 { color:var(--navy); font-size:clamp(34px,6vw,64px); line-height:.95; margin:12px 0; }
    p { line-height:1.55; } .notice { max-width:760px; color:var(--muted); } .toolbar { display:grid; grid-template-columns:1fr auto; gap:16px; align-items:end; margin:28px 0; }
    label { display:grid; gap:7px; font-size:13px; font-weight:700; } input,select,textarea,button { font:inherit; } input,select,textarea { border:1px solid #aeb9c6; border-radius:2px; padding:10px 12px; background:#fff; }
    .scope { margin:32px 0; } .scope h2 { color:var(--navy); font-size:25px; padding-bottom:10px; border-bottom:1px solid var(--navy); }
    article { display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:24px; padding:20px 0; border-bottom:1px solid var(--rule); } h3 { margin:0 0 8px; font-size:18px; } pre { white-space:pre-wrap; overflow-wrap:anywhere; color:#394353; font:12px/1.5 ui-monospace,monospace; }
    .decision { display:grid; gap:9px; align-content:start; } textarea { min-height:88px; resize:vertical; } button { border:0; padding:12px 18px; background:var(--navy); color:#fff; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.45; cursor:not-allowed; } #status { min-height:24px; color:var(--muted); } .bad { color:#9b1c1c!important; } .good { color:#087447!important; }
    @media(max-width:720px){ main{margin-top:20px}.toolbar,article{grid-template-columns:1fr} }
  </style>
</head>
<body><main>
  <header><div class="eyebrow">Lucia · revisione locale</div><h1>Apertura pratica</h1><p class="notice">Rivedi ogni elemento. Il salvataggio crea una bozza di decisioni: non apre la pratica, non autorizza operazioni sui file e non sostituisce il controllo professionale su conflitti, scadenze, incarico o antiriciclaggio.</p></header>
  <div class="toolbar"><label>Revisore<input id="reviewer" autocomplete="name" maxlength="160" required></label><button id="save" disabled>Salva decisioni da applicare</button></div>
  <div id="status" role="status"></div><div id="items"></div>
</main><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let review=null; const base=location.pathname.replace(/\/$/,"");
function render(payload){review=payload.review;const scopes={};for(const item of review.items)(scopes[item.scope]??=[]).push(item);const root=document.querySelector("#items");root.innerHTML=Object.entries(scopes).map(([scope,items])=>`<section class="scope"><h2>${esc(scope)}</h2>${items.map(item=>`<article data-id="${esc(item.id)}"><div><h3>${esc(item.title)}</h3><p><strong>Stato:</strong> ${esc(item.status)} · <strong>Proposta:</strong> ${esc(item.recommended_action)}</p><pre>${esc(JSON.stringify(item.data,null,2))}</pre></div><div class="decision"><label>Decisione<select><option value="">Da rivedere</option>${item.allowed_actions.map(a=>`<option value="${a}" ${a===item.recommended_action?"selected":""}>${a}</option>`).join("")}</select></label><label>Nota<textarea maxlength="5000"></textarea></label></div></article>`).join("")}</section>`).join("");document.querySelector("#save").disabled=false;}
async function load(){try{const r=await fetch(`${base}/api/review`,{cache:"no-store"});if(!r.ok)throw new Error((await r.json()).error);render(await r.json());}catch(e){const s=document.querySelector("#status");s.className="bad";s.textContent=e.message;}}
document.querySelector("#save").addEventListener("click",async()=>{const reviewer=document.querySelector("#reviewer").value.trim();const decisions=[...document.querySelectorAll("article")].map(a=>({item_id:a.dataset.id,action:a.querySelector("select").value,note:a.querySelector("textarea").value.trim()})).filter(d=>d.action);const s=document.querySelector("#status");if(!reviewer){s.className="bad";s.textContent="Indica il revisore.";return;}try{const r=await fetch(`${base}/api/decisions`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reviewer,decisions})});const out=await r.json();if(!r.ok)throw new Error(out.error);s.className="good";s.textContent="Bozza salvata in pending_review_decisions.json. Deve ancora essere applicata con conferma esplicita.";}catch(e){s.className="bad";s.textContent=e.message;}});load();
</script></body></html>
