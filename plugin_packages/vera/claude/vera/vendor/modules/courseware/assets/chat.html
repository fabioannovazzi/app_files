*{box-sizing:border-box}
body{margin:0;background:var(--paper,#fff);font:16px/1.5 "Instrument Sans",sans-serif}
header{padding:14px clamp(18px,3vw,40px);border-bottom:1px solid var(--line,#ddd)}
main{max-width:46rem;padding:var(--space-xl,2rem) clamp(18px,3vw,40px)}
p{margin:12px 0}h1{margin:0 0 16px}button{font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:default}
.brand{text-transform:lowercase}.brand::after{content:"."}.detail{font-size:.875rem;color:var(--muted,#596671);border-top:1px solid var(--line,#ddd);padding-top:16px;overflow-wrap:anywhere}#status:empty{display:none}

/* VERA_SHARED_THEME_START — generated; edit plugins/_shared/ui/vera-theme.css */
/* Canonical Vera workflow theme. Derived from the Vouching review surface.
 * Run: python scripts/sync_vera_ui_theme.py after changing this file.
 * Embedded at build time: no remote fonts, imports, or host CSS dependencies.
 */
:root {
  color-scheme: light;
  --paper: #ffffff;
  --surface: #ffffff;
  --soft: #fafafa;
  --soft-strong: #f3f4f2;
  --ink: #1f2421;
  --text: #3f4541;
  --muted: #596671;
  --border: #e8eae7;
  --border-strong: #d8dcd7;
  --accent: #194b70;
  --accent-strong: #123650;
  --accent-soft: #eff5f9;
  --danger: #7b4b44;
  --danger-bg: #fbf7f6;
  --warning: #6f6247;
  --warning-bg: #fbfaf6;
  --ok: #4b6759;
  --ok-bg: #f7faf8;
  --info: #52646e;
  --info-bg: #f7fafb;
  --radius: 8px;
  --font-ui: "Instrument Sans", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-size-ui: 1rem;
  --font-size-control: 0.875rem;
  --font-size-title: 1.25rem;
  --font-size-heading: 1.05rem;
  --control-padding: 0.55rem 0.75rem;
  --control-height: 2.5rem;
  --space-xs: 0.25rem;
  --space-sm: 0.5rem;
  --space-md: 0.75rem;
  --space-lg: 1rem;
  --space-xl: 1.5rem;
  /* Compatibility aliases for existing layout-specific selectors. */
  --navy: var(--accent);
  --blue: var(--accent);
  --cyan: var(--accent);
  --line: var(--border);
  --rule: var(--border);
  --wash: var(--soft);
  --bg: var(--paper);
  --focus-border-color: var(--accent);
  --focus-ring-color: var(--border-strong);
  --mparanza-pill-font-family: var(--font-ui);
  --white: var(--paper);
  --line-strong: var(--border-strong);
  --quiet: var(--muted);
  --blue-wash: var(--accent-soft);
  --green: var(--ok);
  --green-wash: var(--ok-bg);
  --amber: var(--warning);
  --amber-wash: var(--warning-bg);
  --red: var(--danger);
  --red-wash: var(--danger-bg);
  --focus: var(--accent);
  --teal: var(--accent);
  --teal-soft: var(--accent-soft);
  --green-soft: var(--ok-bg);
  --amber-soft: var(--warning-bg);
  --red-soft: var(--danger-bg);
  --sans: var(--font-ui);
  --serif: var(--font-ui);
}
:root body {
  background: var(--paper);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--font-size-ui);
  line-height: 1.5;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}
/* Hosts may pin their body font; keep the app content on its own typeface. */
:root body > :not(script, style) {
  font-family: var(--font-ui);
}
:root :is(h1, h2, h3, h4, .brand, .brand span) { color: var(--ink); font-family: var(--font-ui); }
:root h1 { font-size: var(--font-size-title); font-weight: 650; line-height: 1.25; letter-spacing: 0; }
:root :is(h2, h3) { font-size: var(--font-size-heading); font-weight: 650; line-height: 1.3; letter-spacing: 0; }
:root .brand { font-size: 1.25rem; font-weight: 650; letter-spacing: -0.04em; }
:root :is(main, .main) > button { margin-inline-end: var(--space-sm); margin-block-end: var(--space-sm); }
:root :is(a, summary, .eyebrow, .product) { color: var(--accent); }
:root :is(button, input, textarea, select, .button) {
  font-family: var(--font-ui);
  font-size: var(--font-size-control);
  line-height: 1.4;
  letter-spacing: 0;
  accent-color: var(--accent);
}
:root :is(button, .button, .custom-select__button) {
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface);
  background-image: none;
  color: var(--text);
  box-shadow: none;
  padding: var(--control-padding);
  min-height: var(--control-height);
}
:root :is(button, .button, .custom-select__button):hover:not(:disabled) {
  background: var(--soft-strong);
  border-color: var(--border-strong);
}
/* Review controls keep their label width at every panel breakpoint. */
:root :is(.action-buttons, .tabs, .state-filters, .decision-grid) {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
  gap: 0.4rem;
  min-width: 0;
}
:root :is(.action-buttons, .tabs, .state-filters, .decision-grid) > button {
  flex: 0 1 auto;
  width: auto;
  max-width: 100%;
  justify-content: center;
  white-space: normal;
  overflow-wrap: anywhere;
}
:root :is(button.primary, .button.primary) {
  background: var(--accent);
  border-color: var(--accent);
