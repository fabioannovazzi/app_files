name: Worker runtime compatibility

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-cov openpyxl pdfplumber reportlab -r plugins/journal-bank-reconciliation/requirements.txt
      - run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_worker_runtime_compatibility.py
          tests/plugins/test_reconciliation_worker_capabilities.py
          tests/plugins/test_journal_bank_reconciliation_plugin.py
          tests/plugins/test_archive_journal_bank_projection.py
          plugins/passive-invoice-audit/tests/test_passive_invoice_audit.py
          -k 'semantic or host_profile or host_status or matching_host or worker or luna'

  latest-native-runtime:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      VERA_TEST_NATIVE_RUNTIME: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest pytest-cov openpyxl pdfplumber reportlab -r plugins/journal-bank-reconciliation/requirements.txt
      - name: Install latest official Codex and locate its native executable
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-current" @openai/codex@latest
          case "$(uname -m)" in
            arm64) VERA_CODEX_TARGET=aarch64-apple-darwin ;;
            x86_64) VERA_CODEX_TARGET=x86_64-apple-darwin ;;
            *) echo "No official Codex binary target for this runner architecture"; exit 1 ;;
          esac
          CODEX_NATIVE=$(find "$RUNNER_TEMP/codex-current/node_modules/@openai" -type f -path "*/$VERA_CODEX_TARGET/*/codex" -perm -111 -print -quit)
          test -n "$CODEX_NATIVE"
          echo "VERA_TEST_CODEX_BIN=$CODEX_NATIVE" >> "$GITHUB_ENV"
      - name: Verify live allow and deny boundaries with current Codex and macOS
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_worker_runtime_compatibility.py
          tests/plugins/test_journal_bank_reconciliation_plugin.py
          tests/plugins/test_archive_journal_bank_projection.py
          plugins/passive-invoice-audit/tests/test_passive_invoice_audit.py
          -k 'semantic or host_profile or host_status or matching_host or worker or luna'
          --cov --cov-config=tests/plugins/worker_runtime.coveragerc
          --cov-report=term-missing --cov-fail-under=80
