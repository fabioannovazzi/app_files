name: Public copy editorial check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-copy-editorial.yml
      - scripts/validate_public_model_data_copy.py
      - static/shared/check-entries/index.html
      - static/shared/journal-sampling/index.html
  pull_request:
    paths:
      - .github/workflows/public-copy-editorial.yml
      - scripts/validate_public_model_data_copy.py
      - static/shared/check-entries/index.html
      - static/shared/journal-sampling/index.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-model-data-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject internal filenames and implementation jargon
        run: python scripts/validate_public_model_data_copy.py
