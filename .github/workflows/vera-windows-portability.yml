name: Vera portable intake and saved work

on:
  pull_request:
    paths:
      - 'plugins/studio-archive/**'
      - 'plugins/journal-bank-reconciliation/**'
      - 'plugins/_shared/**'
      - 'tests/plugins/test_archive_location_continuity.py'
      - 'tests/plugins/test_journal_bank_reconciliation_plugin.py'
      - '.github/workflows/vera-windows-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MPARANZA_INCIDENT_DELIVERY: local-only

jobs:
  portable-workflow:
    name: Saved reconciliation (${{ matrix.os }}, ${{ matrix.encoding }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        encoding: [cp1252, utf-8]
    env:
      PYTHONIOENCODING: ${{ matrix.encoding }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared test dependencies
        run: >-
          python -m pip install pytest pymupdf reportlab
          -r plugins/studio-archive/requirements.txt
          -r plugins/journal-bank-reconciliation/requirements.txt
      - name: Complete and reopen saved work across valid locations
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_archive_location_continuity.py
          tests/plugins/test_evidence_retrieval.py
          tests/plugins/test_reconciliation_response_recovery.py
          tests/plugins/test_studio_archive_file_identity.py
          tests/plugins/test_vera_verified_execution.py
      - name: Verify equivalent dates and reviewed ambiguities at intake
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_journal_bank_reconciliation_plugin.py
          -k 'native_serial_compact or timestamp_intake or ambiguous_day_month or reviewed_day_month or invalid_populated_date or semantic_replay_validates_historical_code'
      - name: Verify shared helper Unicode transport
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_managed_plugin_python_runtime.py
          -k managed_helper_json_round_trips
      - name: Verify executable binding, bank PDF recovery and retained output
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_worker_runtime_compatibility.py
          tests/plugins/test_grouped_reconciliation.py
          tests/plugins/test_bank_pdf_recovery.py
          tests/plugins/test_archive_reporting_recovery.py
          -k 'updated_executable or executable_change_during_execution or final_workbook_keeps_source_references or failed_schema_probe_retains or executable_hash_tolerates or bank_recovery_reaches_reconciliation or wrong_bank_closing or local_report_failure_returns_committed_status'
      - name: Exercise installed Windows worker readiness with a synthetic profile
        if: matrix.os == 'windows-latest' && matrix.encoding == 'utf-8'
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP "worker-readiness-cli"
          npm install --prefix $install @openai/codex@latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $binary = Get-ChildItem $install -Recurse -File -Filter codex.exe | Select-Object -First 1
          if (!$binary) { throw "Native Codex executable missing" }
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "synthetic-worker-profile"
          $env:CODEX_HOME = Join-Path $env:USERPROFILE ".codex"
          New-Item $env:CODEX_HOME -ItemType Directory -Force | Out-Null
          Set-Content (Join-Path $env:CODEX_HOME "installation_id") ([guid]::NewGuid()) -NoNewline
          Set-Content (Join-Path $env:CODEX_HOME "auth.json") '{}' -NoNewline
          Set-Content (Join-Path $env:CODEX_HOME "config.toml") @('[windows]', 'sandbox = "elevated"')
          $probe = Join-Path $env:RUNNER_TEMP "vera-readiness"
          python plugins/journal-bank-reconciliation/scripts/semantic_review.py host-status --codex-bin $binary.FullName --probe-dir $probe
          $status = $LASTEXITCODE
          if ($status) {
            Get-ChildItem $probe -Filter 'schema-canary-*.json' | ForEach-Object {
              $capture = Get-Content $_.FullName -Raw | ConvertFrom-Json
              Write-Output ("exit=" + $capture.return_code)
              Write-Output ([Text.Encoding]::UTF8.GetString([Convert]::FromHexString($capture.stderr_hex)))
              Write-Output ("stdout_hex=" + $capture.stdout_hex)
            }
          }
          exit $status
