name: Bilancio Windows locking

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-locks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep coverage ancestry without downloading historical release archives.
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-cov 'diff-cover>=9,<10' -r plugins/bilancio-xbrl-it/requirements.txt
      - name: Import the actual service and verify native case/job locks
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_bilancio_xbrl_it_service.py --cov --cov-config=tests/bilancio_lock.coveragerc --cov-report=xml
      - name: Require coverage of changed service code
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=80
