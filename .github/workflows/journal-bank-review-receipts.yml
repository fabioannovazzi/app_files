name: Journal-bank packaged review receipts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  product-archives:
    uses: ./.github/workflows/build-product-archives.yml

  native-preparation:
    name: Native bank preparation and privacy sidecars
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest pytest-cov 'coverage>=7.10' reportlab numpy beautifulsoup4 json-repair cryptography black==25.1.0 isort==6.0.1 mypy bandit -r scripts/requirements-plugin-build.txt -r plugins/journal-bank-reconciliation/requirements.txt -r plugins/studio-archive/requirements.txt
      - name: Verify initial reporting, source preparation, recovery and retained drafts
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_vera_native_bank_preparation.py
          tests/plugins/test_vera_native_bank_drafts.py
          --cov --cov-config=tests/vera_native_bank.coveragerc --cov-report=term-missing
      - name: Check preparation code quality
        run: |
          python -m black --check plugins/vera/scripts/native_bank_preparation.py tests/plugins/test_vera_native_bank_preparation.py tests/plugins/test_vera_native_bank_drafts.py
          python -m isort --check-only plugins/vera/scripts/native_bank_preparation.py tests/plugins/test_vera_native_bank_preparation.py tests/plugins/test_vera_native_bank_drafts.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/vera/scripts/native_bank_preparation.py
          python -m bandit -q -ll plugins/vera/scripts/native_bank_preparation.py
      - name: Verify retained review population, feedback and scoped navigation
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_vera_bank_review_feedback.py
          tests/plugins/test_vera_workspace_navigation.py
      - name: Check review feedback regressions and UI syntax
        run: |
          python -m black --check tests/plugins/test_vera_bank_review_feedback.py tests/plugins/test_vera_workspace_navigation.py
          python -m isort --check-only tests/plugins/test_vera_bank_review_feedback.py tests/plugins/test_vera_workspace_navigation.py
          python -m mypy --follow-imports=skip --ignore-missing-imports tests/plugins/test_vera_bank_review_feedback.py tests/plugins/test_vera_workspace_navigation.py
          node --check plugins/vera/ui/workspace.js
          node --check plugins/journal-bank-reconciliation/mcp/server.cjs

  review-receipts:
    needs: product-archives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download product archives built from this commit
        uses: actions/download-artifact@v4
        with:
          name: product-archives
          path: plugin_packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest pytest-cov reportlab black==25.1.0 isort==6.0.1 mypy bandit -r plugins/journal-bank-reconciliation/requirements.txt -r plugins/studio-archive/requirements.txt
      - name: Verify source and packaged Codex and Cowork receipt and Archive launcher paths
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_journal_bank_review_receipts.py
          tests/plugins/test_archive_authored_artifacts.py
          tests/plugins/test_archive_worker_reporting.py
          tests/plugins/test_journal_bank_reconciliation_plugin.py::test_reviewed_pdf_table_adapter_reconciles_amount_not_trailing_balance
          tests/plugins/test_journal_bank_reconciliation_plugin.py::test_canonical_snake_case_mapping_runs_amount_date_cascade_and_native_closure
          tests/plugins/test_journal_bank_reconciliation_plugin.py::test_initial_assurance_envelope_binds_exact_transitive_implementation_set
          tests/plugins/test_vera_model_data_report.py::test_local_only_build_never_invokes_stamping
          --cov=seal_review_receipts --cov-report=term-missing --cov-fail-under=80
      - name: Verify reviewed registration PDFs, continued entries and complete populations
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_journal_sampling_plugin.py
          tests/plugins/test_journal_bank_reconciliation_plugin.py
          tests/plugins/test_journal_pdf_recovery.py
          tests/plugins/test_agentic_pdf_recovery.py
          tests/plugins/test_bank_pdf_recovery.py
          -k 'registration_pdf or journal_pdf_recovery or agentic_pdf_recovery or bank_pdf_recovery'
          --cov=vera_journal_pdf --cov-report=term-missing --cov-fail-under=80
      - name: Verify shared PDF receipt integrity and worker termination diagnostics
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_journal_sampling_plugin.py
          tests/plugins/test_journal_bank_reconciliation_plugin.py
          tests/plugins/test_managed_plugin_python_runtime.py
          -k 'shared_pdf or forcibly_terminated or forced_exit or pdf_memory_error or pdf_table_failure or pdf_inspection_releases'
      - name: Verify registration PDF to Vouching handoff
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_check_entries_plugin.py::test_vouching_accepts_complete_reviewed_cross_page_pdf_journal
      - name: Verify complete grouped review, replay and final workbook
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_grouped_reconciliation.py tests/plugins/test_vera_bank_first.py
          --cov --cov-config=tests/plugins/grouped_reconciliation.coverage.ini
          --cov-report=term-missing --cov-fail-under=80
      - name: Verify rejected worker cost and diagnostic evidence retention
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_journal_bank_reconciliation_plugin.py
          -k 'native_worker_retains_protocol or abstention or rejected_worker_response'
      - name: Check grouped reconciliation quality
        run: |
          python -m black --check plugins/journal-bank-reconciliation/scripts/grouped_review.py plugins/journal-bank-reconciliation/scripts/grouped_workbook.py plugins/journal-bank-reconciliation/scripts/bank_working_copy.py plugins/journal-bank-reconciliation/scripts/bank_first.py tests/plugins/test_vera_bank_first.py tests/plugins/test_grouped_reconciliation.py
          python -m isort --check-only plugins/journal-bank-reconciliation/scripts/grouped_review.py plugins/journal-bank-reconciliation/scripts/grouped_workbook.py plugins/journal-bank-reconciliation/scripts/bank_working_copy.py plugins/journal-bank-reconciliation/scripts/bank_first.py tests/plugins/test_vera_bank_first.py tests/plugins/test_grouped_reconciliation.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/journal-bank-reconciliation/scripts/grouped_review.py plugins/journal-bank-reconciliation/scripts/grouped_workbook.py plugins/journal-bank-reconciliation/scripts/bank_working_copy.py plugins/journal-bank-reconciliation/scripts/bank_first.py
          python -m bandit -q -ll plugins/journal-bank-reconciliation/scripts/grouped_review.py plugins/journal-bank-reconciliation/scripts/grouped_workbook.py plugins/journal-bank-reconciliation/scripts/bank_working_copy.py plugins/journal-bank-reconciliation/scripts/bank_first.py
      - name: Verify zero-value journal retention and sample exclusion
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_journal_zero_rows.py
          tests/plugins/test_check_entries_plugin.py::test_check_entries_accepts_zero_rows_in_complete_upstream_journal
      - name: Check shared PDF reader quality
        run: |
          python -m black --check plugins/_shared/vendor/modules/vera_journal_pdf/*.py plugins/vera/scripts/managed_python_runtime.py tests/plugins/test_journal_pdf_recovery.py tests/plugins/journal_pdf_fixtures.py
          python -m isort --check-only plugins/_shared/vendor/modules/vera_journal_pdf/*.py plugins/vera/scripts/managed_python_runtime.py tests/plugins/test_journal_pdf_recovery.py tests/plugins/journal_pdf_fixtures.py
          python -m black --check tests/plugins/test_agentic_pdf_recovery.py tests/plugins/test_bank_pdf_recovery.py
          python -m isort --check-only tests/plugins/test_agentic_pdf_recovery.py tests/plugins/test_bank_pdf_recovery.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/_shared/vendor/modules/vera_journal_pdf/*.py plugins/vera/scripts/managed_python_runtime.py
          python -m bandit -q plugins/_shared/vendor/modules/vera_journal_pdf/*.py plugins/vera/scripts/managed_python_runtime.py
      - name: Check review entrypoint quality
        run: |
          python -m black --check plugins/journal-bank-reconciliation/scripts/seal_review_receipts.py tests/plugins/test_journal_bank_review_receipts.py
          python -m isort --check-only plugins/journal-bank-reconciliation/scripts/seal_review_receipts.py tests/plugins/test_journal_bank_review_receipts.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/journal-bank-reconciliation/scripts/seal_review_receipts.py
          python -m bandit -q plugins/journal-bank-reconciliation/scripts/seal_review_receipts.py
