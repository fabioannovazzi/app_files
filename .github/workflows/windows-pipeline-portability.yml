name: Windows pipeline portability
on:
  pull_request:
  push:
    branches: [codex/windows-pipeline-portability]
permissions:
  contents: read
jobs:
  native-boundaries:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest pytest-cov pypdf -r plugins/financial-analysis/requirements.txt
      - run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_windows_contract_io.py tests/plugins/test_windows_worker_process.py
      - name: Exercise the actual pipelines in isolated Python interpreters
        shell: bash
        run: |
          set -euo pipefail
          for suite in test_archive_run_isolation test_studio_archive_readable test_vera_native_archive_navigation test_vera_financial_analysis test_vera_fdd_io_hardening test_vera_sales_plan_preparation; do
            python -m pytest -q -o addopts='' --confcutdir=tests/plugins "tests/plugins/${suite}.py"
          done
