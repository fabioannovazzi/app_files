name: Build product archive artifacts

on:
  workflow_call:

permissions:
  contents: read

# CI failures stay in retained test diagnostics, outside customer alerts.
env:
  MPARANZA_INCIDENT_DELIVERY: local-only

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce repository download headroom
        run: python scripts/check_repository_archive_size.py
      - name: Install declared build dependencies
        run: python -m pip install -r scripts/requirements-plugin-build.txt
      - name: Verify scoped build drift checks
        run: |
          python -m pip install pytest
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_product_build_drift.py
      - name: Build local product archives from this checkout
        run: python scripts/build_product_release.py vera lucia clara
      - name: Verify the shipped Vera review catalogue
        run: python -c "from tests.plugins.test_vera_packaged_review import test_codex_package_exposes_one_pipeline_editor_and_only_distinct_companion_tasks as verify; verify()"
      - name: Reject source drift and released-product artifact drift
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_product_build_drift.py --base "$RELEASE_BASE"
      - name: Retain install and upload archives for this workflow
        uses: actions/upload-artifact@v4
        with:
          name: product-archives
          path: |
            plugin_packages/*/*.zip
            plugin_packages/*/claude/**/*
            static/shared/*/downloads/*-cowork-plugin.zip
            static/shared/*/downloads/*-antigravity-plugin.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
