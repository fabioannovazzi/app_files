name: Product workflow UI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared workflow dependencies and checks
        run: >-
          python -m pip install pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit polars numpy beautifulsoup4
          -r plugins/client-file-preparation/requirements.txt
          -r plugins/comunicazione-professionale/requirements.txt
          -r plugins/report-builder/requirements.txt
      - name: Verify public persistence, source scope, complete paging and UI consent
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_vera_native_workspace.py tests/plugins/test_vera_native_practice_reviews.py tests/plugins/test_vera_native_practice_ui.py
          -k 'intake_focus or fiscal_correction or fiscal_successor or native_xml or native_notice or practice or format or event_edit or added_event or saved_calendar or viewer_can or no_host_message'
          --cov=native_intake_views --cov=native_fiscal_corrections --cov=native_practice_reviews --cov=fiscal_field_review
          --cov-report=term-missing --cov-fail-under=80 --junitxml=vera-focused-ui.xml
      - name: Check new helper quality and UI syntax
        run: |
          python -m black --check plugins/vera/scripts/native_intake_views.py plugins/vera/scripts/native_fiscal_corrections.py plugins/vera/scripts/native_practice_reviews.py plugins/client-file-preparation/scripts/fiscal_field_review.py tests/plugins/test_vera_native_practice_reviews.py tests/plugins/test_vera_native_practice_ui.py
          python -m isort --check-only plugins/vera/scripts/native_intake_views.py plugins/vera/scripts/native_fiscal_corrections.py plugins/vera/scripts/native_practice_reviews.py plugins/client-file-preparation/scripts/fiscal_field_review.py tests/plugins/test_vera_native_practice_reviews.py tests/plugins/test_vera_native_practice_ui.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/vera/scripts/native_intake_views.py plugins/vera/scripts/native_fiscal_corrections.py plugins/vera/scripts/native_practice_reviews.py plugins/client-file-preparation/scripts/fiscal_field_review.py
          python -m bandit -q -ll plugins/vera/scripts/native_intake_views.py plugins/vera/scripts/native_fiscal_corrections.py plugins/vera/scripts/native_practice_reviews.py plugins/client-file-preparation/scripts/fiscal_field_review.py
          node --check plugins/vera/ui/practice-reviews.js
          node --check plugins/vera/ui/management-results.js
          node --check plugins/vera/ui/workspace.js
          node --check plugins/vera/mcp/workspace.cjs
      - name: Verify browser editor retirement and native instruction projections
        run: |
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_vera_ui_retirement.py
          python -m black --check scripts/vera_ui_retirement.py tests/plugins/test_vera_ui_retirement.py
          python -m isort --check-only scripts/vera_ui_retirement.py tests/plugins/test_vera_ui_retirement.py
          python -m mypy --follow-imports=skip --ignore-missing-imports scripts/vera_ui_retirement.py
          python -m bandit -q -ll scripts/vera_ui_retirement.py
      - name: Verify Clara and Lucia native controls and retired inspectors
        run: |
          python -m pytest -q -o addopts='' --confcutdir=tests tests/plugins/test_product_native_app_protocol.py tests/plugins/test_lucia_playbook.py tests/plugins/test_lucia_matter_native.py tests/plugins/test_clara_budget_preview.py tests/plugins/test_lucia_review_engine_mcp.py tests/scripts/test_product_ui_retirement.py tests/scripts/test_install_local_vera.py --cov --cov-config=tests/product_native_ui.coveragerc --cov-report=term-missing --cov-fail-under=80 --junitxml=product-native-ui.xml
          python -m black --check plugins/lucia/scripts/method_mcp.py plugins/lucia/scripts/matter_mcp.py plugins/clara/scripts/report_mcp.py scripts/product_ui_retirement.py scripts/install_local_vera.py tests/plugins/test_product_native_app_protocol.py tests/plugins/test_lucia_matter_native.py tests/plugins/test_clara_budget_preview.py tests/plugins/test_lucia_review_engine_mcp.py tests/scripts/test_product_ui_retirement.py tests/scripts/test_install_local_vera.py
          python -m isort --check-only plugins/lucia/scripts/method_mcp.py plugins/lucia/scripts/matter_mcp.py plugins/clara/scripts/report_mcp.py scripts/product_ui_retirement.py scripts/install_local_vera.py tests/plugins/test_product_native_app_protocol.py tests/plugins/test_lucia_matter_native.py tests/plugins/test_clara_budget_preview.py tests/plugins/test_lucia_review_engine_mcp.py tests/scripts/test_product_ui_retirement.py tests/scripts/test_install_local_vera.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/lucia/scripts/method_mcp.py plugins/lucia/scripts/matter_mcp.py plugins/clara/scripts/report_mcp.py scripts/product_ui_retirement.py scripts/install_local_vera.py
          python -m bandit -q -ll plugins/lucia/scripts/method_mcp.py plugins/lucia/scripts/matter_mcp.py plugins/clara/scripts/report_mcp.py scripts/product_ui_retirement.py scripts/install_local_vera.py
          node --check plugins/lucia/scripts/method_mcp.cjs
          node --check plugins/lucia/scripts/matter_mcp.cjs
          node --check plugins/lucia/scripts/review_engine_mcp.cjs
          node --check plugins/clara/scripts/report_mcp.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vera-focused-ui-results
          path: |
            vera-focused-ui.xml
            product-native-ui.xml

  one-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest pytest-cov playwright reportlab beautifulsoup4 pypdf -r plugins/journal-bank-reconciliation/requirements.txt -r plugins/client-file-preparation/requirements.txt -r plugins/report-builder/requirements.txt -r plugins/registro-imprese-sari/requirements.txt -r plugins/previdenza-inps/requirements.txt -r plugins/management-control-pack/requirements.txt -r plugins/variance-analysis/requirements.txt
      - name: Install Chromium and verify available host capabilities
        shell: bash
        run: |
          python -m playwright install chromium
          python - <<'PY_BROWSER'
          import subprocess
          import sys
          from playwright.sync_api import Error, sync_playwright

          with sync_playwright() as playwright:
              try:
                  browser = playwright.chromium.launch()
              except Error:
                  subprocess.run(
                      [sys.executable, "-m", "playwright", "install-deps", "chromium"],
                      check=True,
                  )
                  browser = playwright.chromium.launch()
              browser.close()
          PY_BROWSER
      - name: Verify that exactly one review opens and only relevant controls are visible
        env:
          VERA_REVIEW_SCREENSHOTS: /tmp/vera-review-screenshots
        run: python -m pytest -q -o addopts='' --confcutdir=tests tests/plugins/test_vera_one_review.py tests/plugins/test_vera_review_browser.py tests/plugins/test_clara_report_browser.py tests/plugins/test_lucia_method_browser.py tests/plugins/test_lucia_matter_browser.py tests/plugins/test_vera_management_results_browser.py tests/plugins/test_native_review_final_affordances_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vera-review-screens
          path: /tmp/vera-review-screenshots
