name: Cowork acceptance verifier

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    name: Cowork evidence verifier regressions (no host certification)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared scan-fixture dependency and check tools
        run: python -m pip install -r plugins/client-file-preparation/requirements.txt pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit
      - name: Verify evidence gating with explicitly synthetic attestations
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_cowork_acceptance.py --cov=scripts.course_materials.cowork_acceptance --cov-report=term-missing --cov-fail-under=80
      - name: Check formatting, types and security
        run: |
          python -m black --check scripts/course_materials/cowork_acceptance.py tests/plugins/test_cowork_acceptance.py
          python -m isort --check-only scripts/course_materials/cowork_acceptance.py tests/plugins/test_cowork_acceptance.py
          python -m mypy --follow-imports=skip scripts/course_materials/cowork_acceptance.py
          python -m bandit -q scripts/course_materials/cowork_acceptance.py
