name: Browser download verification

on:
  pull_request:
    paths:
      - 'plugins/browser-automation/**'
      - 'plugins/vera/scripts/datev_starter.py'
      - 'plugins/vera/skills/datev-invoice-start/**'
      - 'tests/plugins/test_vera_datev_starter.py'
      - 'tests/datev_starter.coveragerc'
      - 'tests/test_browser*.mjs'
      - 'tests/fixtures/browser_agenzia_tab.mjs'
      - 'tests/test_browser_automation*.py'
      - 'tests/test_browser_batch_review.py'
      - 'tests/test_browser_development_request.py'
      - 'tests/test_browser_teaching_checkpoint.py'
      - 'tests/test_browser_process_lifecycle.py'
      - 'tests/fixtures/browser_process_tab.mjs'
      - 'plugins/vera/scripts/change_requests.py'
      - 'plugins/vera/skills/browser-automation/**'
      - 'modules/change_requests/api.py'
      - 'tests/modules/change_requests/**'
      - '.github/workflows/browser-download.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-files:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_browser_download_directory.mjs tests/test_browser_automation_runtime.mjs tests/test_browser_automation_discovery_runtime.mjs tests/test_browser_session.mjs tests/test_browser_agenzia_download.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-cov
      - run: python -m pytest --noconftest -q tests/test_browser_batch_review.py tests/test_browser_development_request.py tests/test_browser_teaching_checkpoint.py tests/test_browser_automation_pipeline.py tests/test_browser_automation_capabilities.py tests/test_browser_automation_installation.py -o addopts=""
      - name: Verify persisted development-to-use journey and report delivery (synthetic)
        run: python -m pytest --noconftest -q -o addopts='' tests/test_browser_process_lifecycle.py --cov=process_lifecycle --cov-fail-under=80
      - name: Check automatic ECONS review acquisition
        shell: bash
        run: ECONS_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')" node --test tests/test_browser_econs_review.mjs

  process-lifecycle-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install black==25.1.0 isort==6.0.1 mypy bandit
      - run: python -m black --check plugins/browser-automation/scripts/process_lifecycle.py plugins/browser-automation/scripts/development_request.py plugins/vera/scripts/change_requests.py modules/change_requests/api.py tests/test_browser_process_lifecycle.py tests/modules/change_requests/test_api.py tests/modules/change_requests/test_browser_lifecycle_api.py plugins/browser-automation/scripts/check_installation.py plugins/browser-automation/scripts/capability_pipeline.py
      - run: python -m isort --check-only plugins/browser-automation/scripts/process_lifecycle.py plugins/browser-automation/scripts/development_request.py plugins/vera/scripts/change_requests.py modules/change_requests/api.py tests/test_browser_process_lifecycle.py tests/modules/change_requests/test_api.py tests/modules/change_requests/test_browser_lifecycle_api.py plugins/browser-automation/scripts/check_installation.py plugins/browser-automation/scripts/capability_pipeline.py
      - run: python -m mypy --config-file=tests/plugin_runtime.mypy.ini plugins/browser-automation/scripts/process_lifecycle.py plugins/browser-automation/scripts/development_request.py plugins/vera/scripts/change_requests.py modules/change_requests/api.py
      - run: python -m bandit -q plugins/browser-automation/scripts/process_lifecycle.py plugins/browser-automation/scripts/development_request.py plugins/vera/scripts/change_requests.py modules/change_requests/api.py -ll

  process-feedback-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the API's declared dependencies and test tools
        run: python -m pip install pytest httpx 'fastapi>=0.115,<0.116' 'psycopg[binary]>=3.2,<4' jinja2 python-multipart cryptography
      - name: Verify partial intake, real CR receipts, retries and status recovery
        run: python -m pytest --noconftest -q -o addopts='' tests/modules/change_requests/test_api.py tests/modules/change_requests/test_store.py tests/modules/change_requests/test_browser_lifecycle_api.py tests/plugins/test_plugin_change_requests.py -k 'not full_app'

  native-datev-starter:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit
      - name: Verify native starter persistence and partial capability handoff (synthetic, no DATEV)
        run: python -m pytest --noconftest -q -o addopts='' tests/plugins/test_vera_datev_starter.py --cov --cov-config=tests/datev_starter.coveragerc
      - run: python -m black --check plugins/vera/scripts/datev_starter.py tests/plugins/test_vera_datev_starter.py
      - run: python -m isort --check-only plugins/vera/scripts/datev_starter.py tests/plugins/test_vera_datev_starter.py
      - run: python -m mypy --follow-imports=skip plugins/vera/scripts/datev_starter.py
      - run: python -m bandit -q plugins/vera/scripts/datev_starter.py
