name: Vera document personalization

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved-document-style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit
      - name: Verify independent profiles and managed case review
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_vera_document_style.py
          --cov --cov-config=tests/document_style.coveragerc
      - run: python -m black --check plugins/vera/scripts/document_style.py tests/plugins/test_vera_document_style.py
      - run: python -m isort --check-only plugins/vera/scripts/document_style.py tests/plugins/test_vera_document_style.py
      - run: python -m mypy --follow-imports=skip plugins/vera/scripts/document_style.py
      - run: python -m bandit -q plugins/vera/scripts/document_style.py
