name: Automatic Archive reporting
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reporting:
    name: Archive reports and machine-bound proofs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest pytest-cov jsonschema pyyaml pypdf openpyxl python-docx fastapi httpx jinja2 pydantic psycopg[binary] python-dotenv beautifulsoup4 requests json-repair cryptography black==25.1.0 isort==6.0.1 mypy bandit
      - name: Verify automatic lifecycle, actual observations, retries and authenticated proofs
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_archive_automatic_reporting.py
          tests/plugins/test_vera_selective_reporting.py
          tests/modules/run_receipts
          --cov=archive_reporting --cov=archive_report_store --cov=archive_report_hook
          --cov=archive_report_transcript --cov=archive_report_measurements
          --cov=archive_report_receipt --cov=archive_report_seal
          --cov-report=term-missing --cov-fail-under=80
      - name: Check source quality
        shell: bash
        run: |
          python -m black --check plugins/_shared/reporting-runtime/archive_report*.py tests/plugins/test_archive_automatic_reporting.py tests/modules/run_receipts/test_archive_binding.py
          python -m isort --check-only plugins/_shared/reporting-runtime/archive_report*.py tests/plugins/test_archive_automatic_reporting.py tests/modules/run_receipts/test_archive_binding.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/_shared/reporting-runtime/archive_report*.py
          python -m bandit -q -ll plugins/_shared/reporting-runtime/archive_report*.py
      - run: python scripts/sync_reporting_runtime.py --check
