name: Automatic Archive reporting
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reporting:
    name: Archive reports and machine-bound proofs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows lifecycle coverage takes fourteen minutes before native emissions.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest pytest-cov jsonschema pyyaml pypdf openpyxl python-docx fastapi httpx jinja2 pydantic psycopg[binary] python-dotenv beautifulsoup4 requests json-repair cryptography defusedxml black==25.1.0 isort==6.0.1 mypy bandit -r plugins/report-builder/requirements.txt -r plugins/journal-bank-reconciliation/requirements.txt -r plugins/browser-automation/requirements-agenzia.txt
      - name: Verify automatic lifecycle, Vera sends, retries and authenticated proofs
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_archive_automatic_reporting.py
          tests/plugins/test_archive_reporting_recovery.py
          tests/plugins/test_archive_finalization_boundaries.py
          tests/plugins/test_portable_workflow_diagnostics.py
          tests/plugins/test_archive_emission_boundaries.py
          tests/plugins/test_archive_cli_delivery.py
          tests/plugins/test_archive_agenzia_delivery.py
          tests/plugins/test_native_execution_reporting.py
          tests/plugins/test_archive_report_builder_projection.py
          tests/plugins/test_archive_report_builder_execution.py
          tests/plugins/test_archive_journal_bank_projection.py
          tests/plugins/test_archive_output_boundaries.py
          tests/plugins/test_vera_selective_reporting.py
          tests/modules/run_receipts
          --cov=archive_reporting --cov=archive_reporting_failure --cov=archive_report_store --cov=archive_emit
          --cov=archive_cli --cov=archive_projection --cov=archive_report_measurements
          --cov=archive_report_receipt --cov=archive_report_seal
          --cov=archive_error_reporting
          --cov-report=term-missing --cov-fail-under=80
      - name: Verify native producer selections with component import isolation
        run: >-
          python -m pytest -q -o addopts=''
          tests/plugins/test_archive_native_emissions.py
      - name: Check source quality
        shell: bash
        run: |
          python -m black --check plugins/_shared/reporting-runtime/archive_*.py tests/plugins/test_archive_automatic_reporting.py tests/plugins/test_archive_reporting_recovery.py tests/plugins/test_archive_journal_bank_projection.py tests/modules/run_receipts/test_archive_binding.py
          python -m isort --check-only plugins/_shared/reporting-runtime/archive_*.py tests/plugins/test_archive_automatic_reporting.py tests/plugins/test_archive_reporting_recovery.py tests/plugins/test_archive_journal_bank_projection.py tests/modules/run_receipts/test_archive_binding.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/_shared/reporting-runtime/archive_*.py
          python -m bandit -q -ll plugins/_shared/reporting-runtime/archive_*.py
          python -m black --check plugins/studio-archive/scripts/archive_error_reporting.py tests/plugins/test_archive_finalization_boundaries.py
          python -m isort --check-only plugins/studio-archive/scripts/archive_error_reporting.py tests/plugins/test_archive_finalization_boundaries.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/studio-archive/scripts/archive_error_reporting.py
          python -m bandit -q -ll plugins/studio-archive/scripts/archive_error_reporting.py
          python -m black --check plugins/_shared/reporting-runtime/diagnostic_context.py tests/plugins/test_portable_workflow_diagnostics.py
          python -m isort --check-only plugins/_shared/reporting-runtime/diagnostic_context.py tests/plugins/test_portable_workflow_diagnostics.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/_shared/reporting-runtime/diagnostic_context.py
          python -m bandit -q -ll plugins/_shared/reporting-runtime/diagnostic_context.py
          python -m black --check plugins/vera/scripts/native_execution.py tests/plugins/test_native_execution_reporting.py
          python -m isort --check-only plugins/vera/scripts/native_execution.py tests/plugins/test_native_execution_reporting.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/vera/scripts/native_execution.py
          python -m bandit -q -ll plugins/vera/scripts/native_execution.py
      - run: python scripts/sync_reporting_runtime.py --check
  producer-sends:
    name: Actual Vera producer sends (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest jsonschema pyyaml pypdf reportlab defusedxml beautifulsoup4 -r plugins/variance-analysis/requirements.txt -r plugins/journal-bank-reconciliation/requirements.txt -r plugins/report-builder/requirements.txt -r plugins/client-file-preparation/requirements.txt
      - name: Verify actual native selections and targeted source columns
        run: >-
          python -m pytest -q -o addopts=''
          tests/plugins/test_archive_native_emissions.py
          tests/plugins/test_archive_variance_projection.py
          tests/plugins/test_archive_remaining_producers.py
