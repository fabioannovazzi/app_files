name: Fusione P0 and P1 workpapers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit
      - name: Verify case revisions, access scopes, approvals and change review
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_fusione_guidata.py tests/plugins/test_fusione_p1.py
          --cov=plugins/fusione-guidata/scripts --cov-report=term-missing
          --cov-fail-under=80
      - name: Check foundation code quality
        shell: bash
        run: |
          python plugins/fusione-guidata/scripts/check_dependencies.py
          python -m black --check plugins/fusione-guidata/scripts tests/plugins/test_fusione_guidata.py tests/plugins/test_fusione_p1.py
          python -m isort --check-only plugins/fusione-guidata/scripts tests/plugins/test_fusione_guidata.py tests/plugins/test_fusione_p1.py
          python -m mypy plugins/fusione-guidata/scripts
          python -m bandit -q -r plugins/fusione-guidata/scripts
