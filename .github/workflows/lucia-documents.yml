name: Lucia local document workflows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal-documents:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-cov jsonschema lxml pypdf python-docx openpyxl black==25.1.0 isort==6.0.1 mypy bandit
      - name: Test local evidence, comparisons and template copies with network disabled
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_lucia_legal_documents.py
          --cov=lucia_legal_documents --cov-report=term-missing --cov-fail-under=80
      - name: Check document helper quality
        run: |
          python -m black --check plugins/lucia/scripts/legal_documents.py tests/plugins/test_lucia_legal_documents.py
          python -m isort --check-only plugins/lucia/scripts/legal_documents.py tests/plugins/test_lucia_legal_documents.py
          python -m mypy --follow-imports=skip plugins/lucia/scripts/legal_documents.py
          python -m bandit -q plugins/lucia/scripts/legal_documents.py
