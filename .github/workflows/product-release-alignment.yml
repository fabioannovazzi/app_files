name: Product release alignment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-archives:
    uses: ./.github/workflows/build-product-archives.yml

  alignment:
    needs: product-archives
    name: Codex and Cowork release alignment
    runs-on: ubuntu-latest
    # Finished archives now execute all six isolated Vera CLIs on each host build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download product archives built from this commit
        uses: actions/download-artifact@v4
        with:
          name: product-archives
          path: plugin_packages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install plugin build dependencies
        run: python -m pip install -r scripts/requirements-plugin-build.txt
      - run: python -m pip install pytest pytest-cov beautifulsoup4 pyyaml black==25.1.0 isort==6.0.1 mypy bandit uv==0.12.10
      - name: Reject shared recipe changes without a policy revision upgrade
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check_shared_runtime_revision.py --base-ref "$BASE_REF"
          else
            python scripts/check_shared_runtime_revision.py
          fi
      - name: Test shared runtime release revision guard
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_shared_runtime_revision.py
      - name: Verify shared dependency lock exports
        run: python scripts/lock_shared_runtime.py --check
      - name: Verify website ZIP version labels
        run: node --test tests/test_plugin_download_versions.mjs
      - name: Verify stale-package rejection
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_product_release_alignment.py --cov --cov-config=tests/product_release.coveragerc
      - name: Verify repository download limit and archive prerequisites
        run: python -m pytest --noconftest -q -o addopts='' tests/scripts/test_repository_archive_size.py tests/scripts/test_product_archive_prerequisites.py --cov=scripts.check_repository_archive_size --cov-report=term-missing --cov-fail-under=80
      - name: Check archive guard and release code quality
        run: |
          python -m black --check scripts/check_repository_archive_size.py scripts/build_product_release.py scripts/check_shared_runtime_cold_start.py tests/scripts/test_repository_archive_size.py tests/scripts/test_product_archive_prerequisites.py tests/plugins/test_product_release_alignment.py
          python -m isort --check-only scripts/check_repository_archive_size.py scripts/build_product_release.py scripts/check_shared_runtime_cold_start.py tests/scripts/test_repository_archive_size.py tests/scripts/test_product_archive_prerequisites.py tests/plugins/test_product_release_alignment.py
          python -m mypy --follow-imports=skip --ignore-missing-imports scripts/check_repository_archive_size.py scripts/build_product_release.py
          python -m bandit -q -ll scripts/check_repository_archive_size.py scripts/build_product_release.py scripts/check_shared_runtime_cold_start.py
      - name: Verify stale and duplicate installed-plugin rejection
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_installed_product.py
      - name: Verify Antigravity download integrity checks
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_antigravity_package.py
      - name: Validate every source skill before release
        run: python scripts/validate_plugin_skills.py
      - name: Test metadata rejection across every product and host
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_plugin_skill_metadata.py --cov=scripts.validate_plugin_skills --cov-report=term-missing --cov-fail-under=80
      - name: Check finished-package verification code quality
        run: |
          python -m black --check scripts/verify_vera_package.py scripts/validate_plugin_skills.py tests/plugins/test_vera_package_release_gate.py tests/plugins/test_plugin_skill_metadata.py
          python -m isort --check-only scripts/verify_vera_package.py scripts/validate_plugin_skills.py tests/plugins/test_vera_package_release_gate.py tests/plugins/test_plugin_skill_metadata.py
          python -m mypy --follow-imports=skip --ignore-missing-imports scripts/verify_vera_package.py scripts/validate_plugin_skills.py
          python -m bandit -q -ll scripts/verify_vera_package.py scripts/validate_plugin_skills.py
      - name: Reject final Vera archive edits with the installed verifier
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_vera_package_release_gate.py --cov=scripts.verify_vera_package --cov-report=term-missing --cov-fail-under=80
      - name: Verify all product packages against canonical source and version
        run: python scripts/build_product_release.py --check
      - name: Verify attachment intake in the ChatGPT and Cowork packages
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_packaged_archive_source_access.py
      - name: Verify reporting references in every installed product and host layout
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_reporting_reference_paths.py
      - name: Verify HTTPS reporting replaces remote MCP in every distribution
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_product_https_reporting.py
      - name: Verify the recorded Vera catalogue matches the release
        run: python .agents/skills/localize-vera/scripts/catalogue.py check --root plugins/vera --inventory plugins/vera/skills/vera/references/localization/geneva/catalogue.json --assessment plugins/vera/skills/vera/references/localization/geneva/assessment.json
      - name: Verify optional studio knowledge instruction packaging
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_vera_connected_knowledge.py
      - name: Verify optional connector download and host setup guides
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_optional_connector_downloads.py
      - name: Verify renamed skill identities in every host package
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_skill_name_alignment.py tests/plugins/test_claude_skill_names.py tests/plugins/test_cowork_skill_namespace.py --cov=scripts.cowork_skill_names --cov-fail-under=80
