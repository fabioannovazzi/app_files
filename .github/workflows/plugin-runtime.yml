        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_single_shared_runtime.py
          tests/plugins/test_shared_runtime_launchers.py
          tests/plugins/test_python_bootstrap.py

  managed-runtime-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov mypy bandit
      - name: Verify generated Vera workflow metadata
        run: python scripts/build_vera_workflow_registry.py --check
      - name: Exercise installation, concurrency and failure recovery
        run: python -m pytest --confcutdir=tests/plugins tests/plugins/test_managed_plugin_python_runtime.py tests/plugins/test_single_shared_runtime.py tests/plugins/test_shared_runtime_launchers.py tests/plugins/test_python_bootstrap.py --cov --cov-config=tests/plugin_runtime.coveragerc --cov-report=term-missing
      - name: Check changed plugin kernels without the application's error suppression
        run: python -m mypy --config-file=tests/plugin_runtime.mypy.ini
      - name: Reject medium and high severity findings in changed plugin kernels
        run: |
          python - <<'PY'
          import configparser
          import subprocess
          import sys
          config = configparser.ConfigParser()
          config.read("tests/plugin_runtime.mypy.ini")
          paths = [path.strip() for path in config["mypy"]["files"].split(",") if path.strip()]
          subprocess.run([sys.executable, "-m", "bandit", *paths, "-ll"], check=True)
          PY

  vera-packaged-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest
      - name: Exercise clean ZIPs and reject broken releases
        # These stdlib/Node checks do not need the application-wide fixtures.
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_packaged_mcp_startup.py
      - name: Verify cache tolerance without weakening source or link checks
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_vera_implementation_bytecode.py -k mcp
      - name: Enforce Cowork manifest description limits
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_claude_plugin_packages.py -k "description or projected_cowork_skills_remove"
      - name: Verify distributed Cowork artifacts and runtime
        run: python scripts/build_claude_plugin_zip.py vera --check
      - name: Verify Lucia's shared archive privacy binding
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_lucia_plugin.py -k native_matter_opening_privacy_boundary
      - name: Keep canonical package names and tolerate installer generations
        run: |
          python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_managed_plugin_python_runtime.py -k "cowork_sync_generation or cowork_manifest_unsafe"
          python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_claude_plugin_packages.py -k "distribution_keeps_canonical or canonical_version_despite"

  vera-cowork-python:
    runs-on: ubuntu-latest
    # Fresh managed environments and 24 install/render cases exceed 15 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Check all repaired source and packaged Python version gates
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_vera_python_version_gates.py
      - name: Provision a fresh runtime from the distributed Cowork ZIP
        env:
          RUN_COWORK_PYTHON_INTEGRATION: "1"
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_cowork_python_runtime.py
      - name: Check waterfall fallback with supporting marker traces
        run: |
          python -m pip install plotly pillow polars
          python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_waterfall_fallback.py tests/plugins/test_chart_date_parsing.py
      - name: Check waterfall ordering independently of contribution labels
        run: |
          python -m pip install -r plugins/variance-analysis/requirements.txt
          python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_variance_analysis_plugin.py -k keep_changes
      - name: Check passive invoice native and Cowork handoff contracts
        run: |
          python -m pip install pytest-cov -r plugins/passive-invoice-audit/requirements.txt
          python -m pytest -q --confcutdir=plugins/passive-invoice-audit/tests plugins/passive-invoice-audit/tests/test_passive_invoice_audit.py --cov=plugins/passive-invoice-audit/scripts --cov-fail-under=80

