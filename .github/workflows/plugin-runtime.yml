  managed-runtime-quality:
    needs: product-archives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download product archives built from this commit
        uses: actions/download-artifact@v4
        with:
          name: product-archives
          path: plugin_packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov mypy bandit
      - name: Verify generated Vera workflow metadata
        run: python scripts/build_vera_workflow_registry.py --check
      - name: Exercise installation, concurrency and failure recovery
        run: python -m pytest --confcutdir=tests/plugins tests/plugins/test_managed_plugin_python_runtime.py tests/plugins/test_vera_dependency_reentry.py tests/plugins/test_single_shared_runtime.py tests/plugins/test_shared_runtime_launchers.py tests/plugins/test_locked_shared_runtime.py tests/plugins/test_python_bootstrap.py tests/plugins/test_vera_verified_execution.py tests/plugins/test_vera_execution_package_index.py tests/plugins/test_live_plugin_runtime.py --cov --cov-config=tests/plugin_runtime.coveragerc --cov-report=term-missing
      - name: Check Cowork archive session coverage
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_cowork_archive_session.py --cov --cov-config=tests/cowork_archive_session.coveragerc --cov-report=term-missing
      - name: Check changed plugin kernels without the application's error suppression
        run: python -m mypy --config-file=tests/plugin_runtime.mypy.ini
      - name: Reject medium and high severity findings in changed plugin kernels
        run: |
          python - <<'PY'
          import configparser
          import subprocess
          import sys
          config = configparser.ConfigParser()
          config.read("tests/plugin_runtime.mypy.ini")
          paths = [path.strip() for path in config["mypy"]["files"].split(",") if path.strip()]
          subprocess.run([sys.executable, "-m", "bandit", *paths, "-ll"], check=True)
          PY

  vera-packaged-mcp:
    needs: product-archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download product archives built from this commit
        uses: actions/download-artifact@v4
        with:
          name: product-archives
          path: plugin_packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The packaged open-item bootstrap also loads its workpaper helper.
      # Install that component's declared dependencies in the clean CI environment.
      - name: Install plugin build dependencies
        run: python -m pip install -r scripts/requirements-plugin-build.txt
      - run: python -m pip install pytest -r plugins/open-item-reconciliation/requirements.txt
      - name: Exercise clean ZIPs and reject broken releases
        # These stdlib/Node checks do not need the application-wide fixtures.
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_packaged_mcp_startup.py
      - name: Preserve source MCP capabilities in downloads and upload ZIPs
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_product_download_capabilities.py
      - name: Verify cache tolerance without weakening source or link checks
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_vera_implementation_bytecode.py -k "mcp or read_only or packaged_repair or actual_link_count"
      - name: Reconcile dated case 1 through reinstall, upgrade and review reconnect
        run: python tests/plugins/live_update_dated_case.py plugin_packages/vera/vera-plugin.zip .runtime-acceptance/dated-case-1
      - name: Enforce Cowork manifest description limits
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_claude_plugin_packages.py -k "description or projected_cowork_skills_remove"
      - name: Reject dangling Cowork workflow references
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_claude_plugin_packages.py -k "cowork_skill_removes_openai_blocks or cowork_registry or cowork_package_has_no_dangling or cowork_build_rejects_unremoved"
      - name: Verify audited instruction and catalogue boundaries
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_claude_plugin_packages.py -k audit_instructions
      - name: Verify distributed Cowork artifacts and runtime
        run: python scripts/build_claude_plugin_zip.py vera --check
      - name: Verify Lucia's shared archive privacy binding
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_lucia_plugin.py -k native_matter_opening_privacy_boundary
      - name: Keep canonical package names and tolerate installer generations
        run: |
          python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_managed_plugin_python_runtime.py -k "cowork_sync_generation or cowork_manifest_unsafe"
          python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_claude_plugin_packages.py -k "distribution_keeps_canonical or canonical_version_despite"

