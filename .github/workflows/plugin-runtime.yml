name: Packaged plugin runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoice-xml:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit -r plugins/invoice-xml/requirements.txt
      - name: Verify invoice preparation, approval and XML export
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=plugins/invoice-xml/tests
          plugins/invoice-xml/tests --cov=plugins/invoice-xml/scripts
          --cov-report=term-missing --cov-fail-under=80
      - name: Check invoice code quality
        run: |
          python -m black --check plugins/invoice-xml
          python -m isort --check-only plugins/invoice-xml
          python -m mypy --config-file plugins/invoice-xml/mypy.ini plugins/invoice-xml/scripts
          python -m bandit -q -r plugins/invoice-xml/scripts

  vera-local-onboarding:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit
      - name: Verify local profiles, native lesson handoffs and transmission suppression
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_vera_local_onboarding.py tests/plugins/test_vera_teaching.py
          tests/plugins/test_studio_archive_file_identity.py
          tests/plugins/test_vera_model_data_report.py
          tests/plugins/test_plugin_update_notifications.py
          --cov=local_teaching --cov=local_onboarding --cov=local_onboarding_case
          --cov=onboarding_session_start --cov-fail-under=80
      - name: Verify Clara and Lucia local teaching, isolation and native handoffs
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_desktop_teaching.py tests/plugins/test_desktop_teaching_packages.py
          tests/plugins/test_teaching_product_scope.py tests/plugins/test_optional_onboarding.py
          --cov=desktop_teaching --cov-fail-under=80
      - name: Check shared teaching code quality
        run: |
          python -m black --check plugins/_shared/vendor/modules/desktop_teaching tests/plugins/test_desktop_teaching.py tests/plugins/test_teaching_product_scope.py
          python -m isort --check-only plugins/_shared/vendor/modules/desktop_teaching tests/plugins/test_desktop_teaching.py tests/plugins/test_teaching_product_scope.py
          python -m mypy --follow-imports=skip plugins/_shared/vendor/modules/desktop_teaching/onboarding.py plugins/_shared/vendor/modules/desktop_teaching/teaching.py plugins/_shared/vendor/modules/desktop_teaching/cases.py
          python -m bandit -qr plugins/_shared/vendor/modules/desktop_teaching
      - name: Verify all prepared course languages and native packages
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_prepared_courses.py tests/plugins/test_prepared_course_packages.py
          --cov=plugins/_shared/vendor/modules/courseware --cov-fail-under=80
      - name: Check course runtime and compiler
        run: |
          python scripts/course_materials/build_catalog.py --check
          python -m black --check plugins/_shared/vendor/modules/courseware scripts/course_materials/build_catalog.py tests/plugins/test_prepared_courses.py tests/plugins/test_prepared_course_packages.py
          python -m isort --check-only plugins/_shared/vendor/modules/courseware scripts/course_materials/build_catalog.py tests/plugins/test_prepared_courses.py tests/plugins/test_prepared_course_packages.py
          python -m mypy --follow-imports=skip plugins/_shared/vendor/modules/courseware/library.py scripts/course_materials/build_catalog.py
          python -m bandit -qr plugins/_shared/vendor/modules/courseware scripts/course_materials/build_catalog.py
      - name: Check onboarding code quality
        run: |
          python -m black --check plugins/vera/scripts/local_onboarding.py plugins/vera/scripts/local_onboarding_case.py plugins/vera/scripts/onboarding_session_start.py plugins/vera/scripts/local_teaching.py tests/plugins/test_vera_local_onboarding.py tests/plugins/test_vera_teaching.py
          python -m isort --check-only plugins/vera/scripts/local_onboarding.py plugins/vera/scripts/local_onboarding_case.py plugins/vera/scripts/onboarding_session_start.py plugins/vera/scripts/local_teaching.py tests/plugins/test_vera_local_onboarding.py tests/plugins/test_vera_teaching.py
          python -m mypy --follow-imports=skip plugins/vera/scripts/local_onboarding.py plugins/vera/scripts/local_onboarding_case.py plugins/vera/scripts/onboarding_session_start.py plugins/vera/scripts/local_teaching.py
          python -m bandit -q plugins/vera/scripts/local_onboarding.py plugins/vera/scripts/local_onboarding_case.py plugins/vera/scripts/onboarding_session_start.py plugins/vera/scripts/local_teaching.py

  adversarial-opinion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest pytest-cov beautifulsoup4 pypdf python-docx black==25.1.0 isort==6.0.1 mypy bandit
      - name: Verify separately reviewed opinions and completed-case integrity
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_vera_adversarial_opinion.py
          tests/plugins/test_vera_validated_answer_pipeline.py
          tests/plugins/test_prompt_optimizer_plugin.py
          tests/plugins/test_vera_router_contract.py
          tests/plugins/test_vera_website_journeys.py
          --cov --cov-config=tests/plugin_adversarial.coveragerc
      - name: Check formatting, typing and security
        run: |
          python -m black --check plugins/deep-research-validator/scripts/adversarial_opinion.py tests/plugins/test_vera_adversarial_opinion.py
          python -m isort --check-only plugins/deep-research-validator/scripts/adversarial_opinion.py tests/plugins/test_vera_adversarial_opinion.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/deep-research-validator/scripts/adversarial_opinion.py
          python -m bandit -q plugins/deep-research-validator/scripts/adversarial_opinion.py
          node --check static/shared/product-function-pages.js

  business-planning-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared planning and validation dependencies
        run: python -m pip install pytest pytest-cov 'coverage>=7.10' black==25.1.0 isort==6.0.1 mypy bandit -r plugins/business-planning/requirements.txt
      - name: Exercise planning revisions, financing and registered entry points
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_business_planning.py
          tests/plugins/test_business_planning_shared.py
          tests/plugins/test_business_planning_decision.py
          tests/plugins/test_business_planning_presentation.py
          tests/plugins/test_business_planning_sites.py
          tests/plugins/test_business_planning_loop.py
          --cov --cov-config=tests/plugin_business_planning.coveragerc
      - name: Check planning code quality
        run: |
          python -m black --check plugins/business-planning/scripts tests/plugins/test_business_planning_loop.py
          python -m isort --check-only plugins/business-planning/scripts tests/plugins/test_business_planning_loop.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/business-planning/scripts/planning_cycle.py plugins/business-planning/scripts/planning_financing.py plugins/business-planning/scripts/planning_decision_report.py plugins/business-planning/scripts/planning_interaction.py plugins/business-planning/scripts/planning_site.py
          python -m bandit -r plugins/business-planning/scripts -ll

  adeguati-assetti-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Shared test modules import the repository's HTML and PDF readers.
      - run: python -m pip install pytest pytest-cov beautifulsoup4 pypdf black==25.1.0 isort==6.0.1 mypy bandit
      - name: Verify review records, evidence, decisions and real archive bindings
        run: python -m pytest -q tests/plugins/test_adeguati_assetti.py tests/plugins/test_adeguati_assetti_packages.py --cov=plugins/adeguati-assetti/scripts --cov-fail-under=80
      - name: Require lifecycle classification for every registered CLI
        run: python -m pytest -q tests/plugins/test_vera_client_workflow_filesystem.py -k 'client_workflow_entrypoints_cover_registered_vera_workflows or every_workflow_python_cli_has_exactly_one_lifecycle_classification'
      - name: Verify public workflow names, jurisdiction and links
        run: python -m pytest -q tests/plugins/test_vera_website_journeys.py -k 'hub_keeps_market_specific_work_locale_scoped or italian_directory_matches_marketplace_capability_names or hub_module_fragments_resolve_to_real_page_sections'
      - name: Check formatting, typing and security
        run: |
          python -m black --check plugins/adeguati-assetti/scripts tests/plugins/test_adeguati_assetti.py
          python -m isort --check-only plugins/adeguati-assetti/scripts tests/plugins/test_adeguati_assetti.py
          python -m mypy --config-file=tests/plugin_runtime.mypy.ini plugins/adeguati-assetti/scripts
          python -m bandit -r plugins/adeguati-assetti/scripts -ll

  input-and-source-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install declared workflow dependencies and test tools
        run: >-
          python -m pip install pytest pytest-cov python-docx "reportlab>=4.2.0"
          -r plugins/client-file-preparation/requirements.txt
          -r plugins/apertura-pratica/requirements.txt
          -r plugins/journal-bank-reconciliation/requirements.txt
          -r plugins/passive-invoice-audit/requirements.txt
          -r plugins/management-control-pack/requirements.txt
          -r plugins/deep-research-validator/requirements.txt
      - name: Exercise numeric inputs, XML identity and source extraction
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          plugins/client-file-preparation/tests/test_client_file_preparation.py
          plugins/passive-invoice-audit/tests/test_passive_invoice_audit.py
          tests/plugins/test_deep_research_validator_plugin.py
          tests/plugins/test_management_control_pack.py
          tests/plugins/test_desktop_teaching_workflows.py
          --cov --cov-config=tests/plugin_correctness.coveragerc
          --cov-report=term-missing

  sales-plan-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest pytest-cov -r plugins/sales-plan/requirements.txt
      - name: Verify Plan arithmetic, missing values, assumptions and MCP contract
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_vera_sales_plan_preparation.py
          --cov --cov-config=tests/plugin_sales_plan.coveragerc
          --cov-report=term-missing

  shared-runtime-launchers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Verify shared interpreter identity and all product launchers
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_single_shared_runtime.py
          tests/plugins/test_shared_runtime_launchers.py
          tests/plugins/test_python_bootstrap.py

  managed-runtime-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov mypy bandit
      - name: Verify generated Vera workflow metadata
        run: python scripts/build_vera_workflow_registry.py --check
      - name: Exercise installation, concurrency and failure recovery
        run: python -m pytest --confcutdir=tests/plugins tests/plugins/test_managed_plugin_python_runtime.py tests/plugins/test_single_shared_runtime.py tests/plugins/test_shared_runtime_launchers.py tests/plugins/test_python_bootstrap.py --cov --cov-config=tests/plugin_runtime.coveragerc --cov-report=term-missing
      - name: Check changed plugin kernels without the application's error suppression
        run: python -m mypy --config-file=tests/plugin_runtime.mypy.ini
      - name: Reject medium and high severity findings in changed plugin kernels
        run: |
          python - <<'PY'
          import configparser
          import subprocess
          import sys
          config = configparser.ConfigParser()
          config.read("tests/plugin_runtime.mypy.ini")
          paths = [path.strip() for path in config["mypy"]["files"].split(",") if path.strip()]
          subprocess.run([sys.executable, "-m", "bandit", *paths, "-ll"], check=True)
          PY

  vera-packaged-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest
      - name: Exercise clean ZIPs and reject broken releases
        # These stdlib/Node checks do not need the application-wide fixtures.
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_packaged_mcp_startup.py
      - name: Verify cache tolerance without weakening source or link checks
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_vera_implementation_bytecode.py -k mcp
      - name: Enforce Cowork manifest description limits
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_claude_plugin_packages.py -k "description or projected_cowork_skills_remove"
      - name: Verify distributed Cowork artifacts and runtime
        run: python scripts/build_claude_plugin_zip.py vera --check
      - name: Verify Lucia's shared archive privacy binding
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_lucia_plugin.py -k native_matter_opening_privacy_boundary
      - name: Keep canonical package names and tolerate installer generations
        run: |
          python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_managed_plugin_python_runtime.py -k "cowork_sync_generation or cowork_manifest_unsafe"
          python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_claude_plugin_packages.py -k "distribution_keeps_canonical or canonical_version_despite"

  vera-cowork-python:
    runs-on: ubuntu-latest
    # Fresh managed environments and 24 install/render cases exceed 15 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Check all repaired source and packaged Python version gates
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_vera_python_version_gates.py
      - name: Provision a fresh runtime from the distributed Cowork ZIP
        env:
          RUN_COWORK_PYTHON_INTEGRATION: "1"
        run: python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_cowork_python_runtime.py
      - name: Check waterfall fallback with supporting marker traces
        run: |
          python -m pip install plotly pillow polars
          python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_waterfall_fallback.py tests/plugins/test_chart_date_parsing.py
      - name: Check waterfall ordering independently of contribution labels
        run: |
          python -m pip install -r plugins/variance-analysis/requirements.txt
          python -m pytest -q --confcutdir=tests/plugins tests/plugins/test_variance_analysis_plugin.py -k keep_changes
      - name: Check passive invoice native and Cowork handoff contracts
        run: |
          python -m pip install pytest-cov -r plugins/passive-invoice-audit/requirements.txt
          python -m pytest -q --confcutdir=plugins/passive-invoice-audit/tests plugins/passive-invoice-audit/tests/test_passive_invoice_audit.py --cov=plugins/passive-invoice-audit/scripts --cov-fail-under=80

  bandi-source-first:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit -r plugins/bandi-agevolazioni/requirements.txt
      - name: Verify Bandi source coverage and shared runtime instructions
        run: >-
          python -m pytest -q --confcutdir=tests/plugins
          tests/plugins/test_bandi_institutional_discovery.py
          tests/plugins/test_bandi_opportunity_radar.py
          tests/plugins/test_bandi_agevolazioni_plugin.py
          --cov=plugins/bandi-agevolazioni/scripts --cov-report=term-missing
          --cov-fail-under=80
      - name: Check Bandi code quality
        run: |
          python -m black --check plugins/bandi-agevolazioni/scripts/opportunity_radar.py tests/plugins/test_bandi_institutional_discovery.py
          python -m isort --check-only plugins/bandi-agevolazioni/scripts/opportunity_radar.py tests/plugins/test_bandi_institutional_discovery.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/bandi-agevolazioni/scripts/opportunity_radar.py
          python -m bandit -q plugins/bandi-agevolazioni/scripts/opportunity_radar.py

  treasury-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit -r plugins/treasury-forecast/requirements.txt
      - name: Verify successive forecasts, archive intake and saved review
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_treasury_forecast.py tests/plugins/test_treasury_delivery.py
          --cov=plugins/treasury-forecast/scripts --cov-report=term-missing --cov-fail-under=80
      - name: Check treasury code quality
        run: |
          python -m black --check plugins/treasury-forecast/scripts tests/plugins/test_treasury_forecast.py tests/plugins/test_treasury_delivery.py
          python -m isort --check-only plugins/treasury-forecast/scripts tests/plugins/test_treasury_forecast.py tests/plugins/test_treasury_delivery.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/treasury-forecast/scripts
          python -m bandit -q -r plugins/treasury-forecast/scripts
