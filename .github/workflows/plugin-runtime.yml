name: Packaged plugin runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-archives:
    uses: ./.github/workflows/build-product-archives.yml

  helper-environments:
    needs: product-archives
    name: Local helper environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Download product archives built from this commit
        uses: actions/download-artifact@v4
        with:
          name: product-archives
          path: plugin_packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest pytest-cov pyyaml
      - run: python -m pytest -q -o addopts='' --confcutdir=tests/scripts tests/scripts/test_local_helper_environment.py tests/scripts/test_claude_reviewer_note.py --cov=scripts.local_helper_environment --cov-report=term-missing --cov-fail-under=80
      - name: Verify teaching CI stays separate from release checks
        run: python -m pytest --noconftest -q -o addopts='' tests/scripts/test_teaching_ci_scope.py

  operational-incidents:
    name: Operational incident recovery loop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest pytest-cov 'coverage>=7.10' fastapi httpx jinja2 jsonschema pydantic psycopg[binary] python-dotenv beautifulsoup4 requests json-repair cryptography black==25.1.0 isort==6.0.1 mypy bandit
      - name: Verify automatic reporting, isolation, retries, remedies and recovery outcomes
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/modules/operational_incidents
          tests/modules/operational_incidents tests/plugins/test_operational_incident_client.py
          tests/plugins/test_incident_task_scope.py
          tests/plugins/test_pdf_recovery_incidents.py
          tests/plugins/test_vera_integrity_incident_reporting.py tests/plugins/test_vera_verified_execution.py
          tests/plugins/test_incident_technical_runner.py
          tests/plugins/test_incident_native_host.py
          tests/plugins/test_native_incident_transport.py
          --cov --cov-config=tests/operational_incidents.coveragerc --cov-report=term-missing --cov-fail-under=80
      - name: Verify effective open-item projection coverage
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/modules/operational_incidents
          tests/modules/operational_incidents/test_monitor_summary.py
          --cov=scripts.summarize_incident_monitor --cov-report=term-missing --cov-fail-under=80
      - name: Check incident code quality
        run: |
          python -m black --check tests/plugins/test_pdf_recovery_incidents.py
          python -m isort --check-only tests/plugins/test_pdf_recovery_incidents.py
          python -m black --check tests/plugins/test_native_incident_transport.py
          python -m isort --check-only tests/plugins/test_native_incident_transport.py
          python -m mypy --config-file=tests/plugin_runtime.mypy.ini modules/operational_incidents/recovery.py
          python -m black --check modules/operational_incidents plugins/vera/scripts/operational_incidents.py scripts/manage_incidents.py tests/modules/operational_incidents tests/plugins/test_operational_incident_client.py tests/plugins/test_vera_integrity_incident_reporting.py tests/plugins/test_incident_technical_runner.py tests/plugins/test_incident_native_host.py plugins/vera/scripts/technical_runner.py plugins/vera/scripts/verified_execution.py plugins/vera/scripts/check_dependencies.py plugins/vera/scripts/managed_python_runtime.py
          python -m isort --check-only modules/operational_incidents plugins/vera/scripts/operational_incidents.py scripts/manage_incidents.py tests/modules/operational_incidents tests/plugins/test_operational_incident_client.py tests/plugins/test_vera_integrity_incident_reporting.py tests/plugins/test_incident_technical_runner.py tests/plugins/test_incident_native_host.py plugins/vera/scripts/technical_runner.py plugins/vera/scripts/verified_execution.py plugins/vera/scripts/check_dependencies.py plugins/vera/scripts/managed_python_runtime.py
          python -m black --check scripts/summarize_incident_monitor.py scripts/render_incident_alert.py
          python -m isort --check-only scripts/summarize_incident_monitor.py scripts/render_incident_alert.py
          python -m mypy --config-file=tests/plugin_runtime.mypy.ini modules/operational_incidents/api.py modules/operational_incidents/oauth.py modules/operational_incidents/contracts.py modules/operational_incidents/store.py modules/operational_incidents/evidence.py plugins/vera/scripts/operational_incidents.py plugins/vera/scripts/technical_runner.py scripts/manage_incidents.py scripts/summarize_incident_monitor.py scripts/render_incident_alert.py modules/operational_incidents/reporting.py
          python -m bandit -q -ll modules/operational_incidents/*.py plugins/vera/scripts/operational_incidents.py plugins/vera/scripts/technical_runner.py scripts/manage_incidents.py scripts/summarize_incident_monitor.py scripts/render_incident_alert.py modules/operational_incidents/reporting.py

  workflow-usage:
    name: Product task usage and satisfaction loop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest pytest-cov fastapi httpx jinja2 jsonschema pydantic psycopg[binary] python-dotenv beautifulsoup4 requests json-repair cryptography black==25.1.0 isort==6.0.1 mypy bandit
      - name: Verify lifecycle, receipts, feedback, isolation and durable replay
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/modules/workflow_usage
          tests/modules/workflow_usage tests/modules/run_receipts
          --cov=modules.workflow_usage --cov-report=term-missing --cov-fail-under=80
      - name: Check usage code quality
        run: |
          python -m black --check modules/workflow_usage plugins/vera/scripts/workflow_usage.py scripts/manage_workflow_usage.py tests/modules/workflow_usage
          python -m isort --check-only modules/workflow_usage plugins/vera/scripts/workflow_usage.py scripts/manage_workflow_usage.py tests/modules/workflow_usage
          python -m mypy --config-file=tests/plugin_runtime.mypy.ini modules/workflow_usage plugins/vera/scripts/workflow_usage.py scripts/manage_workflow_usage.py
          python -m bandit -q -ll -r modules/workflow_usage plugins/vera/scripts/workflow_usage.py scripts/manage_workflow_usage.py

  native-task-reporting:
    name: Native task reporting (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest fastapi httpx jinja2 jsonschema pydantic psycopg[binary] python-dotenv beautifulsoup4 requests json-repair cryptography black==25.1.0 isort==6.0.1
      - name: Verify native persistence, owner binding and task-scoped replay
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/modules/workflow_usage
          tests/plugins/test_native_workflow_usage.py tests/plugins/test_incident_native_host.py
          tests/plugins/test_native_incident_transport.py
          tests/plugins/test_native_execution.py tests/plugins/test_incident_task_scope.py
          tests/plugins/test_live_plugin_runtime.py tests/scripts/test_install_local_vera.py
      - run: python -m black --check tests/plugins/test_native_workflow_usage.py tests/plugins/test_incident_native_host.py tests/plugins/test_native_execution.py tests/plugins/test_incident_task_scope.py plugins/vera/scripts/native_execution.py
      - run: python -m isort --check-only tests/plugins/test_native_workflow_usage.py tests/plugins/test_incident_native_host.py tests/plugins/test_native_execution.py tests/plugins/test_incident_task_scope.py plugins/vera/scripts/native_execution.py

  reporting-postgres:
    name: Product reporting on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reporting_test
          POSTGRES_PASSWORD: reporting_test
          POSTGRES_DB: reporting_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reporting_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REPORTING_TEST_POSTGRES_DSN: postgresql://reporting_test:reporting_test@localhost:5432/reporting_test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest fastapi httpx jinja2 jsonschema pydantic psycopg[binary] python-dotenv beautifulsoup4 requests json-repair cryptography
      - run: python -m pytest -q -o addopts='' --confcutdir=tests/modules/workflow_usage tests/modules/workflow_usage/test_product_parity.py tests/modules/workflow_usage/test_connector_host_link.py tests/modules/run_receipts/test_archive_binding.py
      - run: python scripts/sync_reporting_runtime.py --check

  annual-statements:
    name: Annual statement analysis and editable exports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared annual statement dependencies and verification tools
        run: >-
          python -m pip install pytest pytest-cov 'coverage>=7.10' black==25.1.0 isort==6.0.1 mypy bandit
          -r plugins/financial-analysis/requirements.txt
      - name: Verify source cells, reconciliation, managed execution and Office outputs
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_annual_statements.py tests/plugins/test_vera_financial_analysis.py
          --cov --cov-config=tests/annual_statements.coveragerc --cov-report=term-missing --cov-fail-under=80
      - name: Check annual statement code quality
        run: |
          python -m black --check plugins/financial-analysis/scripts/annual_statements.py plugins/financial-analysis/scripts/annual_statements_render.py plugins/financial-analysis/scripts/run_annual_statements.py tests/plugins/test_annual_statements.py
          python -m isort --check-only plugins/financial-analysis/scripts/annual_statements.py plugins/financial-analysis/scripts/annual_statements_render.py plugins/financial-analysis/scripts/run_annual_statements.py tests/plugins/test_annual_statements.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/financial-analysis/scripts/annual_statements.py plugins/financial-analysis/scripts/annual_statements_render.py plugins/financial-analysis/scripts/run_annual_statements.py
          python -m bandit -q -ll plugins/financial-analysis/scripts/annual_statements.py plugins/financial-analysis/scripts/annual_statements_render.py plugins/financial-analysis/scripts/run_annual_statements.py

  rating-legalita:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit -r plugins/rating-legalita/requirements.txt
      - name: Verify rating evidence, history, arithmetic and archive binding
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_rating_legalita_case.py tests/plugins/test_rating_legalita_core.py tests/plugins/test_rating_legalita_practice.py
          --cov --cov-config=tests/rating_legalita.coveragerc --cov-report=term-missing
      - name: Check rating code quality
        run: |
          python -m black --check plugins/rating-legalita/scripts tests/plugins/test_rating_legalita_case.py tests/plugins/test_rating_legalita_core.py tests/plugins/test_rating_legalita_practice.py
          python -m isort --check-only plugins/rating-legalita/scripts tests/plugins/test_rating_legalita_case.py tests/plugins/test_rating_legalita_core.py tests/plugins/test_rating_legalita_practice.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/rating-legalita/scripts
          python -m bandit -q -ll -r plugins/rating-legalita/scripts

  studio-document-format:
    name: Studio document format pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install declared document dependencies and verification tools
        run: >-
          python -m pip install pytest pytest-cov 'coverage>=7.10' black==25.1.0 isort==6.0.1 mypy bandit
          -r plugins/comunicazione-professionale/requirements.txt
          -r plugins/report-builder/requirements.txt
      - name: Verify previews, approval, revision and actual report reuse
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_studio_document_format.py
          --cov --cov-config=tests/studio_document_format.coveragerc --cov-report=term-missing --cov-fail-under=80
      - name: Check document format code quality
        run: |
          python -m black --check plugins/comunicazione-professionale/scripts/review_document_format.py plugins/comunicazione-professionale/scripts/studio_document_format.py plugins/report-builder/scripts/studio_formatting.py plugins/vera/scripts/studio_document_format.py tests/plugins/test_studio_document_format.py tests/plugins/test_teaching_studio_document_format_execution.py
          python -m isort --check-only plugins/comunicazione-professionale/scripts/review_document_format.py plugins/comunicazione-professionale/scripts/studio_document_format.py plugins/report-builder/scripts/studio_formatting.py plugins/vera/scripts/studio_document_format.py tests/plugins/test_studio_document_format.py tests/plugins/test_teaching_studio_document_format_execution.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/comunicazione-professionale/scripts/review_document_format.py plugins/comunicazione-professionale/scripts/studio_document_format.py plugins/report-builder/scripts/studio_formatting.py
          python -m mypy --follow-imports=skip --ignore-missing-imports plugins/vera/scripts/studio_document_format.py
          python -m bandit -q -ll plugins/comunicazione-professionale/scripts/review_document_format.py plugins/comunicazione-professionale/scripts/studio_document_format.py plugins/report-builder/scripts/studio_formatting.py plugins/vera/scripts/studio_document_format.py

  business-valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov pypdf black==25.1.0 isort==6.0.1 mypy bandit -r plugins/business-valuation/requirements.txt -r plugins/business-planning/requirements.txt
      - name: Verify valuation calculations, evidence and plan replay
        run: python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_business_valuation.py tests/plugins/test_business_valuation_benchmarks.py tests/plugins/test_business_valuation_ecb.py tests/plugins/test_business_valuation_income.py tests/plugins/test_business_valuation_residual.py tests/plugins/test_business_valuation_holding.py tests/plugins/test_business_valuation_comparables.py tests/plugins/test_business_valuation_economic.py tests/plugins/test_business_valuation_mandate.py tests/plugins/test_business_valuation_dependencies.py tests/plugins/test_clara_public_http.py --cov=plugins/business-valuation/scripts --cov-report=term-missing --cov-fail-under=80
      - name: Check valuation code quality
        run: |
          python -m black --check plugins/business-valuation/scripts tests/plugins/test_business_valuation.py tests/plugins/test_business_valuation_benchmarks.py tests/plugins/test_business_valuation_ecb.py tests/plugins/test_business_valuation_income.py tests/plugins/test_business_valuation_residual.py tests/plugins/test_business_valuation_holding.py tests/plugins/test_business_valuation_comparables.py tests/plugins/test_business_valuation_economic.py tests/plugins/test_business_valuation_mandate.py tests/plugins/test_business_valuation_dependencies.py
          python -m isort --check-only plugins/business-valuation/scripts tests/plugins/test_business_valuation.py tests/plugins/test_business_valuation_benchmarks.py tests/plugins/test_business_valuation_ecb.py tests/plugins/test_business_valuation_income.py tests/plugins/test_business_valuation_residual.py tests/plugins/test_business_valuation_holding.py tests/plugins/test_business_valuation_comparables.py tests/plugins/test_business_valuation_economic.py tests/plugins/test_business_valuation_mandate.py tests/plugins/test_business_valuation_dependencies.py
          python -m mypy --follow-imports=skip plugins/business-valuation/scripts
          python -m bandit -q -r plugins/business-valuation/scripts

  composizione-negoziata:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit -r plugins/treasury-forecast/requirements.txt -r tests/cnc_hosted_requirements.txt
      - name: Verify roles, versioned evidence, treasury handoff and resume
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_composizione_negoziata.py tests/plugins/test_cnc_completion.py tests/plugins/test_cnc_journeys.py tests/modules/cnc_review/test_api.py
          --cov=modules/cnc_review --cov=plugins/composizione-negoziata/scripts --cov-report=term-missing --cov-fail-under=80
      - name: Check CNC code quality
        run: |
          python -m black --check plugins/composizione-negoziata/scripts tests/plugins/test_composizione_negoziata.py tests/plugins/test_cnc_completion.py tests/plugins/test_cnc_journeys.py modules/cnc_review tests/modules/cnc_review
          python -m isort --check-only plugins/composizione-negoziata/scripts tests/plugins/test_composizione_negoziata.py tests/plugins/test_cnc_completion.py tests/plugins/test_cnc_journeys.py modules/cnc_review tests/modules/cnc_review
          python -m mypy --config-file=tests/plugin_runtime.mypy.ini plugins/composizione-negoziata/scripts modules/cnc_review
          python -m bandit -qr modules/cnc_review plugins/composizione-negoziata/scripts -ll

  transformation-prototype:
    name: Synthetic transformation prototype
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit
      - name: Verify case persistence, branch review and arithmetic
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_trasformazione.py --cov=plugins/trasformazione/scripts
          --cov-report=term-missing --cov-fail-under=80
      - name: Check prototype code quality
        run: |
          python -m black --check plugins/trasformazione/scripts tests/plugins/test_trasformazione.py
          python -m isort --check-only plugins/trasformazione/scripts tests/plugins/test_trasformazione.py
          python -m mypy --follow-imports=skip plugins/trasformazione/scripts
          python -m bandit -qr plugins/trasformazione/scripts

  invoice-xml:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit -r plugins/invoice-xml/requirements.txt
      - name: Verify invoice preparation, approval and XML export
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=plugins/invoice-xml/tests
          plugins/invoice-xml/tests --cov=plugins/invoice-xml/scripts
          --cov-report=term-missing --cov-fail-under=80
      - name: Check invoice code quality
        run: |
          python -m black --check plugins/invoice-xml
          python -m isort --check-only plugins/invoice-xml
          python -m mypy --config-file plugins/invoice-xml/mypy.ini plugins/invoice-xml/scripts
          python -m bandit -q -r plugins/invoice-xml/scripts

  client-file-boundaries:
    needs: product-archives
    name: Client file and privacy boundaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download product archives built from this commit
        uses: actions/download-artifact@v4
        with:
          name: product-archives
          path: plugin_packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install plugin build dependencies
        run: python -m pip install -r scripts/requirements-plugin-build.txt
      - name: Install client boundary test dependencies
        run: >-
          python -m pip install pytest pytest-cov black==25.1.0 isort==6.0.1 mypy bandit reportlab
          -r plugins/client-file-preparation/requirements.txt
          -r plugins/journal-sampling/requirements.txt
          -r plugins/check-entries/requirements.txt
          -r plugins/archive-organization/requirements.txt
      - name: Verify exact file capture across pathname and descriptor APIs
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          tests/plugins/test_check_entries_plugin.py
          -k "file_capture or exact_file_read or recipe_capture"
      - name: Verify Journal Sampling to Vouching handoff
        run: >-
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins
          "tests/plugins/test_vera_local_onboarding.py::test_vouching_kit_runs_live_sample_handoff_and_current_checks[demo-it]"
      - name: Verify file identity, model-data reports and update notices
        run: |
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_studio_archive_file_identity.py tests/plugins/test_vera_model_data_report.py tests/plugins/test_plugin_update_notifications.py

  workflow-regressions:
    needs: product-archives
    name: ${{ matrix.name }}
    # The Open-item suites alone take nearly an hour on hosted runners.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: accounting
            name: Accounting and reporting regressions
          - suite: open-item-source
            name: Open-item sources, workpapers and native regeneration
          - suite: open-item-projection
            name: Open-item public review and source coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Download product archives built from this commit
        uses: actions/download-artifact@v4
        with:
          name: product-archives
          path: plugin_packages
      - name: Set local taxonomy fixture paths
        run: |
          echo "TEACHING_TAXONOMY_CATALOGUE=$RUNNER_TEMP/teaching-bilancio-catalogue.json" >> "$GITHUB_ENV"
          echo "TEACHING_TAXONOMY_PACKAGE=$RUNNER_TEMP/teaching-PCI-2018-11-04.zip" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
