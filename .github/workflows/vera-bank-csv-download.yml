name: Vera bank CSV download

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-evidence:
    name: Bank CSV evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-cov
      - name: Verify original-file retention without bank credentials or a project
        run: >-
          python -m pytest -q -o addopts='' --noconftest
          tests/plugins/test_vera_bank_csv_download.py
          --cov --cov-config=tests/vera_bank_csv.coveragerc
          --cov-report=term-missing --cov-fail-under=80
