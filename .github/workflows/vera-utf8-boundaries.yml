name: Vera UTF-8 process and file boundaries
on:
  pull_request:
  workflow_dispatch:
env:
  MPARANZA_INCIDENT_DELIVERY: local-only
permissions:
  contents: read
jobs:
  unicode:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONUTF8: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      MPARANZA_INCIDENT_DELIVERY: local-only
      VERA_REQUIRE_CP1252: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: >-
          python -m pip install pytest python-docx
          -r scripts/requirements-plugin-build.txt
          -r plugins/studio-archive/requirements.txt
          -r plugins/bandi-agevolazioni/requirements.txt
          -r plugins/passive-invoice-audit/requirements.txt
          -r plugins/deep-research-validator/requirements.txt
      - name: Exercise real Unicode pipes, retained records and service restart
        run: >-
          python -X utf8=0 -m pytest -v -o addopts='' -o junit_family=xunit1 --confcutdir=tests/plugins
          tests/plugins/test_vera_utf8_boundaries.py
          --junitxml=utf8-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utf8-evidence-${{ matrix.os }}
          path: utf8-results.xml
