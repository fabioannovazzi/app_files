name: Clara Cowork candidate acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-reporting:
    name: Fresh Clara Cowork ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the release gate's failure handling
        run: |
          python -m pip install pytest
          python -m pytest -q -o addopts='' --confcutdir=tests/plugins tests/plugins/test_clara_cowork_release_gate.py tests/plugins/test_clara_claude_package.py
      - name: Verify shipped candidate matches canonical source
        run: python scripts/build_claude_plugin_zip.py clara --check
      - name: Exercise the actual ZIP with fresh managed dependencies
        run: >-
          python scripts/check_clara_cowork_release.py
          plugin_packages/clara/clara-claude-plugin.zip
          --output "${{ runner.temp }}/clara-acceptance"
      - name: Retain evidence, including failed commands
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clara-script-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/clara-acceptance/*.json
            ${{ runner.temp }}/clara-acceptance/*.log
            ${{ runner.temp }}/clara-acceptance/intake/
            ${{ runner.temp }}/clara-acceptance/render/
      - name: Retain exact candidate for real Cowork acceptance
        uses: actions/upload-artifact@v4
        with:
          name: clara-candidate
          path: plugin_packages/clara/clara-claude-plugin.zip
      - name: State candidate identity and remaining release checks
        if: always()
        env:
          CLARA_EVIDENCE: ${{ runner.temp }}/clara-acceptance/result.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["CLARA_EVIDENCE"])
          report = json.loads(path.read_text()) if path.is_file() else {}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("Clara candidate checks do not authorize publication.\n\n")
              summary.write(f"Script status: {report.get('status', 'unverified')}\n\n")
              summary.write(f"Version: {report.get('plugin', {}).get('version', 'unknown')}\n\n")
              summary.write(f"ZIP SHA-256: {report.get('zip_sha256', 'unknown')}\n\n")
              summary.write("Actual Cowork plugin loading, startup hooks and fresh-session workflow: unverified. Supply reviewed evidence to the release promotion gate.\n")
          PY
