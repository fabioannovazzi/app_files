[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mparanza-privacy-filter"
version = "0.1.0"
description = "Optional local Privacy Filter MCP connector for Codex desktop"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
mparanza-privacy-filter = "mparanza_privacy_filter.server:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
