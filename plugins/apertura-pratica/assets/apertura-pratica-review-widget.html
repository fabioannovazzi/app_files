<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:"Instrument Sans",system-ui,sans-serif;color:#18202c;background:#fff}body{margin:0;padding:20px}header{border-top:4px solid #00b0f0;padding:18px 0;border-bottom:1px solid #d9e0e7}h1{margin:6px 0;color:#002060}p{line-height:1.5}.scope{margin-top:24px}.scope h2{font-size:18px;color:#002060;border-bottom:1px solid #002060;padding-bottom:8px}.item{padding:14px 0;border-bottom:1px solid #d9e0e7}.item h3{font-size:16px;margin:0 0 6px}.meta{font-size:12px;color:#5f6876}pre{font:11px/1.45 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.notice{color:#5f6876}
</style></head><body><header><div class="meta">LUCIA · APERTURA PRATICA</div><h1>Revisione della pratica</h1><p class="notice">Vista di lettura. Le decisioni vengono salvate e applicate separatamente, con conferma esplicita.</p></header><main id="root"><p>Caricamento…</p></main><script>
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));function render(v){const p=v?.review_payload||v;const root=document.querySelector("#root");if(!p||!Array.isArray(p.items)){root.innerHTML="<p>Nessun payload di revisione disponibile.</p>";return}const groups={};p.items.forEach(i=>(groups[i.scope]??=[]).push(i));root.innerHTML=Object.entries(groups).map(([s,items])=>`<section class="scope"><h2>${esc(s)}</h2>${items.map(i=>`<article class="item"><h3>${esc(i.title)}</h3><div class="meta">${esc(i.status)} · proposta ${esc(i.recommended_action)}</div><pre>${esc(JSON.stringify(i.data,null,2))}</pre></article>`).join("")}</section>`).join("")};render(window.openai?.toolOutput||window.openai?.structuredContent);window.addEventListener("openai:set_globals",e=>render(e.detail?.globals?.toolOutput||e.detail?.globals?.structuredContent));
</script></body></html>
