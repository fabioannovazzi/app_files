interface:
  display_name: "Create narrated videos"
  short_description: "Turn approved research scenes or property photos into reviewed MP4s"
  default_prompt: "Use $research-video to turn my approved ordered research images or real-estate photographs into a source-faithful landscape, vertical, or square video with optional on-screen text and rights-cleared local music, narration generated through authenticated Mparanza access in my chosen supported language, captions, a visible AI-voice disclosure, a reviewable narration script, and validated local artifacts. Do not require a user API key."
