<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clara · Archivio dello studio</title>
<style>
@font-face{font-family:Instrument Sans;src:url(data:font/ttf;base64,__FONT__) format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:Instrument Sans;src:url(data:font/ttf;base64,__FONT_BOLD__) format('truetype');font-weight:600 800;font-display:swap}
:root{color-scheme:light;font:16px "Instrument Sans",sans-serif;color:#1f2421;background:#fff;--accent:#194b70;--line:#e8eae7;--muted:#596671}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{padding:9px 13px;min-height:40px;border:1px solid var(--line);background:#fff;color:var(--accent);cursor:pointer}button:hover{border-color:var(--accent);background:#eff5f9}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.top{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line)}.brand{font-size:24px;font-weight:650}.top button{margin-left:auto}main{max-width:840px;padding:24px;margin:auto}h1{font-size:24px;margin:16px 0}#status{max-width:840px;margin:12px auto;padding:0 24px;color:var(--muted)}nav:empty{display:none}.search{display:grid;gap:6px;max-width:480px;margin:20px 0}.search input{min-width:0;padding:10px;border:1px solid var(--line)}.work-row{padding:16px 0;border-bottom:1px solid var(--line)}.archive-link{border:0;padding-left:0;text-align:left}.caption{color:var(--muted)}.actions{margin-top:24px}.primary{background:var(--accent);color:#fff}button:disabled{opacity:.6;cursor:default}@media(max-width:480px){.top{padding:12px;gap:8px}.top>span:nth-child(2){font-size:14px}main{padding:16px}button{max-width:100%;white-space:normal}}
</style></head>
<body>
<header class="top"><span class="brand">Clara</span><span id="title"></span><button id="refresh" disabled></button></header>
<p id="status" role="status"></p><main><nav id="nav"></nav><div id="main"></div></main>
<script>
"use strict";
const translations = {"en": {"title": "Studio Archive", "refresh": "Refresh", "back": "← Clients", "clients": "Clients and projects", "configure": "Set up Studio Archive in the Clara chat.", "blocked": "This record is unavailable. Check its registration in chat.", "open": "Open", "noMatch": "No matches.", "noMatters": "No engagements for this client.", "noClients": "No registered clients.", "findMatter": "Find an engagement", "findClient": "Find a client", "unsupported": "This host cannot open a chat from this panel. Continue in the Clara chat.", "clientChat": "Start work for this client", "newChat": "Start a new Clara chat", "loading": "Loading…", "unavailable": "Archive unavailable. Refresh or check its connection in chat.", "unconfirmed": "Opening was not confirmed. Check your chats before trying again.", "opening": "Opening a new chat…", "sent": "Request sent. Check the new chat.", "prompt": "Use Clara to continue work in Studio Archive. Verify the selected IDs with local tools. For an engagement, call clara_archive_case to resume its saved case before asking what to do next. Respond in English. Selection:"}, "it": {"title": "Archivio dello studio", "refresh": "Aggiorna", "back": "← Clienti", "clients": "Clienti e progetti", "configure": "Configura l’Archivio dello studio nella chat di Clara.", "blocked": "Record non disponibile. Verifica la registrazione nella chat.", "open": "Apri", "noMatch": "Nessun risultato.", "noMatters": "Nessun incarico per questo cliente.", "noClients": "Nessun cliente registrato.", "findMatter": "Cerca un incarico", "findClient": "Cerca un cliente", "unsupported": "Questo host non apre chat dal pannello. Continua nella chat di Clara.", "clientChat": "Inizia un lavoro per questo cliente", "newChat": "Apri una nuova chat con Clara", "loading": "Caricamento…", "unavailable": "Archivio non disponibile. Aggiorna o verifica il collegamento nella chat.", "unconfirmed": "Apertura non confermata. Controlla le chat prima di riprovare.", "opening": "Apertura della nuova chat…", "sent": "Richiesta inviata. Controlla la nuova chat.", "prompt": "Usa Clara per proseguire il lavoro nell’Archivio dello studio. Verifica gli ID selezionati con gli strumenti locali. Per un incarico usa clara_archive_case per riprendere il caso salvato prima di chiedere come proseguire. Rispondi in italiano. Selezione:"}, "fr": {"title": "Archives du cabinet", "refresh": "Actualiser", "back": "← Clients", "clients": "Clients et projets", "configure": "Configurez les archives dans la conversation Clara.", "blocked": "Dossier indisponible. Vérifiez son enregistrement dans la conversation.", "open": "Ouvrir", "noMatch": "Aucun résultat.", "noMatters": "Aucune mission pour ce client.", "noClients": "Aucun client enregistré.", "findMatter": "Rechercher une mission", "findClient": "Rechercher un client", "unsupported": "Cet environnement ne peut pas ouvrir de conversation depuis ce panneau. Continuez avec Clara.", "clientChat": "Commencer un travail pour ce client", "newChat": "Nouvelle conversation Clara", "loading": "Chargement…", "unavailable": "Archives indisponibles. Actualisez ou vérifiez la connexion avec Clara.", "unconfirmed": "Ouverture non confirmée. Vérifiez vos conversations avant de réessayer.", "opening": "Ouverture d’une conversation…", "sent": "Demande envoyée. Vérifiez la nouvelle conversation.", "prompt": "Utilise Clara pour reprendre le travail dans les archives. Vérifie les identifiants avec les outils locaux. Pour une mission, appelle clara_archive_case avant de demander comment poursuivre. Réponds en français. Sélection :"}, "de": {"title": "Kanzleiarchiv", "refresh": "Aktualisieren", "back": "← Mandanten", "clients": "Mandanten und Projekte", "configure": "Richten Sie das Archiv im Clara-Chat ein.", "blocked": "Eintrag nicht verfügbar. Prüfen Sie die Registrierung im Chat.", "open": "Öffnen:", "noMatch": "Keine Treffer.", "noMatters": "Keine Aufträge für diesen Mandanten.", "noClients": "Keine registrierten Mandanten.", "findMatter": "Auftrag suchen", "findClient": "Mandanten suchen", "unsupported": "Dieser Host kann hier keinen Chat öffnen. Fahren Sie im Clara-Chat fort.", "clientChat": "Arbeit für diesen Mandanten beginnen", "newChat": "Neuer Clara-Chat", "loading": "Wird geladen…", "unavailable": "Archiv nicht verfügbar. Aktualisieren oder Verbindung im Chat prüfen.", "unconfirmed": "Öffnen nicht bestätigt. Prüfen Sie Ihre Chats vor einem neuen Versuch.", "opening": "Neuer Chat wird geöffnet…", "sent": "Anfrage gesendet. Prüfen Sie den neuen Chat.", "prompt": "Nutze Clara für die Arbeit im Archiv. Prüfe die ausgewählten IDs mit lokalen Werkzeugen. Rufe bei einem Auftrag zuerst clara_archive_case auf. Antworte auf Deutsch. Auswahl:"}, "es": {"title": "Archivo del despacho", "refresh": "Actualizar", "back": "← Clientes", "clients": "Clientes y proyectos", "configure": "Configura el archivo en el chat de Clara.", "blocked": "Registro no disponible. Comprueba su registro en el chat.", "open": "Abrir", "noMatch": "Sin resultados.", "noMatters": "No hay encargos para este cliente.", "noClients": "No hay clientes registrados.", "findMatter": "Buscar un encargo", "findClient": "Buscar un cliente", "unsupported": "Este entorno no puede abrir un chat desde el panel. Continúa en el chat de Clara.", "clientChat": "Iniciar un trabajo para este cliente", "newChat": "Nuevo chat con Clara", "loading": "Cargando…", "unavailable": "Archivo no disponible. Actualiza o comprueba la conexión en el chat.", "unconfirmed": "Apertura sin confirmar. Comprueba los chats antes de reintentar.", "opening": "Abriendo un nuevo chat…", "sent": "Solicitud enviada. Comprueba el nuevo chat.", "prompt": "Usa Clara para continuar el trabajo en el archivo. Verifica los identificadores con las herramientas locales. Para un encargo llama primero a clara_archive_case. Responde en español. Selección:"}};
let copy=translations.en,host,sequence=0,generation=0,loading=false,sending=false;
let clients=[],matters=[],selectedClient=null,configured=false;
const sent=new Set(),pending=new Map();
const main=document.getElementById('main'),nav=document.getElementById('nav'),status=document.getElementById('status'),refresh=document.getElementById('refresh');
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function button(text,action,cls){const e=node('button',text,cls);e.addEventListener('click',action);return e;}
function key(matter){return JSON.stringify([selectedClient?.client_id||null,matter?.engagement_id||null]);}
function supported(){return !!host?.hostCapabilities?.experimental?.['openai/message'];}
function request(method,params){const id=++sequence;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error(copy.unconfirmed));},method==='ui/message'?300000:30000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
async function archive(name,args={}){const reply=await request('tools/call',{name,arguments:args});const data=reply?._meta?.archive;if(reply?.isError||!data||data.error)throw new Error(copy.unavailable);return data;}
function launch(label,matter){const b=button(label,()=>openChat(matter),'archive-link');b.disabled=loading||sending||sent.has(key(matter))||!supported();return b;}
function render(){
 nav.replaceChildren();main.replaceChildren();refresh.disabled=loading||sending||!host;
 if(selectedClient)nav.append(button(copy.back,()=>loadClients()));
 main.append(node('h1',selectedClient?.display_name||copy.clients));
 if(!configured)main.append(node('p',copy.configure,'caption'));
 else if(!loading){
  const rows=selectedClient?matters:clients,list=node('div');
  function show(query=''){list.replaceChildren();const visible=rows.filter(row=>(row.display_name||row.label||'').toLowerCase().includes(query.toLowerCase()));
   for(const row of visible){const section=node('section',undefined,'work-row'),title=row.display_name||row.label;
    const blocked=selectedClient?row.status==='blocked':row.registration_status!=='registered'||!row.client_id;
    if(blocked)section.append(node('h2',title),node('p',copy.blocked,'caption'));
    else section.append(selectedClient?launch(copy.open+' '+title,row):button(title,()=>loadMatters(row),'archive-link'));
    list.append(section);}
   if(!visible.length)list.append(node('p',rows.length?copy.noMatch:selectedClient?copy.noMatters:copy.noClients,'caption'));}
  if(rows.length>1){const label=node('label',undefined,'search'),input=node('input');input.type='search';label.append(node('span',selectedClient?copy.findMatter:copy.findClient),input);input.addEventListener('input',()=>show(input.value));main.append(label);}
  show();main.append(list);
 }
 if(!supported()&&host)main.append(node('p',copy.unsupported,'caption'));
 const actions=node('div',undefined,'actions'),start=launch(selectedClient?copy.clientChat:copy.newChat,null);start.className='primary';actions.append(start);main.append(actions);
}
async function loadClients(initial){const current=++generation;loading=true;selectedClient=null;clients=[];matters=[];render();status.textContent=copy.loading;
 try{const result=initial??await archive('clara_archive_open');if(current!==generation)return;if(result.error)throw new Error(copy.unavailable);configured=result.configured===true;clients=result.clients??[];status.textContent='';}
 catch(error){if(current===generation)status.textContent=error.message;}finally{if(current===generation){loading=false;render();}}}
async function loadMatters(client){const current=++generation;loading=true;selectedClient=client;matters=[];render();status.textContent=copy.loading;
 try{const result=await archive('clara_archive_list_matters',{client_id:client.client_id});if(current!==generation)return;matters=result.engagements??[];status.textContent='';}
 catch(error){if(current===generation)status.textContent=error.message;}finally{if(current===generation){loading=false;render();}}}
async function openChat(matter){const selected=key(matter);if(sending||loading||sent.has(selected)||!supported())return;
 const selection=selectedClient?{client_id:selectedClient.client_id,...(matter?{engagement_id:matter.engagement_id}:{})}:null;
 const text=copy.prompt+(selection?' '+JSON.stringify(selection):'');
 sending=true;sent.add(selected);render();status.textContent=copy.opening;
 try{const result=await request('ui/message',{role:'user',content:[{type:'text',text}],_meta:{'openai/message':{target:'new'}}});if(result?.isError){sent.delete(selected);throw new Error(copy.unconfirmed);}status.textContent=copy.sent;}
 catch(error){status.textContent=error.message;}finally{sending=false;render();}}
refresh.addEventListener('click',()=>selectedClient?loadMatters(selectedClient):loadClients());
addEventListener('message',event=>{if(event.source!==parent||event.data?.jsonrpc!=='2.0')return;const m=event.data,item=pending.get(m.id);if(item&&!m.method){clearTimeout(item.timer);pending.delete(m.id);m.error?item.reject(new Error(copy.unconfirmed)):item.resolve(m.result);}
 if(m.method==='ui/notifications/tool-result'&&generation===0&&m.params?._meta?.archive)loadClients(m.params._meta.archive);
 if(m.method==='ui/resource-teardown')parent.postMessage({jsonrpc:'2.0',id:m.id,result:{}},'*');});
request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Clara Studio Archive',version:'1.2.0'},appCapabilities:{availableDisplayModes:['fullscreen']}}).then(result=>{host=result;const language=(result.hostContext?.locale||'en').split('-')[0];copy=translations[language]||translations.en;document.documentElement.lang=translations[language]?language:'en';document.title='Clara · '+copy.title;document.getElementById('title').textContent=copy.title;refresh.textContent=copy.refresh;nav.setAttribute('aria-label',copy.title);parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');if(generation===0)loadClients();else render();}).catch(()=>{status.textContent=copy.unavailable;});
</script></body></html>
